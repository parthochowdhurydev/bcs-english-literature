    if(mode!=="mix"&&mode!=="flash")pool=pool.filter(q=>validTypes(q).includes(mode));
    if(!pool.length){alert("No quotations available for this selection.");return}
    pool=shuffle(pool);const n=+$("#pn").value;if(n)pool=pool.slice(0,n);
    P={mode,list:mode==="flash"?pool:pool.map(q=>makeQuestion(q,mode==="mix"?null:mode)),i:0,score:0,show:false};
    drawPractice();
  };
}
function drawPractice(){
  if(P.i>=P.list.length){
    const f=P.mode==="flash";
    $("#app").innerHTML=`<div class="card" style="text-align:center"><h2>${f?"Flashcards finished":"Practice complete"}</h2>
    ${f?`<p>You reviewed ${P.list.length} cards.</p>`:`<div class="score">${P.score} / ${P.list.length}</div><p>${Math.round(P.score/P.list.length*100)}% correct</p>`}
    <button class="btn" onclick="viewPractice()">New practice</button></div>`;return;
  }
  const pct=Math.round(P.i/P.list.length*100);
  const head=`<div class="small">Question ${P.i+1} of ${P.list.length}${P.mode==="flash"?"":` · Score ${P.score}`}</div><div class="progress"><div style="width:${pct}%"></div></div>`;
  if(P.mode==="flash"){
    const q=Q[P.list[P.i].id];
    $("#app").innerHTML=head+`<div class="card flash practice-card"><p class="q-text">&ldquo;${esc(q.q)}&rdquo;</p>
    ${P.show?`<p class="q-bn bn">${esc(q.b)}</p><div class="meta" style="justify-content:center"><span class="who">${esc(q.c||q.a)}</span>${q.c?`<span class="small">— ${esc(q.a)}</span>`:""}${q.s?`<span class="src">${esc(q.s)}</span>`:""}</div>`:`<button class="btn alt" id="rv">Show answer</button>`}
    <div class="row" style="justify-content:center;margin-top:16px">
      <button class="btn alt" id="pv" ${P.i?"":"disabled"}>← Back</button>
      <button class="rd ${isRead(q.id)?"on":""}" data-rd="${q.id}">${isRead(q.id)?"✓ পড়া হয়েছে":"○ পড়া হয়েছে মার্ক করুন"}</button>
    <button class="bm ${BM.has(q.id)?"on":""}" data-bm="${q.id}">${BM.has(q.id)?"★ Bookmarked":"☆ Bookmark"}</button>
      <button class="btn" id="nx">Next →</button></div></div>`;
    if($("#rv"))$("#rv").onclick=()=>{P.show=true;drawPractice()};
    $("#pv").onclick=()=>{P.i--;P.show=false;drawPractice()};
    $("#nx").onclick=()=>{P.i++;P.show=false;drawPractice()};
    return;
  }
  const it=P.list[P.i],q=Q[it.id],ans=it.sel!==null;
  $("#app").innerHTML=head+`<div class="card practice-card"><div class="qtype">${TYPE_LABEL[it.type]}</div>
  <p class="q-text">&ldquo;${esc(q.q)}&rdquo;</p>
  ${it.opts.map((o,k)=>{
    let c="";if(ans){if(o===it.correct)c="right";else if(k===it.sel)c="wrong"}
    return `<button class="opt ${c}" data-k="${k}" ${ans?"disabled":""}>${esc(o)}</button>`}).join("")}
  ${ans?`<div class="feedback ${it.opts[it.sel]===it.correct?"ok":"no"}">
    ${it.opts[it.sel]===it.correct?"✔ Correct!":"✘ Wrong. Correct answer: <b>"+esc(it.correct)+"</b>"}
    <div class="bn" style="margin-top:6px">${esc(q.b)}</div>
    <div class="small" style="margin-top:4px">${esc(q.c||q.a)}${q.c?" — "+esc(q.a):""}${q.s?" · "+esc(q.s):""}</div></div>`:""}
  <div class="row" style="margin-top:12px"><button class="rd ${isRead(q.id)?"on":""}" data-rd="${q.id}">${isRead(q.id)?"✓ পড়া হয়েছে":"○ পড়া হয়েছে মার্ক করুন"}</button>
    <button class="bm ${BM.has(q.id)?"on":""}" data-bm="${q.id}">${BM.has(q.id)?"★ Bookmarked":"☆ Bookmark"}</button>
  ${ans?`<button class="btn" id="nx" style="margin-left:auto">${P.i+1<P.list.length?"Next →":"Finish"}</button>`:""}</div></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    it.sel=+b.dataset.k;if(it.opts[it.sel]===it.correct)P.score++;
    if(it.opts[it.sel]!==it.correct){BM.add(it.id);saveBM()}
    drawPractice();
  });
  if($("#nx"))$("#nx").onclick=()=>{P.i++;drawPractice()};
}

/* ---------------- EXAM ---------------- */
let E=null,timerId=null;
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function viewExam(){
  E=null;
  const hist=load("bcsq_hist",[]);
  $("#app").innerHTML=`<div class="card"><h2 style="margin-top:0">Exam</h2>
  <p class="small">No feedback during the exam. Results and review are shown after you submit. Wrong answers are bookmarked automatically.</p>
  <div class="card" style="margin:10px 0;padding:12px 14px"><b class="bn">লেখক নির্বাচন করুন (একাধিক সিলেক্ট করা যাবে)</b>
    <div class="row" style="margin:8px 0"><button type="button" class="btn alt" id="eall">সবাই</button><button type="button" class="btn alt" id="enone">কেউ না</button><button type="button" class="btn alt" id="ebm">শুধু Bookmarks</button><span class="small" id="ecnt"></span></div>
    <input type="text" id="efind" placeholder="লেখক খুঁজুন…" style="width:100%;margin-bottom:8px">
    <div id="elist" style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff">
    ${AUTHORS.map(a=>`<label class="eau" data-n="${esc(a.toLowerCase())}" style="display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer"><input type="checkbox" value="${esc(a)}"> <span>${esc(a)}</span> <span class="small">(${Q.filter(q=>q.a===a).length})</span></label>`).join("")}
    </div></div>
  <div class="row"><label>Questions</label><select id="en"><option>10</option><option selected>20</option><option>30</option><option>50</option></select></div>
  <div class="row"><label>Time</label><select id="et"><option value="0.5">30 sec / question</option><option value="1" selected>1 min / question</option><option value="1.5">90 sec / question</option><option value="0">No time limit</option></select></div>
  <button class="btn" id="ego">Start exam</button></div>
  ${hist.length?`<div class="card"><b>Previous results</b>${hist.slice(-8).reverse().map(h=>`<div class="small" style="margin-top:6px">${esc(h.d)} — <b>${h.s}/${h.n}</b> (${Math.round(h.s/h.n*100)}%) · ${esc(h.sc)}</div>`).join("")}</div>`:""}`;
  const cbs=()=>[...document.querySelectorAll("#elist input")];
  const upd=()=>{const n=cbs().filter(x=>x.checked);$("#ecnt").textContent=n.length+" জন নির্বাচিত · "+Q.filter(q=>n.some(x=>x.value===q.a)).length+"টি উক্তি"};
  cbs().forEach(x=>x.onchange=upd);
  $("#eall").onclick=()=>{cbs().forEach(x=>x.checked=true);upd()};
  $("#enone").onclick=()=>{cbs().forEach(x=>x.checked=false);upd()};
  $("#ebm").onclick=()=>{const bmA=new Set(Q.filter(q=>BM.has(q.id)).map(q=>q.a));if(!bmA.size){alert("কোনো Bookmark নেই।");return}cbs().forEach(x=>x.checked=bmA.has(x.value));upd()};
  $("#efind").oninput=e=>{const t=e.target.value.trim().toLowerCase();document.querySelectorAll(".eau").forEach(l=>l.style.display=(!t||l.dataset.n.includes(t))?"flex":"none")};
  cbs().forEach(x=>{if(x.value==="William Shakespeare")x.checked=true});upd();
  $("#ego").onclick=()=>{
    const sel=[...document.querySelectorAll("#elist input:checked")].map(x=>x.value);
    if(!sel.length){alert("কমপক্ষে একজন লেখক নির্বাচন করুন।");return}
    let pool=shuffle(Q.filter(q=>sel.includes(q.a)));
    if(!pool.length){alert("No quotations available for this selection.");return}
    pool=pool.slice(0,+$("#en").value);
    const mins=+$("#et").value*pool.length;
    E={qs:pool.map(q=>makeQuestion(q)),i:0,left:Math.round(mins*60),limited:mins>0,scope:sel.length>3?sel.slice(0,3).join(", ")+" +"+(sel.length-3):sel.join(", "),done:false};
    drawExam();
    if(E.limited)timerId=setInterval(()=>{E.left--;const t=$("#tm");if(t)t.textContent=fmt(E.left);if(E.left<=0){submitExam()}},1000);
  };
}
function drawExam(){
  const it=E.qs[E.i],q=Q[it.id];
  const answered=E.qs.filter(x=>x.sel!==null).length;
  $("#app").innerHTML=`<div class="row" style="justify-content:space-between"><span class="small">Question ${E.i+1} / ${E.qs.length} · Answered ${answered}</span>${E.limited?`<span class="timer" id="tm">${fmt(E.left)}</span>`:""}</div>
  <div class="progress"><div style="width:${Math.round(answered/E.qs.length*100)}%"></div></div>
  <div class="card"><div class="qtype">${TYPE_LABEL[it.type]}</div>
  <p class="q-text">&ldquo;${esc(q.q)}&rdquo;</p>
  ${it.opts.map((o,k)=>`<button class="opt ${it.sel===k?"sel":""}" data-k="${k}">${esc(o)}</button>`).join("")}
  <div class="row" style="margin-top:12px">
    <button class="btn alt" id="pv" ${E.i?"":"disabled"}>← Prev</button>
    <button class="btn alt" id="nx" ${E.i<E.qs.length-1?"":"disabled"}>Next →</button>
    <button class="btn" id="sub" style="margin-left:auto">Submit exam</button></div></div>
  <div class="card"><div class="small">Question palette</div><div class="pal">${E.qs.map((x,k)=>`<button data-j="${k}" class="${x.sel!==null?"done":""} ${k===E.i?"cur":""}">${k+1}</button>`).join("")}</div></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{it.sel=+b.dataset.k;drawExam()});
  document.querySelectorAll(".pal button").forEach(b=>b.onclick=()=>{E.i=+b.dataset.j;drawExam()});
  $("#pv").onclick=()=>{E.i--;drawExam()};
  $("#nx").onclick=()=>{E.i++;drawExam()};
  $("#sub").onclick=()=>{
    const un=E.qs.length-answered;
    if(!un||confirm(`${un} question(s) unanswered. Submit anyway?`))submitExam();
  };
}
function submitExam(){
  if(E.done)return;E.done=true;stopTimer();
  let s=0;
  E.qs.forEach(x=>{if(x.sel!==null&&x.opts[x.sel]===x.correct)s++;else{BM.add(x.id)}});
  saveBM();
  const hist=load("bcsq_hist",[]);
  hist.push({d:new Date().toLocaleString(),s:s,n:E.qs.length,sc:E.scope});save("bcsq_hist",hist.slice(-30));
  const pct=Math.round(s/E.qs.length*100);
  $("#app").innerHTML=`<div class="card" style="text-align:center"><h2 style="margin-top:0">Exam result</h2>
  <div class="score">${s} / ${E.qs.length}</div><p>${pct}% · ${pct>=80?"Excellent!":pct>=60?"Good, keep practising.":"Needs more practice."}</p>
  <p class="small">Wrong or skipped quotations were added to your Bookmarks.</p>
  <button class="btn" onclick="viewExam()">New exam</button></div>
  <h3>Review</h3>`+E.qs.map((x,k)=>{
    const q=Q[x.id],ok=x.sel!==null&&x.opts[x.sel]===x.correct;
    return `<div class="card"><div class="small">${k+1}. ${TYPE_LABEL[x.type]}</div>
    <p class="q-text">&ldquo;${esc(q.q)}&rdquo;</p>
    <div class="feedback ${ok?"ok":"no"}">${ok?"✔ Correct":"✘ "+(x.sel===null?"Not answered":"Your answer: "+esc(x.opts[x.sel]))}<br>Correct answer: <b>${esc(x.correct)}</b>
    <div class="bn" style="margin-top:4px">${esc(q.b)}</div>
    <div class="small">${esc(q.c||q.a)}${q.s?" · "+esc(q.s):""}</div></div></div>`}).join("");
}

function viewBookmarks(){
  const list=Q.filter(q=>BM.has(q.id));
  $("#app").innerHTML=list.length?`<div class="row" style="justify-content:space-between"><span class="small">${list.length} bookmarked</span>
  <span><button class="btn alt" id="bp">Practice bookmarks</button> <button class="btn danger" id="bc">Clear all</button></span></div>${list.map(q=>quoteCard(q)).join("")}`
  :`<div class="empty">No bookmarks yet.<br>Tap ☆ Bookmark on any quotation. Wrong answers in practice/exam are added here automatically.</div>`;
  if(list.length){
    $("#bp").onclick=()=>{go("practice");$("#ps").value="bm"};
    $("#bc").onclick=()=>{if(confirm("Remove all bookmarks?")){BM.clear();saveBM();viewBookmarks()}};
  }
}

"প্রথম অঙ্ক: রাজা হ্যামলেটের হঠাৎ মৃত্যুর পর তাঁর ভাই ক্লদিয়াস রাজা হয় এবং দুই মাসের মধ্যে রানি গারট্রুডকে বিয়ে করে। শোকার্ত রাজপুত্র হ্যামলেট বন্ধু হোরেশিওর কাছ থেকে জানেন, রাতে দুর্গের প্রাচীরে পিতার প্রেতাত্মা দেখা দিয়েছে। প্রেত জানায়, ক্লদিয়াস ঘুমন্ত রাজার কানে বিষ ঢেলে হত্যা করেছে, এবং হ্যামলেটকে প্রতিশোধ নিতে বলে। হ্যামলেট শপথ করে ও সত্য যাচাইয়ের সময় নিতে পাগলামির ভান করবে বলে ঠিক করে।",
"দ্বিতীয়-তৃতীয় অঙ্ক: হ্যামলেটের অদ্ভুত আচরণ দেখে পোলোনিয়াস ভাবে সে ওফেলিয়ার প্রেমে পাগল। হ্যামলেট অভিনেতাদের দিয়ে 'The Mousetrap' নাটক মঞ্চস্থ করায়, যেখানে রাজহত্যার দৃশ্য আছে; দৃশ্য দেখে ক্লদিয়াস বিচলিত হয়ে উঠে যায়—হ্যামলেট নিশ্চিত হয়। 'To be or not to be' স্বগতোক্তিতে সে জীবন-মৃত্যুর দ্বন্দ্বে ভোগে। ক্লদিয়াসকে প্রার্থনারত দেখেও সে হত্যা করে না, ভাবে এতে সে স্বর্গে যাবে। মায়ের ঘরে পর্দার আড়ালে লুকানো পোলোনিয়াসকে ক্লদিয়াস ভেবে সে ছুরিকাঘাতে হত্যা করে।",
"চতুর্থ-পঞ্চম অঙ্ক: ক্লদিয়াস হ্যামলেটকে ইংল্যান্ডে পাঠিয়ে হত্যার ষড়যন্ত্র করে, কিন্তু হ্যামলেট চিঠি বদলে ফিরে আসে। পিতার মৃত্যুতে ওফেলিয়া উন্মাদ হয়ে নদীতে ডুবে মারা যায়। ভাই লায়ার্টিস প্রতিশোধের জন্য ক্লদিয়াসের সঙ্গে চক্রান্ত করে—দ্বন্দ্বযুদ্ধে তার তলোয়ারের ডগায় বিষ মাখানো, এবং হ্যামলেটের জন্য বিষাক্ত পানীয়ও প্রস্তুত। যুদ্ধে দুজনই আহত হয়; গারট্রুড ভুলে পানীয় খেয়ে মারা যায়। মৃত্যুর আগে লায়ার্টিস সত্য প্রকাশ করে; হ্যামলেট ক্লদিয়াসকে হত্যা করে নিজেও মারা যায়। হোরেশিও কাহিনি বলার দায়িত্ব নেয়।"],
"Macbeth":[
"প্রথম-দ্বিতীয় অঙ্ক: যুদ্ধজয়ের পর স্কটিশ সেনাপতি ম্যাকবেথ ও বাংকো তিন ডাইনির দেখা পান। ডাইনিরা ম্যাকবেথকে 'থেন অব কডর' ও পরে রাজা এবং বাংকোকে ভবিষ্যৎ রাজাদের পূর্বপুরুষ বলে ভবিষ্যদ্বাণী করে। প্রথম অংশ সত্য হলে ম্যাকবেথ উচ্চাকাঙ্ক্ষী হয়। অতিথি রাজা ডানকান তার দুর্গে এলে লেডি ম্যাকবেথ স্বামীকে হত্যায় প্ররোচিত করে। ম্যাকবেথ ছুরির হ্যালুসিনেশন দেখে ডানকানকে হত্যা করে এবং রক্তমাখা অবস্থায় আতঙ্কিত হয়ে পড়ে; লেডি ম্যাকবেথ প্রহরীদের দোষী সাজায়। ডানকানের ছেলেরা পালায়, ম্যাকবেথ রাজা হয়।",
"তৃতীয়-চতুর্থ অঙ্ক: ভবিষ্যদ্বাণীর ভয়ে ম্যাকবেথ বাংকোকে হত্যা করায়, কিন্তু বাংকোর ছেলে ফ্লিয়ান্স পালায়। ভোজসভায় বাংকোর প্রেতাত্মা দেখে সে বিচলিত হয়ে সবার সামনে ধরা পড়ার উপক্রম হয়। আবার ডাইনিদের কাছে গেলে তারা তিনটি সতর্কবাণী দেয়: ম্যাকডাফ থেকে সাবধান; নারীজাত কেউ তাকে মারতে পারবে না; বার্নাম বন ডানসিনেনে না এলে সে নিরাপদ। ম্যাকডাফ ইংল্যান্ডে পালালে ম্যাকবেথ তার স্ত্রী ও সন্তানদের হত্যা করে।",
"পঞ্চম অঙ্ক: রক্তের দাগ ধুতে না পারা লেডি ম্যাকবেথ ঘুমের মধ্যে হাঁটে আর বলে 'Out, damned spot!'; শেষে সে আত্মহত্যা করে। ম্যালকম ও ম্যাকডাফ ইংরেজ সেনা নিয়ে এগোয় এবং সৈন্যদের বার্নাম বনের ডাল কেটে ছদ্মবেশে নিয়ে আসতে বলে—যেন বনটাই চলে আসছে। 'Life's but a walking shadow' বলে ম্যাকবেথ হতাশ হয়। শেষ লড়াইয়ে ম্যাকডাফ জানায় সে মায়ের পেট কেটে জন্মেছে (নারীজাত নয়) এবং ম্যাকবেথের মাথা কেটে ফেলে। ম্যালকম রাজা হন।"],
"Romeo and Juliet":[
"প্রথম-দ্বিতীয় অঙ্ক: ভেরোনায় মন্টেগু ও ক্যাপুলেট পরিবারের পুরোনো বিবাদ। রোমিও রোজালিনের প্রেমে ব্যর্থ ছিল; ক্যাপুলেটের নাচের আসরে লুকিয়ে গিয়ে সে জুলিয়েটকে দেখে প্রথম দর্শনেই প্রেমে পড়ে। বারান্দার বিখ্যাত দৃশ্যে (Balcony Scene) দুজন প্রেম স্বীকার করে। পরদিন ফ্রায়ার লরেন্স তাদের গোপনে বিয়ে দেন, আশা করেন এতে দুই পরিবারের শত্রুতা মিটবে।",
"তৃতীয় অঙ্ক: রাস্তায় জুলিয়েটের চাচাতো ভাই টাইবল্ট রোমিওকে লড়তে বললে রোমিও রাজি হয় না। বন্ধু মার্কুশিও লড়ে টাইবল্টের হাতে নিহত হলে রোমিও ক্ষিপ্ত হয়ে টাইবল্টকে হত্যা করে। রাজপুত্র তাকে ভেরোনা থেকে নির্বাসিত করেন। বিয়ের রাতটুকু জুলিয়েটের সঙ্গে কাটিয়ে ভোরে রোমিও মান্তুয়ায় চলে যায়। এদিকে ক্যাপুলেট জুলিয়েটকে কাউন্ট প্যারিসের সঙ্গে বিয়ে ঠিক করেন।",
"চতুর্থ-পঞ্চম অঙ্ক: জুলিয়েট ফ্রায়ারের কাছে যায়। তিনি ঘুমের এক ওষুধ দেন যাতে সে ৪২ ঘণ্টা মৃতের মতো থাকবে, এবং রোমিওকে চিঠিতে সব জানান। কিন্তু প্লেগের কারণে সেই চিঠি রোমিওর কাছে পৌঁছে না; সে শুধু জুলিয়েটের 'মৃত্যু'র খবর পায়। বিষ কিনে সে সমাধিস্থলে গিয়ে প্যারিসকে হত্যা করে ও জুলিয়েটের পাশে বিষ পান করে মরে। জুলিয়েট জেগে রোমিওকে মৃত দেখে ছুরি বসিয়ে আত্মহত্যা করে। সন্তানদের মৃত্যুতে মন্টেগু ও ক্যাপুলেট শত্রুতা ভুলে হাত মেলান।"],
"A Midsummer Night's Dream":[
"নাটকে তিনটি জগৎ—এথেন্সের রাজদরবার, বনের পরীর জগৎ ও কারিগরদের দল। থিসিয়াসের বিয়ের প্রস্তুতির সময় ইজিয়াস কন্যা হার্মিয়াকে জোর করে ডেমেট্রিয়াসের সঙ্গে বিয়ে দিতে চান; হার্মিয়া ভালোবাসে লিসান্ডারকে। দুই প্রেমিক বনে পালায়। হেলেনা ডেমেট্রিয়াসকে ভালোবাসে, তাই সে ডেমেট্রিয়াসকে বনে পিছু নেয়।",
"পরী-রাজ ওবেরন ও রানি টিটানিয়ার ঝগড়ার কারণে ওবেরন পাককে 'love-in-idleness' ফুলের রস আনতে পাঠায়, যা ঘুমন্ত চোখে ঢাললে জেগে প্রথম যাকে দেখা যায় তার প্রেমে পড়তে হয়। পাক ভুল করে লিসান্ডারের চোখে রস ঢেলে দিলে সে হেলেনার প্রেমে পড়ে; পরে ডেমেট্রিয়াসের চোখেও রস ঢালা হলে দুই যুবকই হেলেনাকে ভালোবাসে, আর হার্মিয়া অবাক হয়ে পড়ে। কারিগর দল বনে নাটকের মহড়া করছিল; পাক বটমের মাথা গাধার মাথা করে দেয় ও টিটানিয়া তার প্রেমে পড়ে।",
"ওবেরন টিটানিয়ার ঘোর কাটিয়ে দেয়, পাক লিসান্ডারের চোখের রস সরিয়ে দেয়—ফলে সঠিক জুটি মিলে যায়: লিসান্ডার-হার্মিয়া, ডেমেট্রিয়াস-হেলেনা। থিসিয়াস সব শুনে তিন জুটির বিয়ে একসঙ্গে দেন। বিয়ের উৎসবে কারিগররা 'Pyramus and Thisbe' নামে হাস্যকর নাটক মঞ্চস্থ করে। শেষে পাক দর্শকদের বলে—যদি এসব ভালো না লাগে, ভেবে নাও তুমি স্বপ্ন দেখছিলে।"],
"Julius Caesar":[
"প্রথম-দ্বিতীয় অঙ্ক: পম্পেইকে পরাজিত করে সিজার রোমে ফিরে জনপ্রিয় ও ক্ষমতাবান। ক্যাসিয়াস ঈর্ষা ও আশঙ্কায় সিজারবিরোধী চক্র গড়ে এবং সৎ ও সম্মানিত ব্রুটাসকে রাজি করায়—ব্রুটাস মনে করে সিজার রাজা হলে রোমের স্বাধীনতা যাবে। সিজারের স্ত্রী ক্যালপূর্ণিয়া দুঃস্বপ্ন দেখে তাকে সিনেটে যেতে বারণ করে, কিন্তু ডেসিয়াসের তোষামোদে সিজার যান।",
"তৃতীয় অঙ্ক: 'Ides of March'-এ সিনেটে ষড়যন্ত্রকারীরা সিজারকে ছুরিকাঘাত করে; শেষে ব্রুটাসকে দেখে সিজার বলেন 'Et tu, Brute?'। ব্রুটাস জনসভায় ভাষণ দিয়ে হত্যার যুক্তি বোঝায়, জনতা শান্ত হয়। পরে মার্ক অ্যান্টনি অনুমতি নিয়ে অন্ত্যেষ্টিতে ভাষণ দেয়—'Friends, Romans, countrymen...'। কৌশলে বারবার 'Brutus is an honourable man' বলে এবং সিজারের উইল পড়ে সে জনতাকে ক্ষেপিয়ে তোলে; জনতা ষড়যন্ত্রকারীদের তাড়া করে।",
"চতুর্থ-পঞ্চম অঙ্ক: অ্যান্টনি, অক্টেভিয়াস ও লেপিডাস ক্ষমতা নেয়; ব্রুটাস ও ক্যাসিয়াস সৈন্য সংগ্রহ করে। তাঁবুতে দুই বন্ধুর ঝগড়া ও মীমাংসা হয়। রাতে ব্রুটাস সিজারের প্রেতাত্মা দেখে—'আমি ফিলিপ্পিতে তোমার সঙ্গে দেখা করব'। ফিলিপ্পির যুদ্ধে ভুল ধারণায় ক্যাসিয়াস নিজেকে হত্যা করে; ব্রুটাস পরাজিত হয়ে আত্মহত্যা করে। অ্যান্টনি তাকে 'the noblest Roman of them all' বলে সম্মান জানায়।"],
"Twelfth Night":[
"জাহাজডুবি থেকে বেঁচে যাওয়া ভায়োলা ইলিরিয়ায় উঠে ভাবে ভাই সেবাস্টিয়ান ডুবে গেছে। সে পুরুষবেশে 'সিজারিও' নাম নিয়ে ডিউক অর্সিনোর সেবায় যোগ দেয় এবং গোপনে তাকে ভালোবাসে। অর্সিনো কাউন্টেস অলিভিয়ার প্রেমে মগ্ন, কিন্তু অলিভিয়া ভাইয়ের শোকে প্রেম প্রত্যাখ্যান করে। অর্সিনো সিজারিওকে প্রেমদূত পাঠায়; অলিভিয়া সিজারিওর প্রেমে পড়ে—ত্রিভুজ প্রেমের জট।",
"উপকাহিনিতে অলিভিয়ার চাচা স্যার টবি, সুরা-সঙ্গী স্যার অ্যান্ড্রু ও দাসী মারিয়া অহংকারী স্টুয়ার্ড ম্যালভোলিওকে শিক্ষা দিতে অলিভিয়ার নামে ভুয়া চিঠি লেখে—চিঠিতে হলুদ মোজা পরে হাসতে বলা হয়। ম্যালভোলিও তা মেনে অদ্ভুত আচরণ করলে সবাই তাকে পাগল ভেবে অন্ধকার ঘরে বন্দি করে। নাটকের বিদূষক ফেস্টে তাকে ঠাট্টা করে।",
"সেবাস্টিয়ানও বেঁচে গিয়ে ইলিরিয়ায় আসে; অলিভিয়া তাকে সিজারিও ভেবে বিয়ে করে ফেলে। দুই যমজকে এক সঙ্গে দেখে সবার ভুল ভাঙে। ভায়োলার আসল পরিচয় জেনে অর্সিনো তাকে বিয়ের প্রস্তাব দেয়। ম্যালভোলিও মুক্ত হয়ে প্রতিশোধের হুমকি দিয়ে চলে যায়। নাটক শেষ হয় ফেস্টের গানে।"],
"As You Like It":[
"ডিউক ফ্রেডেরিক তার বড় ভাই ডিউক সিনিয়রের রাজ্য কেড়ে বনে নির্বাসিত করেছে। অর্ল্যান্ডো তার বড় ভাই অলিভারের অত্যাচারে বাড়িছাড়া; দরবারে কুস্তিতে জিতে সে ডিউকের ভ্রাতুষ্পুত্রী রোজালিন্ডের প্রেমে পড়ে। ফ্রেডেরিক রোজালিন্ডকেও নির্বাসন দিলে সে ছেলে 'গ্যানিমিড' সেজে খুড়তুতো বোন সিলিয়া ও বিদূষক টাচস্টোনকে নিয়ে আর্ডেনের বনে যায়। অর্ল্যান্ডো ও বৃদ্ধ ভৃত্য অ্যাডামও বনে আশ্রয় নেয়।",
"বনে ডিউক সিনিয়র ও তার সঙ্গীরা সরল জীবন কাটান; বিষণ্ণ জেকুইস 'All the world's a stage' বক্তৃতায় মানুষের জীবনের সাত ধাপ বর্ণনা করে। গ্যানিমিড অর্ল্যান্ডোকে বলে সে-ই রোজালিন্ড সেজে অভিনয় করবে এবং অর্ল্যান্ডোকে প্রেমের ধরন শেখাবে। বনে অর্ল্যান্ডো ঘুমন্ত অলিভারকে সিংহের হাত থেকে বাঁচায়; অলিভার মনপরিবর্তন করে সিলিয়াকে ভালোবেসে ফেলে।",
"শেষ দৃশ্যে রোজালিন্ড নিজের পরিচয় প্রকাশ করে; ডিউক সিনিয়র তাকে অর্ল্যান্ডোর হাতে সঁপে দেন। একসঙ্গে চারটি বিয়ে হয়—রোজালিন্ড-অর্ল্যান্ডো, সিলিয়া-অলিভার, ফিবি-সিলভিয়াস ও টাচস্টোন-অড্রি। খবর আসে ফ্রেডেরিক এক সন্ন্যাসীর কথায় মন বদলে সিংহাসন ফিরিয়ে দিয়েছে। জেকুইস সন্ন্যাসীর কাছে যাওয়ার সিদ্ধান্ত নেয়।"],
"Othello":[
"প্রথম অঙ্ক: মুর সেনাপতি ওথেলো ভেনিসের সম্মানিত বীর। সে গোপনে সেনেটর ব্রাবান্টিওর কন্যা ডেসডিমোনাকে বিয়ে করে। সেনাবাহিনীতে ওথেলো ইয়াগোর বদলে মাইকেল কাসিওকে লেফটেন্যান্ট করায় ইয়াগো ঈর্ষা ও প্রতিহিংসায় জ্বলে ওঠে। সে রডেরিগোকে টাকায় বশ করে ব্রাবান্টিওকে উত্তেজিত করে। তুর্কি আক্রমণের কারণে ওথেলো সাইপ্রাসে পাঠানো হয়, সঙ্গে ডেসডিমোনা ও ইয়াগো।",
"দ্বিতীয়-তৃতীয় অঙ্ক: সাইপ্রাসে ইয়াগো কাসিওকে মাতাল করে মারামারিতে জড়ায়, ফলে ওথেলো তাকে পদচ্যুত করে। কাসিও ডেসডিমোনার কাছে সুপারিশ চাইলে ইয়াগো ওথেলোর মনে সন্দেহ ঢোকায়—ডেসডিমোনা ও কাসিওর মধ্যে কিছু আছে। ইয়াগোর স্ত্রী এমিলিয়া ডেসডিমোনার রুমাল (ওথেলোর প্রথম উপহার) কুড়িয়ে স্বামীকে দেয়; ইয়াগো তা কাসিওর ঘরে ফেলে রাখে। রুমালকে 'প্রমাণ' ধরে ওথেলো ঈর্ষায় উন্মত্ত হয়ে ওঠে এবং ডেসডিমোনাকে হত্যার শপথ করে।",
"চতুর্থ-পঞ্চম অঙ্ক: ওথেলো ডেসডিমোনাকে প্রকাশ্যে অপমান করে। ইয়াগো রডেরিগোকে দিয়ে কাসিওকে হত্যার চেষ্টা করায়, কিন্তু কাসিও আহত হয়ে বাঁচে এবং ইয়াগো রডেরিগোকেই হত্যা করে। রাতে ওথেলো ঘুমন্ত ডেসডিমোনাকে বালিশে শ্বাসরোধ করে মারে। এমিলিয়া এসে সত্য ফাঁস করে দেয়—রুমালটি সে ইয়াগোকে দিয়েছিল; ইয়াগো তাকে খুন করে। ওথেলো সত্য জেনে ভেঙে পড়ে ও ছুরি দিয়ে আত্মহত্যা করে; ইয়াগো ধরা পড়ে।"],
"The Tempest":[
"নাটকের শুরুতে প্রস্পেরো ঝড় তুলে নেপলসের রাজা আলোনসো, তার ভাই সেবাস্টিয়ান, ছেলে ফার্দিনান্দ ও প্রস্পেরোর ভাই অ্যান্তোনিওর জাহাজ ডুবিয়ে দেয়। কন্যা মিরান্ডাকে প্রস্পেরো ১২ বছর আগের ঘটনা বলে: কীভাবে অ্যান্তোনিও আলোনসোর সাহায্যে মিলানের সিংহাসন দখল করে তাদের ভাসিয়ে দেয়। দ্বীপে ডাইনি সাইকোরাক্সের ছেলে ক্যালিবান প্রস্পেরোর দাস; বাতাসের আত্মা এরিয়েল তাকে সেবা দেয় মুক্তির আশায়।",
"ফার্দিনান্দ একা দ্বীপে এসে মিরান্ডাকে দেখে প্রেমে পড়ে। প্রস্পেরো প্রেম যাচাই করতে ফার্দিনান্দকে কাঠ বহনের কাজ দেয়। অন্যদিকে আলোনসোর দল দ্বীপে ঘুরে ক্লান্ত; অ্যান্তোনিও ও সেবাস্টিয়ান আলোনসোকে হত্যার ষড়যন্ত্র করে, এরিয়েল ঠিক সময়ে তাদের জাগিয়ে দেয়। ক্যালিবান মাতাল ভৃত্য স্টেফানো ও ট্রিনকুলোকে প্রস্পেরোকে হত্যায় প্ররোচিত করে, কিন্তু এরিয়েল তাদের পথ ভুলিয়ে দেয়।",
"শেষে প্রস্পেরো সবাইকে নিজের গুহার কাছে এনে নিজের পরিচয় জানান এবং প্রতিশোধ না নিয়ে ক্ষমা করে দেন। ফার্দিনান্দ-মিরান্ডার বিয়ে ঠিক হয়; তিনি এরিয়েলকে মুক্তি দেন, ক্যালিবানকে ক্ষমা করেন। জাদুর বই ও দণ্ড ফেলে দেওয়ার প্রতিজ্ঞা করে মিলানে ফিরে যাওয়ার প্রস্তুতি নেন। উপসংহারে তিনি দর্শকদের কাছে করতালি দিয়ে নিজেকে মুক্ত করার অনুরোধ জানান।"],
"The Merchant of Venice":[
"ভেনিসের ধনী বণিক অ্যান্তোনিওর বন্ধু বাসানিও বেলমন্টের উত্তরাধিকারিণী পোর্শিয়াকে বিয়ে করতে চায়, কিন্তু টাকা নেই। অ্যান্তোনিওর সব অর্থ সমুদ্রে জাহাজে আটকে থাকায় সে ইহুদি সুদখোর শাইলকের কাছে তিন হাজার ডুকাট ধার নেয়। শাইলক অ্যান্তোনিওর ওপর পুরোনো ক্ষোভ থেকে শর্ত দেয়: নির্ধারিত দিনে শোধ না হলে অ্যান্তোনিওর বুকের কাছ থেকে এক পাউন্ড মাংস কেটে নেবে।",
"বেলমন্টে পোর্শিয়ার পিতার উইল অনুযায়ী প্রার্থীদের তিনটি পেটি (সোনা, রূপা, সিসা) থেকে সঠিকটি বাছতে হয়। মরক্কো ও আরাগনের প্রিন্স চকচকে সোনা ও রূপা বেছে ব্যর্থ হয়; বাসানিও সিসার পেটি বেছে জেতে ও পোর্শিয়াকে পায়। এদিকে শাইলকের কন্যা জেসিকা গয়না ও টাকা নিয়ে লোরেঞ্জোর সঙ্গে পালিয়ে যায়, শাইলক ক্ষোভে উন্মত্ত হয়।",
"অ্যান্তোনিওর জাহাজডুবির খবরে সে ঋণ শোধ করতে পারে না। আদালতে শাইলক ন্যায়বিচারের দাবি করে। পোর্শিয়া উকিলের ছদ্মবেশে এসে দয়ার গুরুত্ব বোঝায়, শাইলক না মানলে বলে—মাংস কাটা যাবে, কিন্তু একফোঁটা রক্ত ঝরলে শাইলকের সব সম্পত্তি বাজেয়াপ্ত হবে। পরাজিত শাইলকের অর্ধেক সম্পত্তি রাষ্ট্র নেয়, বাকিটা জেসিকা পায়, এবং সে খ্রিস্টান হতে বাধ্য হয়। শেষে আংটি নিয়ে মজার ছলে প্রেমিকজুটির সব ভুল বোঝাবুঝি মিটে যায়।"],
"Measure for Measure":[
"ভিয়েনার ডিউক ভিনসেন্সিও দীর্ঘদিনের শিথিল আইন-শৃঙ্খলা ঠিক করতে ভ্রমণের অজুহাতে শহর ছেড়ে সন্ন্যাসীর ছদ্মবেশে লুকিয়ে থাকেন, আর শাসনভার দেন কঠোর ও সংযমী অ্যাঞ্জেলোকে। অ্যাঞ্জেলো পুরোনো আইন চালু করে প্রাক্‌-বিবাহ সম্পর্কের অপরাধে যুবক ক্লদিওকে মৃত্যুদণ্ড দেয়। ক্লদিওর বন্ধু লুসিও নবীনা সন্ন্যাসিনী ইসাবেলার কাছে গিয়ে অনুরোধ করে সে যেন অ্যাঞ্জেলোর কাছে ভাইয়ের প্রাণভিক্ষা চায়।",
"ইসাবেলার আবেদনে অ্যাঞ্জেলো তার প্রতি আকৃষ্ট হয়ে প্রস্তাব দেয়—ইসাবেলা রাত কাটালে ক্লদিও মুক্তি পাবে। ইসাবেলা তা প্রত্যাখ্যান করে ভাইকে সব জানালে ক্লদিও প্রাণের ভয়ে বোনকে রাজি হতে বলে—ইসাবেলা ক্ষুব্ধ হয়ে ওঠে ('O faithless coward!')। ছদ্মবেশী ডিউক সবই শুনে 'bed-trick' পরিকল্পনা করেন: অ্যাঞ্জেলোর পূর্ব বাগদত্তা মারিয়ানা অন্ধকারে ইসাবেলার জায়গায় যাবে।",
"অ্যাঞ্জেলো কথা রাখে না, ক্লদিওর মাথা পাঠাতে আদেশ দেয়; ডিউকের কৌশলে এক মৃত কয়েদির মাথা পাঠানো হয় এবং ক্লদিও গোপনে বাঁচে। ডিউক ফিরে এসে প্রকাশ্য বিচারসভা বসান; ইসাবেলা অ্যাঞ্জেলোর বিরুদ্ধে অভিযোগ করে। শেষে ডিউক নিজের ছদ্মবেশ খুলে সব সত্য প্রকাশ করেন, অ্যাঞ্জেলোকে মারিয়ানার সঙ্গে বিয়ে দিতে বলেন ও দণ্ড দিতে গেলে মারিয়ানা ও ইসাবেলার আবেদনে তাকে ক্ষমা করেন। শেষে ডিউক ইসাবেলাকে বিয়ের প্রস্তাব দেন।"],
"Dr. Faustus":[
"প্রস্তাবনা অংশে কোরাস জানায় ফাউস্টাস এক সাধারণ পরিবারের ছেলে, উইটেনবার্গে ধর্মতত্ত্বে ডক্টরেট নিয়ে এখন সব বিদ্যায় অতৃপ্ত। সে আইন, চিকিৎসা, যুক্তিবিদ্যা ও ধর্মতত্ত্ব ছেড়ে জাদুবিদ্যা বেছে নেয়। ভালো ও মন্দ দেবদূত তাকে দুই পথে ডাকে, কিন্তু সে মন্দ দেবদূতের কথা শোনে। ভ্যালডেস ও করনেলিয়াসের সহায়তায় সে ভূত আহ্বান করলে শয়তানের দূত মেফিস্টোফিলিস আসে।",
"ফাউস্টাস চব্বিশ বছর মেফিস্টোফিলিসকে সেবক হিসেবে পাওয়ার বিনিময়ে নিজের রক্ত দিয়ে চুক্তিপত্রে সই করে—যার পর তার আত্মা লুসিফারের। হাতের পাশে খোদাই 'Homo, fuge' (মানুষ, পালাও) দেখেও সে ভয় পায় না। সে বিশ্বভ্রমণ করে, পোপের দরবারে খেলা দেখায়, সম্রাট শার্লস পঞ্চমের সামনে আলেকজান্ডারের প্রেতমূর্তি তুলে আনে, এবং ঘোড়ার ব্যবসায়ী ও অন্যদের সঙ্গে নানা কৌতুক করে। কিন্তু এসব ক্ষমতা সে বড় কোনো কাজে লাগায় না।",
"শেষ বছরে ফাউস্টাস অনুতপ্ত হতে চায়, কিন্তু মেফিস্টোফিলিস ও লুসিফার তাকে ভয় দেখায়। সে ট্রয়ের হেলেনকে চেয়ে 'Was this the face that launch'd a thousand ships' বলে চুম্বন করে। চুক্তির শেষ রাতে সে বন্ধুদের জানায় সত্য, কিন্তু প্রার্থনা করেও বাঁচতে পারে না; ঘড়িতে ঘণ্টা বাজে, বজ্র-বিদ্যুতে শয়তানরা তাকে টেনে নিয়ে যায়। কোরাস শিক্ষণীয় সমাপ্তি জানায়: জ্ঞানের সীমা লঙ্ঘন করা উচিত নয়।"],
"Antony and Cleopatra":[
"রোমের ত্রিস্তম্ভের একজন মার্ক অ্যান্টনি মিশরে ক্লিওপেট্রার সঙ্গে ভোগবিলাসে মগ্ন। রোম থেকে খবর আসে—তার স্ত্রী ফুলভিয়া মারা গেছে, সেক্সটাস পম্পেই বিদ্রোহ করছে। অ্যান্টনি রোমে ফিরে অক্টেভিয়াস সিজারের সঙ্গে সম্পর্ক জোড়া লাগাতে তার বোন অক্টেভিয়াকে বিয়ে করে। এই খবর শুনে ক্লিওপেট্রা ক্ষুব্ধ হয়, কিন্তু অ্যান্টনি শিগগিরই মিশরে ফিরে আসে।",
"অক্টেভিয়াস অ্যান্টনিকে আক্রমণ করার প্রস্তুতি নেয়। অ্যাকটিয়ামের নৌযুদ্ধে ক্লিওপেট্রার জাহাজ হঠাৎ পিছু হটলে অ্যান্টনি লজ্জায় তার পিছু নেয় এবং পরাজিত হয়। বিশ্বস্ত এনোবারবাস অ্যান্টনিকে ছেড়ে অক্টেভিয়াসের পক্ষে যায় ও পরে লজ্জায় মারা যায়। অ্যান্টনি আবার যুদ্ধ করে সামান্য জিতে আবার হেরে যায়।",
"ক্লিওপেট্রা চালাকি করে গুজব ছড়ায় যে সে মৃত। শুনে অ্যান্টনি নিজের তলোয়ারে আঘাত করে, পরে সত্য জেনে মুমূর্ষু অবস্থায় ক্লিওপেট্রার কাছে নীত হয় ও তার কোলে মারা যায়। অক্টেভিয়াস ক্লিওপেট্রাকে বন্দি করে রোমে নিয়ে বিজয়মিছিলে দেখাতে চায়। অপমান এড়াতে ক্লিওপেট্রা রাজকীয় পোশাকে সেজে সাপের কামড়ে আত্মহত্যা করে; অক্টেভিয়াস তাদের পাশাপাশি সমাধিস্থ করার আদেশ দেয়।"],
"The Jew of Malta":[
"প্রস্তাবনায় ম্যাকিয়াভেলির প্রেতাত্মা ঘোষণা করে—ধর্ম শুধুই শিশুদের ভয় দেখানোর খেলা। মাল্টায় ধনী ইহুদি বারাবাস তার সম্পদ গুনছিল, এমন সময় খবর আসে তুর্কিরা কর দাবি করছে। গভর্নর ফার্নিজ ইহুদিদের কাছ থেকেই সেই অর্থ আদায়ের আদেশ দেয়; বারাবাস অস্বীকার করলে তার সব সম্পত্তি বাজেয়াপ্ত হয়। ক্ষিপ্ত বারাবাস প্রতিশোধের শপথ নেয়।",
"সে তার বাড়ি ভবিষ্যতে সন্ন্যাসিনী-আশ্রম হয়ে যাওয়ার সুযোগ নিয়ে কন্যা অ্যাবিগেলকে ছদ্মবেশে আশ্রমে পাঠিয়ে লুকানো সোনা উদ্ধার করে। এরপর সে ফার্নিজের ছেলে লোডোউইক ও ম্যাথিয়াসকে মিথ্যা চিঠি দিয়ে দ্বন্দ্বযুদ্ধে উসকে দুজনকে হত্যা করায়। অ্যাবিগেল সত্য জেনে আশ্রমে ফিরে খ্রিস্টান হয়, বারাবাস আশ্রমের সবাইকে বিষ খাইয়ে মারে—অ্যাবিগেলও মারা যায়।",
"বারাবাস তুর্কিদের সঙ্গে মিলে মাল্টা জয়ের ষড়যন্ত্র করে এবং দাস ইথামোরের সাহায্যে আরও খুন করে। পরে সে ইথামোর ও তার সঙ্গীদেরও বিষ দেয়। ফার্নিজকে ধরতে ফাঁদ হিসেবে সে ফুটন্ত তেলের কড়াই তৈরি করে, কিন্তু ফার্নিজ চালাকি করে বারাবাসকে সেই কড়াইয়েই ফেলে দেয় এবং সে মারা যায়।"],
"Arms and the Man":[
"প্রথম অঙ্ক: ১৮৮৫ সালের বুলগেরিয়া-সার্বিয়া যুদ্ধ। রাইনা পেটকফ বাগদত্তা সেনাপতি সার্জিয়াস সারানফের বীরত্বের কাহিনিতে মুগ্ধ ছিল। রাতে এক পলাতক সুইস ভাড়াটে সৈনিক ক্যাপ্টেন ব্লান্টশলি তার শোবার ঘরে ঢুকে আশ্রয় চায়। ব্লান্টশলি বাস্তববাদী—সে পিস্তলে গুলি না ভরে চকলেট নিয়ে এসেছে, বলে 'ভালো সৈন্য খাবার ও ঘুমের হিসাব রাখে'। রাইনা তাকে লুকিয়ে বাঁচায়।",
"দ্বিতীয়-তৃতীয় অঙ্ক: যুদ্ধ শেষে রাইনার পিতা মেজর পেটকফ ও সার্জিয়াস বাড়ি ফিরে আসে। সার্জিয়াস মুখে রাইনার প্রতি আদর্শ প্রেম দেখালেও গোপনে দাসী লুকার সঙ্গে প্রেম করে। রাইনা ব্লান্টশলির জন্য গোপনে ভাবে। ব্লান্টশলি কোট ফেরত দিতে এলে তার আসল পরিচয় ধরা পড়ে এবং রাইনা-ব্লান্টশলির সম্পর্ক পরিষ্কার হয়ে যায়; রাইনার বীরত্বের মোহ ভাঙে।",
"শেষে সার্জিয়াস লুকার সঙ্গে বিয়ে ঠিক করে, কারণ সে তার অন্তর খোলা মনে ভালোবাসে। ব্লান্টশলি তার সম্পত্তির পরিমাণ জানালে—হোটেলের মালিকের ছেলে হিসেবে তার বিশাল সম্পদ আছে—পেটকফ পরিবার তাকে মেনে নেয়। রাইনা ও ব্লান্টশলি বিয়ে করার সিদ্ধান্ত নেয়; যুদ্ধের রোম্যান্টিক ভাবালুতার ওপর বাস্তববাদ জয়ী হয়।"],
"Saint Joan":[
"নাটকের শুরুতে ছোট্ট গ্রাম ভোকুলার দুর্গের কাছে জোয়ান ক্যাপ্টেন রবার্ট দ্য বদ্রিকোর্টকে বলে, ঈশ্বরের কণ্ঠ তাকে ফ্রান্স উদ্ধারে পাঠিয়েছে। তার আত্মবিশ্বাস ও সরল জেদে রবার্ট রাজি হয়ে সঙ্গে সৈন্য দেয়। ফ্রান্সের দুর্বল ডফিন চার্লসের দরবারে জোয়ান পোশাক পাল্টে গোপনে থাকা ডফিনকে চিনে ফেলে এবং নিজের মিশন বোঝায়।",
"জোয়ান সেনাপতি ডুনোইসের সঙ্গে অর্লিঁয়া অবরোধ ভাঙতে যায়; বাতাসের দিক ঠিক সময়ে ঘুরে যাওয়ায় তারা জয়ী হয়। এরপর জোয়ান চার্লসকে রেইমসে অভিষেক করায়। কিন্তু এরপর সে ফ্রান্সের অভিজাত ও চার্চ—দুই-ই ক্ষেপিয়ে তোলে, কারণ সে সরাসরি ঈশ্বরের নির্দেশ মানে, পুরোহিতদের নয়। ইংরেজ নেতা ওয়ারউইক ও বিশপ কশোঁ সম্মিলিতভাবে তার পতনের পরিকল্পনা করে।",
"বন্দি হওয়ার পর জোয়ানকে ধর্মদ্রোহের বিচারে হাজির করা হয়। ইনকুইজিটর বহু প্রশ্ন করে তাকে ভয় দেখান; সে একবার ভয়ে স্বীকারোক্তিতে সই করে, কিন্তু আজীবন কারাবাসের কথা শুনে তা ছিঁড়ে ফেলে এবং পুড়িয়ে মারার শাস্তি মেনে নেয়। শেষ দৃশ্যে ২৫ বছর পর রাজা চার্লসের স্বপ্নে জোয়ানের প্রেত আসে ও সবাই তার নামে শ্রদ্ধা জানায়; কিন্তু সে ফিরে আসতে চাইলে সবাই পিছিয়ে যায়—মানুষ জীবিত সন্তকে সহ্য করতে পারে না।"],
"Great Expectations":[
"প্রথম পর্ব: সাত বছরের এতিম পিপ কবরস্থানে পলাতক কয়েদি আবেল ম্যাগউইচের মুখোমুখি হয়; ভয়ে সে খাবার ও রুটি এনে দেয়। কামার জো গার্গারি ও কঠোর বোন মিসেস জো তাকে লালন করে। ধনী ও বিকৃতমনা মিস হ্যাভিশাম পিপকে তাঁর বাড়িতে খেলতে ডাকেন; সেখানে সে অহংকারী এস্টেলার প্রেমে পড়ে এবং নিজের নিম্ন অবস্থার জন্য লজ্জিত হয়। উকিল জ্যাগার্স জানায় এক অজ্ঞাত হিতৈষী পিপকে ভদ্রলোক বানাতে চান।",
"দ্বিতীয় পর্ব: পিপ লন্ডনে গিয়ে বন্ধু হারবার্ট পকেটের সঙ্গে থাকে; দামি জীবনযাপনে ঋণগ্রস্ত হয় ও জো-র প্রতি উদাসীন হয়। সে ধরে নেয় মিস হ্যাভিশামই তার হিতৈষী, কারণ এস্টেলার জন্যই তাকে তৈরি করা হচ্ছে। এস্টেলা বলে সে কাউকে ভালোবাসতে পারে না—তাকে শেখানো হয়েছে পুরুষদের হৃদয় ভাঙতে—এবং শেষে সে ধনী দ্রামলকে বিয়ে করে।",
"তৃতীয় পর্ব: এক ঝড়ের রাতে ম্যাগউইচ ফিরে আসে এবং জানায় সে-ই পিপের আসল হিতৈষী। পিপ হতবাক ও ঘৃণায় ভরে ওঠে, কিন্তু ধীরে ধীরে তার প্রতি সহানুভূতি জন্মে। তাকে লুকিয়ে বিদেশে পাঠানোর চেষ্টা ব্যর্থ হয়, ম্যাগউইচ ধরা পড়ে মারা যায় এবং তার সম্পত্তি রাষ্ট্রের হয়। পিপ অসুস্থ হলে জো তার ঋণ শোধ করে সেবা করে। অনুতপ্ত পিপ বছর পর ফিরে এস্টেলার সঙ্গে দেখা করে—দুজনেই জীবন থেকে শিক্ষা পেয়েছে।"],
"A Tale of Two Cities":[
"প্রথম পর্ব ('Recalled to Life'): ১৭৭৫ সালে লন্ডনের টেলসন ব্যাংকের জারভিস লরি প্যারিসে গিয়ে ১৮ বছর বাস্তিলে বন্দি থাকা ডা. ম্যানেটকে খুঁজে পান। তাঁর মেয়ে লুসি তাঁকে ইংল্যান্ডে নিয়ে আসে। পাঁচ বছর পর ফরাসি অভিজাত চার্লস ডার্নে ('Evremonde') গুপ্তচরবৃত্তির অভিযোগে বিচারে ওঠে; সিডনি কার্টনের চেহারার মিল তাকে বাঁচিয়ে দেয়। কার্টন মদ্যপ ও হতাশ, কিন্তু লুসিকে গোপনে ভালোবাসে।",
"দ্বিতীয় পর্ব: লুসি ও ডার্নের বিয়ে হয়। ফ্রান্সে বিপ্লব ফেটে পড়ে—ডেফার্জ দম্পতি মদের দোকান থেকে বিপ্লবীদের নেতৃত্ব দেয়; মাদাম ডেফার্জ উল বোনার মধ্যে ঘাতকদের তালিকা তৈরি করে। ডার্নে ভৃত্যকে বাঁচাতে প্যারিসে গিয়ে গ্রেপ্তার হয়। ডা. ম্যানেটের বাস্তিলের অতীত নিয়ে ডেফার্জ দম্পতি একটি লুকানো চিঠি পায়, যাতে আছে এভরেমন্ড পরিবারের বিরুদ্ধে অভিযোগ।",
"তৃতীয় পর্ব: সেই চিঠির ভিত্তিতে ডার্নের মৃত্যুদণ্ড হয়। কার্টন বুঝে ফেলে সে ডার্নের মতো দেখতে এবং কারাগারে ডার্নেকে ঘুমের ওষুধ দিয়ে অচেতন করে নিজেই তার জায়গায় থেকে যায়। ডার্নে লুসি ও পরিবারের সঙ্গে ফ্রান্স ছেড়ে চলে যায়। মাদাম ডেফার্জ লুসিকে হত্যা করতে এসে মিস প্রসের সঙ্গে ধস্তাধস্তিতে নিজের পিস্তলের গুলিতে মারা যায়। গিলোটিনে যাওয়ার সময় কার্টন বলে—'It is a far, far better thing that I do, than I have ever done'।"],
"Hard Times":[
"প্রথম পর্ব 'Sowing': কোকটাউনে স্কুলশিক্ষক ও সংসদ সদস্য টমাস গ্র্যাডগ্রাইন 'Facts, facts, facts' ছাড়া আর কিছু শেখান না। তিনি সন্তান লুইসা ও টমকে কল্পনা ও আবেগ ছাড়া বড় করেন। সার্কাস থেকে আসা সিসি জুপকে তিনি স্কুলে নেন, কিন্তু সে হিসাবে দুর্বল—হৃদয়ে সে অন্যদের চেয়ে অনেক বেশি মানবিক। অহংকারী ব্যাংকার জশিয়া বাউন্ডারবি লুইসাকে বিয়ে করতে চায়।",
"দ্বিতীয় পর্ব 'Reaping': লুইসা ভাইয়ের জন্য বিয়েতে রাজি হয়, কিন্তু সে সুখী হয় না। অভিজাত হ্যারি জেমস লুইসার প্রেমের খেলায় নামে; লুইসা আবেগ বুঝে ঘাবড়ে বাবার কাছে ফিরে যায়। শ্রমিক স্টিফেন ব্ল্যাকপুল ধর্মঘটে জড়াতে অস্বীকার করায় কারখানা থেকে বরখাস্ত হয়। ব্যাংক চুরি হলে সন্দেহ পড়ে স্টিফেনের ওপর, অথচ আসল চোর টম।",
"তৃতীয় পর্ব 'Garnering': স্টিফেন নিজেকে নির্দোষ প্রমাণ করতে ফিরে আসার পথে পুরোনো খনির গর্তে পড়ে গুরুতর আহত হয় ও মারা যায়। গ্র্যাডগ্রাইন ছেলের অপরাধ জেনে ভেঙে পড়েন এবং টমকে সার্কাসের সাহায্যে বিদেশে পালাতে দেন। বাউন্ডারবির মিথ্যা প্রকাশ হয়—সে গরিব পটভূমির অভিযোগ ঢেকে রাখত। গ্র্যাডগ্রাইন বুঝতে পারেন শুধু তথ্যের শিক্ষা মানুষকে সুখী করে না; সিসির ভালোবাসাই তাকে ভরসা দেয়।"],
"Jane Eyre":[
"শৈশব ও গেটসহেড-লোউড: এতিম জেন মামি মিসেস রিডের বাড়িতে অবহেলা ও নির্যাতনে বড় হয়। 'রেড রুম'-এ বন্দি হওয়ার পর সে লোউড স্কুলে যায়, যেখানে নিষ্ঠুর প্রধান ব্রকলহার্স্ট ও ঠান্ডা, ক্ষুধা ও রোগের কষ্ট। বন্ধু হেলেন বার্নস মারা যায়, কিন্তু তার ধৈর্য জেনকে প্রভাবিত করে। জেন সেখানে ছাত্রী ও পরে শিক্ষিকা হয়।",
"থর্নফিল্ড হল: জেন গভর্নেস হয়ে থর্নফিল্ড হলে আসে, ছাত্রী ছোট্ট অ্যাডেল। বাড়ির রহস্যময় মালিক এডওয়ার্ড রচেস্টারের সঙ্গে তার বুদ্ধিদীপ্ত সম্পর্ক গড়ে ওঠে এবং তারা প্রেমে পড়ে। বাড়িতে রহস্যময় হাসি, আগুন লাগার ঘটনা—জেন ভাবে গ্রেস পুল দায়ী। বিয়ের দিন এক আইনজীবী এসে বলেন রচেস্টার আগেই বার্থা মেসনকে বিয়ে করেছেন—সে উন্মাদ ও চিলেকোঠায় বন্দি।",
"পরিণতি: ভেঙে পড়া জেন রাতে বাড়ি ছেড়ে পালায়, অনাহারে পড়লে সেন্ট জন রিভার্স ও তার বোনরা তাকে আশ্রয় দেয়। সে স্কুলশিক্ষিকা হয় এবং জানতে পারে চাচার সম্পত্তি তার, সে সম্পদ ভাই-বোনদের সঙ্গে ভাগ করে। সেন্ট জন তাকে বিয়ে করে ভারতে মিশনারি যেতে বলে, জেন প্রত্যাখ্যান করে। এক রাতে রচেস্টারের কণ্ঠ শুনে সে ফিরে গিয়ে দেখে থর্নফিল্ড আগুনে পুড়ে ছাই, বার্থা মৃত, রচেস্টার অন্ধ। জেন তাকে বিয়ে করে—'Reader, I married him'।"],
"Silas Marner":[
"প্রথম খণ্ড: তাঁতি সাইলাস মার্নার লান্টার্ন ইয়ার্ডের একটি ধর্মীয় সম্প্রদায়ের সদস্য ছিল। বন্ধু উইলিয়াম ডেইন গির্জার টাকা চুরি করে ছুরি সাইলাসের পকেটে রেখে তাকে ফাঁসায়; ভাগ্যপরীক্ষায় সাইলাস দোষী ঘোষিত হয়, বাগদত্তা সারাহ উইলিয়ামের সঙ্গে চলে যায়। আহত সাইলাস ঈশ্বরে বিশ্বাস হারিয়ে র‍্যাভেলো গ্রামে এসে নির্জনে তাঁত বোনে ও সোনা জমায়।",
"দ্বিতীয় খণ্ড: ধনী স্কয়ার ক্যাসের বড় ছেলে গডফ্রে গোপনে নিম্নশ্রেণির মলি ফার্ন নামে এক মদ্যপ নারীকে বিয়ে করে ফেলেছে, আর ন্যান্সি ল্যামেটারকে ভালোবাসে। তার ভাই ডানস্টান সাইলাসের সোনা চুরি করে পালায় ও আর ফেরে না। সাইলাস সোনা হারিয়ে ভেঙে পড়ে। বড়দিনের রাতে মলি ফার্ন তার শিশুকন্যাকে নিয়ে তুষারে মারা যায়; ঘুমন্ত শিশুটি সাইলাসের ঘরে ঢুকে পড়ে—সে তাকে 'এপি' নাম দিয়ে নিজের কন্যা করে নেয়।",
"পরিণতি: এপি বড় হয়, সাইলাস গ্রামের মানুষের সঙ্গে মিশে নতুন করে বাঁচে। ষোল বছর পর ডানস্টানের কঙ্কাল ও সাইলাসের সোনা খাদে পাওয়া যায়। গডফ্রে, এখন ন্যান্সির স্বামী, সন্তানহীন; সে এপির আসল পিতা বলে স্বীকার করে তাকে নিতে চায়। এপি সাইলাসের কাছেই থাকবে বলে জানায়। সে সাইলাসের সঙ্গে গ্রামের এক শ্রমিকের ছেলেকে বিয়ে করে সুখে থাকে।"],
"Vanity Fair":[
"বেকি শার্প ও অ্যামেলিয়া সেডলি মিস পিঙ্কার্টনের একাডেমি ছেড়ে বেরোয়। অ্যামেলিয়া ধনী ও কোমল, তার ভাই জস। বেকি চালাক, গরিব ও উচ্চাকাঙ্ক্ষী—জসকে ফাঁদে ফেলতে ব্যর্থ হয়ে সে স্যার পিট ক্রলির পরিবারে গভর্নেস হয় এবং শেষে গোপনে তার ছেলে রডন ক্রলিকে বিয়ে করে—যার ফলে বৃদ্ধ মিস ক্রলির উত্তরাধিকার হারায়। অ্যামেলিয়ার বাগদত্তা জর্জ ওসবর্ন তার প্রতি উদাসীন।",
"ওয়াটারলু যুদ্ধের আগে ব্রাসেলসে সবাই জড়ো হয়। জর্জ যুদ্ধে নিহত হয়; অ্যামেলিয়া গর্ভবতী, ছেলে জর্জির জন্ম হয়। সেডলি পরিবার দেউলিয়া হয়ে গরিবি দশায় পড়ে। বিশ্বস্ত ডবিন গোপনে অ্যামেলিয়াকে সাহায্য করে ও ভালোবাসে। এদিকে বেকি লর্ড স্টেইনের আনুকূল্যে সমাজে উঠে আসে, কিন্তু রডন তার প্রতারণা বুঝে গেলে ক্ষুব্ধ হয়ে তাকে ছেড়ে চলে যায়।",
"বেকি দেশ-বিদেশে ভবঘুরে জীবনে নেমে আসে। অ্যামেলিয়া জর্জের স্মৃতি আঁকড়ে থাকে; পরে ডবিন জর্জের অতীত সত্য বললে সে ডবিনকে বিয়ে করে। শেষে বেকি জসকে ফাঁসানোর চেষ্টা করে, জস রহস্যজনকভাবে মারা যায়। উপন্যাস শেষ হয় লেখকের তিক্ত মন্তব্যে—'Which of us is happy in this world?'—অর্থাৎ ভ্যানিটি ফেয়ারে কেউ-ই সত্যিকারের সুখী নয়।"],
"Paradise Lost":[
"প্রথম-দ্বিতীয় খণ্ড: দেবদূত শয়তান ঈশ্বরের বিরুদ্ধে বিদ্রোহে হেরে নরকে নিক্ষিপ্ত হয়। সে বেলজেবাব, মলোক প্রভৃতি সঙ্গীদের নিয়ে পান্ডেমোনিয়ামে সভা ডাকে। সেখানে ঠিক হয়—সরাসরি যুদ্ধ নয়, ঈশ্বরের নতুন সৃষ্টি মানুষকে প্রতারণা করে পাপে ফেলা হবে। শয়তান নরকের দ্বার পাপ ও মৃত্যুর পাহারা পেরিয়ে বিশ্বে পৌঁছায়।",
"তৃতীয়-অষ্টম খণ্ড: স্বর্গে ঈশ্বর আগেই জানেন মানুষ পতিত হবে, কিন্তু পুত্র (খ্রিস্ট) ত্যাগের মাধ্যমে মুক্তি দেওয়ার প্রতিশ্রুতি দেন। দেবদূত রাফায়েল আদমকে স্বর্গীয় যুদ্ধ ও সৃষ্টির কাহিনি শোনান। শয়তান এডেনে সাপের রূপ ধরে ঘুমন্ত হাওয়াকে স্বপ্নে প্ররোচিত করে। আদম-হাওয়ার ভালোবাসা ও স্বাধীন ইচ্ছার বর্ণনাও এখানে আছে।",
"নবম-দ্বাদশ খণ্ড: সাপ হাওয়াকে বোঝায় নিষিদ্ধ জ্ঞানবৃক্ষের ফল খেলে সে ঈশ্বরের মতো হবে; হাওয়া খায়, আদমও ভালোবাসায় ফল খায়। দুজনেই লজ্জা ও দোষারোপে ভেঙে পড়ে। দেবদূত মাইকেল তাদের এডেন থেকে বের করে দিয়ে ভবিষ্যৎ বংশধর ও মুক্তিদাতার আগমনের দর্শন দেখায়। শেষে আদম-হাওয়া হাত ধরে, দুঃখে কিন্তু আশা নিয়ে, বিশ্বের পথে পা বাড়ায়।"],
"I Wandered Lonely as a Cloud (Daffodils)":[
"প্রথম স্তবক: কবি পাহাড় ও উপত্যকার ওপর ভেসে বেড়ানো মেঘের মতো একা ঘুরছিলেন। হঠাৎ হ্রদের ধারে গাছের নিচে অগণিত সোনালি ড্যাফোডিল দেখেন, যারা বাতাসে নাচছে। দ্বিতীয় স্তবকে ফুলের সারিকে আকাশের গ্যালাক্সির তারার সঙ্গে তুলনা করা হয়েছে—সারিবদ্ধ, অন্তহীন।",
"তৃতীয় স্তবক: হ্রদের ঢেউও নাচছিল, কিন্তু ফুলের উচ্ছ্বাস তাকে ছাপিয়ে যায়। এমন সঙ্গীর সঙ্গে কবি আনন্দিত না হয়ে পারেননি। তিনি তাকিয়ে থাকলেন, কিন্তু তখন ভাবেননি যে এই দৃশ্য ভবিষ্যতে কত বড় সম্পদ হয়ে থাকবে।",
"চতুর্থ স্তবক: পরে যখন তিনি বিছানায় শুয়ে উদাস বা চিন্তাগ্রস্ত থাকেন, তখন সেই ফুলের স্মৃতি মনে ভেসে ওঠে—যা 'the bliss of solitude'। তখন তাঁর হৃদয় আনন্দে ভরে যায় এবং ড্যাফোডিলের সঙ্গে নাচতে শুরু করে। এভাবে কবিতাটি দেখায়, প্রকৃতির স্মৃতি মনকে চিরদিন সমৃদ্ধ করে।"],
"The Solitary Reaper":[
"কবি পাঠককে বলেন: দেখো, মাঠে এক পার্বত্য তরুণী একা ফসল কাটছে ও গান গাইছে। তাকে একা গাইতে দাও, নয়তো নীরবে পাশ দিয়ে যাও, কারণ গানের সুরে গভীর উপত্যকা ভরে গেছে। এই গান ক্লান্ত পথিককে মরুভূমির ছায়ার ঠান্ডা পানির মতো শান্তি দেয়।",
"কবি তুলনা করেন—এ গান বসন্তে সুদূর হেব্রাইডিস দ্বীপে কোকিলের ডাকের চেয়েও মনোমুগ্ধকর। তিনি গানের ভাষা (স্কটিশ গ্যালিক) বুঝতে পারেন না, তাই কল্পনা করেন গানটি প্রাচীন দুঃখের—'old, unhappy, far-off things, and battles long ago'—অথবা বর্তমানের কোনো সাধারণ ব্যথার।",
"শেষে কবি পাহাড়ে উঠে চলে যান, কিন্তু সুর তাঁর হৃদয়ে দীর্ঘ সময় বেঁচে থাকে—'The music in my heart I bore, long after it was heard no more'। কবিতাটি দেখায়, সংগীত ও স্মৃতি কেমন করে সময় ও দূরত্বকে পেরিয়ে যায়।"],
"Ode on a Grecian Urn":[
"স্তবক ১-২: কবি কলসকে 'unravish'd bride of quietness' বলে সম্বোধন করেন। কলসে বাঁশিওয়ালা ও প্রেমিক-প্রেমিকার ছবি—'Heard melodies are sweet, but those unheard are sweeter'। চিত্রের প্রেমিক কখনো চুম্বন পাবে না, কিন্তু প্রেয়সী কখনো ম্লানও হবে না।",
"স্তবক ৩-৪: গাছের ডাল কখনো পাতা ঝরায় না, বাঁশিওয়ালা চিরনতুন গান বাজাবে—এই অমর আনন্দ মানুষের জীবনের ক্ষণস্থায়ী আবেগের চেয়ে ভালো। আবার কবি দেখেন, বলি দিতে যাওয়া বাছুর ও একদল নগরবাসী—কিন্তু তাদের শহর চিরনির্জন, কেউ কখনো ফিরে এসে বলবে না কেন।",
"স্তবক ৫: কবি কলসকে 'Cold Pastoral' বলেন—যা মানুষের দুঃখে বন্ধুর মতো দাঁড়ায় ও বলে, 'Beauty is truth, truth beauty—that is all ye know on earth, and all ye need to know'। এভাবে কবি শিল্পের স্থায়িত্ব ও জীবনের নশ্বরতার বৈপরীত্য তুলে ধরেন।"],
"Ode to a Nightingale":[
"স্তবক ১-৩: কবির হৃদয় ব্যথায় অসাড়, যেন বিষ (hemlock) খেয়েছেন। তবু নাইটিঙ্গেলের আনন্দের গান শুনে তিনি ভাবেন, শীতল মদ খেয়ে পাখির সঙ্গে বনে হারিয়ে যেতে পারলে জগতের ক্লান্তি, ব্যাধি ও মৃত্যু—যৌবনের পাণ্ডুরতা—ভুলে যাওয়া যেত।",
"স্তবক ৪-৭: তিনি মদের বদলে কবিতার ডানায় (Poesy) উড়ে যান। অন্ধকারে ফুলের সুবাস অনুমান করেন। মৃত্যুকে এখন সুন্দর লাগে, কিন্তু পাখি অমর—'Thou wast not born for death, immortal Bird'—যার গান যুগে যুগে রাজা, কৃষক ও রুথও শুনেছে।",
"স্তবক ৮: 'Forlorn!' শব্দটি তাঁকে বাস্তবে টেনে আনে। কল্পনা তাঁকে ছলনা করেছে; পাখির গান দূরে মিলিয়ে যায়। কবি প্রশ্ন করেন—'Was it a vision, or a waking dream? Fled is that music: Do I wake or sleep?'—অর্থাৎ তিনি জানেন না এ সব সত্য না স্বপ্ন।"],
"The Rime of the Ancient Mariner":[
"Part I-II: একজন বৃদ্ধ নাবিক বিয়েবাড়ির অতিথিকে থামিয়ে কাহিনি বলে। জাহাজ দক্ষিণ মেরুর বরফে আটকালে এক অ্যালবাট্রস আসে, বরফ ফাটে ও বাতাস ফেরে। নাবিক হঠাৎ পাখিটিকে ক্রসবো দিয়ে মেরে ফেলে। প্রথমে সঙ্গীরা তাকে দোষ দেয়, পরে সূর্য উঠলে বলে সে ঠিক করেছে—কিন্তু বাতাস থেমে যায়, জাহাজ নিষ্প্রাণ সমুদ্রে স্থির।",
"Part III-V: পিপাসায় সবাই কাতর, 'Water, water, everywhere, nor any drop to drink'। এক ভূতুড়ে জাহাজ আসে, যাতে Death ও Life-in-Death পাশা খেলে; Life-in-Death নাবিককে জেতে। সঙ্গীরা একে একে মরে, নাবিক একা বেঁচে থাকে ও মৃতদেহ দেখে। সপ্তম দিনে সে জলের সাপের সৌন্দর্য দেখে অজান্তে আশীর্বাদ করে—অ্যালবাট্রস তার গলা থেকে খসে পড়ে।",
"Part VI-VII: আত্মারা মৃতদেহে ঢুকে জাহাজ চালিয়ে দেশে নিয়ে আসে। হারমিট নাবিকের পাপ স্বীকার শোনে। কিন্তু নাবিকের ওপর অভিশাপ থেকে যায়—তাকে মাঝে মাঝে কাহিনি বলতে হবে। শেষে সে অতিথিকে বলে: 'He prayeth best, who loveth best all things both great and small'। অতিথি পরদিন 'sadder and a wiser man' হয়ে ঘুম থেকে ওঠে।"],
"Ozymandias":[
"কবি এক প্রাচীন দেশ থেকে আসা ভ্রমণকারীর কাছে শোনেন—মরুভূমিতে একটি ধ্বংসপ্রাপ্ত মূর্তির দুটি বিশাল পাথুরে পা ধড় ছাড়া দাঁড়িয়ে আছে। পাশে বালুর মধ্যে মুখমণ্ডল আধা-পোঁতা অবস্থায় পড়ে—ভাস্কর যে ভাব ফুটিয়েছে তাতে আছে ভ্রূকুটি, ঠোঁটের কুঞ্চন ও আদেশ দেওয়ার ঠান্ডা অহংকার।",
"পাদপীঠে লেখা আছে: 'My name is Ozymandias, King of Kings; Look on my Works, ye Mighty, and despair!' অথচ চারপাশে কোনো কীর্তি নেই—শুধু 'boundless and bare, the lone and level sands stretch far away'। সময় রাজার অহংকারকে ও তাঁর সাম্রাজ্যকে মুছে দিয়েছে, কিন্তু শিল্পীর হাত ও রাজার আবেগ ঠিকই ভাস্কর্যে টিকে আছে।"],
"Ode to the West Wind":[
"স্তবক ১-৩: পশ্চিমা বাতাস শরতে মৃত পাতাদের উড়িয়ে নিয়ে যায় (ধ্বংসকারী), আবার বীজকে শীতের মাটির নিচে রাখে বসন্তে ফোটার জন্য (রক্ষাকারী)। সে আকাশে মেঘ ছড়ায়, সমুদ্রের ঢেউ জাগায় এবং ভূমধ্যসাগরের তলায় ঘুমন্ত প্রাচীন প্রাসাদের স্বপ্ন ভাঙে।",
"স্তবক ৪-৫: কবি ক্লান্ত—'I fall upon the thorns of life! I bleed!' যদি তিনি শৈশবের মতো স্বাধীন হতেন, বাতাসের সঙ্গে সমান তালে ছুটতেন। তিনি প্রার্থনা করেন বাতাস তাঁকে ঢেউ, পাতা বা মেঘের মতো তুলে নিক এবং তাঁর মৃত চিন্তাগুলো নতুন জীবনের জন্য সারা বিশ্বে ছড়িয়ে দিক।",
"সমাপ্তি: কবি বলেন, বাতাস তাঁর কণ্ঠকে অমোঘ মন্ত্রের মতো পৃথিবীতে ছড়িয়ে দিক, যাতে ঘুমন্ত পৃথিবী জেগে ওঠে। শেষ পঙ্ক্তি—'If Winter comes, can Spring be far behind?'—একটি বিশ্বাসের ঘোষণা: অন্ধকার ও দুঃখের পর আলো ও আশা আসবেই।"],
"Ulysses":[
"প্রথম অংশ: ইথাকার রাজা ইউলিসিস দীর্ঘ ভ্রমণ ও যুদ্ধের পর বাড়ি ফিরে এখন বিরক্ত—'an idle king, by this still hearth'। জীবনযাপন তার কাছে একঘেয়ে ও অর্থহীন। সে বলে, 'I cannot rest from travel: I will drink life to the lees'। অভিজ্ঞতা তার কাছে এমন একটি খিলান, যার ফাঁক দিয়ে অদেখা পৃথিবী ঝলমল করে।",
"দ্বিতীয় অংশ: সে রাজ্যের ভার দেয় ধৈর্যশীল ও কর্তব্যপরায়ণ পুত্র টেলিমাকাসকে, কারণ সে শাসনের কাজে দক্ষ, কিন্তু ইউলিসিসের স্বভাব সন্ধানী। সে ভাবে প্রত্যেকের নিজের কাজ আছে; টেলিমাকাস শান্ত জীবনের, সে নিজে অভিযানের।",
"তৃতীয় অংশ: সে পুরোনো সঙ্গীদের ডাক দেয় নতুন সমুদ্রযাত্রার জন্য—হয়তো ডুবে যাবে, কিংবা 'Happy Isles'-এ পৌঁছে আকিলিসের সঙ্গে দেখা হবে। 'We are not now that strength which in old days moved earth and heaven'—কিন্তু সময় ও ভাগ্যে দুর্বল হলেও ইচ্ছাশক্তি অটুট: 'To strive, to seek, to find, and not to yield'।"],
"Elegy Written in a Country Churchyard":[
"স্তবক ১-৫: সন্ধ্যায় ঘণ্টা বাজে, ক্ষেতের কৃষক ঘরে ফেরে, চারপাশ শান্ত। কবি গ্রামের গির্জাপ্রাঙ্গণে দাঁড়িয়ে প্রাচীন ইউ গাছের নিচে ঘুমন্ত সাধারণ মানুষের কবর দেখেন। তাঁদের আর কখনো সকালে জেগে ওঠা, ঘর-সংসারের আনন্দ বা শিশুদের চুম্বন থাকবে না।",
"স্তবক ৬-১৩: কবি বলেন—ধনীরা যেন এদের দারিদ্র্য ও সরল কাজকে অবজ্ঞা না করে, কারণ গৌরবের পথও অবশেষে কবরে গিয়ে শেষ হয়: 'The paths of glory lead but to the grave'। এখানে হয়তো কোনো মিল্টনের মতো নীরব প্রতিভা বা হ্যাম্পডেনের মতো সাহসী মানুষ শুয়ে আছে, যাদের দারিদ্র্য ও সুযোগের অভাব বিকশিত হতে দেয়নি—'Full many a flower is born to blush unseen'।",
"শেষ অংশ ('The Epitaph'): কবি নিজের মৃত্যুর কথা ভাবেন। একজন কৃষক পরে সেই কবর ও লেখা দেখে বলবে—এখানে এক তরুণ শুয়ে আছে, যে বিনীত ছিল, বিষণ্ণ ছিল, কিন্তু হৃদয়ে আন্তরিকতা ছিল। পাঠককে তার ভালো-মন্দ খুঁজতে নিষেধ করে শান্তভাবে ঈশ্বরের হাতে তুলে দেওয়া হয়।"],
"Don Juan":[
"ক্যান্টো ১-২: স্পেনের সেভিলে ডন জুয়ান মায়ের তত্ত্বাবধানে শিক্ষিত হয়, কিন্তু যৌবনে বিবাহিত ডোনা জুলিয়ার সঙ্গে প্রণয়ে জড়ায়। স্বামী ফিরে এলে সে পালায়, জুলিয়াকে কনভেন্টে পাঠানো হয় এবং জুয়ানকে বিদেশ-সফরে পাঠানো হয়। জাহাজ ডুবে গেলে বেঁচে যাওয়া যাত্রীরা নৌকায় ক্ষুধায় একে অপরকে খেতে বাধ্য হয়; জুয়ান একাই বাঁচে।",
"ক্যান্টো ২-৪: সে এক গ্রিক দ্বীপে পড়ে এবং জলদস্যুর কন্যা হাইদির সেবায় সুস্থ হয়, দুজনে প্রেমে পড়ে। হাইদির পিতা ল্যাম্বরো ফিরে এসে জুয়ানকে ধরে ক্রীতদাসের মতো বিক্রি করে দেয় এবং হাইদি শোকে মারা যায়। জুয়ানকে কনস্টান্টিনোপলে সুলতানের হারেমে নারী-ছদ্মবেশে লুকিয়ে রাখা হয়।",
"পরবর্তী ক্যান্টো: সে সুলতানের সুন্দরী গুলবেয়াজের প্রস্তাব এড়ায়, তারপর রুশ সেনাদলে যোগ দিয়ে ইসমাইল অবরোধে বীরত্ব দেখায় এবং রুশ সম্রাজ্ঞী ক্যাথরিনের প্রিয়পাত্র হয়। সম্রাজ্ঞী তাকে দূত করে ইংল্যান্ডে পাঠায়, যেখানে ইংরেজ সমাজের ভণ্ডামি ও কূটনীতির ওপর ব্যঙ্গ ফুটে ওঠে। কবি মৃত্যুর কারণে কাব্যটি অসমাপ্ত রেখে যান।"],
"The Second Coming":[
"প্রথম অংশ (১-৮ পঙ্ক্তি): বাজপাখি ক্রমশ বড় বৃত্তে ঘুরছে এবং শিকারির ডাক শুনতে পাচ্ছে না—'Turning and turning in the widening gyre'। সভ্যতার কেন্দ্র (শৃঙ্খলা, বিশ্বাস, সমাজ) ধরে রাখা যাচ্ছে না—'Things fall apart; the centre cannot hold'। 'Mere anarchy is loosed upon the world'—রক্তের জোয়ার ছুটছে এবং নিষ্পাপতার অনুষ্ঠান ডুবে যাচ্ছে।",
"দ্বিতীয় অংশ (৯-১৪): 'The best lack all conviction, while the worst are full of passionate intensity'। কবি ভাবেন, নিশ্চয়ই কোনো দিব্য প্রকাশ বা 'Second Coming' আসন্ন। কিন্তু সে শব্দটি বলতেই বিশ্বের আত্মা (Spiritus Mundi) থেকে এক বিশাল ছবি তাঁকে বিচলিত করে।",
"শেষ অংশ (১৫-২২): মরুভূমির বালুতে সিংহ-দেহ ও মানুষের মুখওয়ালা এক জন্তু ধীরে ধীরে নড়ছে; সূর্যের মতো নিষ্ঠুর ও নির্লিপ্ত তার চাহনি। কবি বুঝেন বিশ বছরের নিদ্রা (খ্রিস্টীয় যুগ) এক ঝুলন্ত দোলনা দ্বারা দুঃস্বপ্নে বদলে গেছে। শেষে প্রশ্ন—কী সেই ভয়ংকর জন্তু যে জন্ম নেওয়ার জন্য বেথলেহেমের দিকে ঝুঁকে এগোচ্ছে?"],
"Sohrab and Rustum":[
"প্রথম অংশ: তুরান ও পারস্যের যুদ্ধ চলছে। তুরানের বাহিনীতে থাকা তরুণ বীর সোহরাব গোপনে তার পিতাকে খুঁজছে। সে জানে না তার পিতা পারস্যের মহাবীর রুস্তম। তাঁর মা তাহমিনা তাকে পিতার পরিচয় ধরে রাখতে বলেছিল। সোহরাব প্রস্তাব দেয় দুই সেনাবাহিনী নয়—পারস্যের সেরা যোদ্ধা তার সঙ্গে একক যুদ্ধে নামুক।",
"দ্বিতীয় অংশ: রুস্তম কেই-কাউসের ওপর রাগে যুদ্ধ থেকে সরে থাকলেও শেষে নাম গোপন রেখে লড়তে রাজি হয়। সোহরাব তার নাম জিজ্ঞেস করলে রুস্তম মিথ্যে বলে; সে আশা করে এই বীরই তার পিতা। প্রথম দুই দফায় রুস্তম প্রায় হেরে যায়, কিন্তু তৃতীয় দফায় তাকে বর্শা বিদ্ধ করে।",
"শেষ অংশ: মৃত্যুপথে সোহরাব রুস্তমকে ভয় দেখায়—পিতা রুস্তম প্রতিশোধ নেবে। রুস্তম সত্য শুনে হতবাক হয়; সোহরাব বাহুর চিহ্ন (পিতার দেওয়া মোহর) দেখায়। রুস্তম শোকে ভেঙে পড়ে ও তলোয়ার ছুঁড়ে আত্মহত্যা করতে যায়, সোহরাব বাধা দেয়। শেষে ওকাস নদীর তীরে পিতা-পুত্রের স্মৃতিতে নীরবতা নেমে আসে—অজ্ঞতা ও ভাগ্যের নিষ্ঠুরতার প্রতীক।"],
"Hearts and Hands":[

["Thomas Gray","1716–1771 · ইংল্যান্ড · কবি","লন্ডনে জন্ম, ইটন ও কেমব্রিজে পড়েন। অল্প লিখলেও অসাধারণ মানের লেখক; কেমব্রিজের অধ্যাপক ছিলেন। 'Elegy' ইংরেজি সাহিত্যের সবচেয়ে জনপ্রিয় কবিতাগুলোর একটি।","Elegy Written in a Country Churchyard, Ode on a Distant Prospect of Eton College, The Bard, The Progress of Poesy"],
["Lord Alfred Tennyson","1809–1892 · ইংল্যান্ড · ভিক্টোরীয় কবি","লিঙ্কনশায়ারে জন্ম। বন্ধু আর্থার হ্যালামের মৃত্যুতে 'In Memoriam' লেখেন। ১৮৫০ সালে ওয়ার্ডসওয়ার্থের উত্তরসূরি হিসেবে Poet Laureate হন। ভিক্টোরীয় যুগের আশা, সংশয় ও বিশ্বাসের কণ্ঠস্বর।","Ulysses, In Memoriam A.H.H., Idylls of the King, Morte d'Arthur, The Lotos-Eaters, Locksley Hall, The Charge of the Light Brigade"],
["Alexander Pope","1688–1744 · ইংল্যান্ড · অগাস্টান কবি","লন্ডনে ক্যাথলিক পরিবারে জন্ম; শারীরিক প্রতিবন্ধিতা ছিল। অষ্টাদশ শতকের শ্রেষ্ঠ ব্যঙ্গ-কবি। heroic couplet-এর নিপুণ শিল্পী। হোমারের Iliad ও Odyssey অনুবাদ করেন।","An Essay on Criticism, An Essay on Man, The Rape of the Lock, The Dunciad"],
["John Milton","1608–1674 · ইংল্যান্ড · পিউরিটান কবি","লন্ডনে জন্ম। অলিভার ক্রমওয়েলের সরকারে Latin Secretary ছিলেন। ১৬৫২ সালের মধ্যে সম্পূর্ণ অন্ধ হয়ে যান। অন্ধ অবস্থায় 'Paradise Lost' রচনা করেন—ইংরেজি ভাষার শ্রেষ্ঠ মহাকাব্য।","Paradise Lost, Paradise Regained, Samson Agonistes, Areopagitica, Lycidas, Comus"],
["G. B. Shaw","1856–1950 · আয়ারল্যান্ড/ইংল্যান্ড · নাট্যকার","ডাবলিনে জন্ম; লন্ডনে চলে যান। Fabian Society-র সদস্য। ১৯২৫ সালে সাহিত্যে নোবেল ও Pygmalion-এর চিত্রনাট্যের জন্য অস্কার পান। তাঁর নাটকে ব্যঙ্গ, বুদ্ধিদীপ্ত সংলাপ ও সামাজিক সমস্যার আলোচনা প্রধান।","Arms and the Man, Man and Superman, Pygmalion, Saint Joan, Major Barbara, Candida"],
["Charles Dickens","1812–1870 · ইংল্যান্ড · ঔপন্যাসিক","পোর্টসমাউথে জন্ম। শৈশবে পিতা ঋণে কারাবন্দি হলে বুটের কালি কারখানায় কাজ করেন—যা তাঁর লেখায় প্রতিফলিত। ভিক্টোরীয় যুগের সবচেয়ে জনপ্রিয় ঔপন্যাসিক; সমাজের দারিদ্র্য, শিশুশ্রম ও অবিচার তাঁর লেখার বিষয়।","Oliver Twist, David Copperfield, Great Expectations, A Tale of Two Cities, Hard Times, Martin Chuzzlewit, A Christmas Carol, Pickwick Papers"],
["W. B. Yeats","1865–1939 · আয়ারল্যান্ড · কবি ও নাট্যকার","ডাবলিনে জন্ম। Irish Literary Revival ও Abbey Theatre-এর অন্যতম প্রতিষ্ঠাতা। ১৯২৩ সালে নোবেল পুরস্কার পান। প্রথমে রোমান্টিক, পরে আধুনিক প্রতীকী কবিতার জন্য বিখ্যাত।","The Second Coming, Easter 1916, Sailing to Byzantium, The Lake Isle of Innisfree, The Wild Swans at Coole"],
["T. S. Eliot", "1888–1965 · যুক্তরাষ্ট্র/ইংল্যান্ড · কবি, নাট্যকার, সমালোচক", "টমাস স্টার্নস এলিয়ট যুক্তরাষ্ট্রের মিসৌরির সেন্ট লুইসে জন্মগ্রহণ করেন। হার্ভার্ডে দর্শন পড়ে প্যারিস ও অক্সফোর্ডে উচ্চশিক্ষা নেন এবং ১৯১৪ সালে ইংল্যান্ডে স্থায়ী হন। কিছুদিন লয়েডস ব্যাংকে কাজ করে পরে প্রকাশনা সংস্থা Faber & Faber-এ যোগ দেন এবং 'The Criterion' পত্রিকা সম্পাদনা করেন। ১৯২৭ সালে ব্রিটিশ নাগরিকত্ব নেন ও অ্যাংলিকান চার্চে যোগ দেন। তিনি ইংরেজি আধুনিকতাবাদের (Modernism) প্রধান কবি; 'objective correlative' ও 'Tradition and the Individual Talent' ধারণার জন্য বিখ্যাত। তাঁর কবিতায় আধুনিক জীবনের শূন্যতা, নৈরাশ্য ও আত্মিক সংকট ফুটে ওঠে। ১৯৪৮ সালে সাহিত্যে নোবেল পুরস্কার পান। ১৯৬৫ সালে লন্ডনে মারা যান।", "The Love Song of J. Alfred Prufrock, The Waste Land, The Hollow Men, Ash-Wednesday, Four Quartets, Murder in the Cathedral, The Cocktail Party, Old Possum's Book of Practical Cats, The Sacred Wood, Selected Essays"],
["Gladstone","1809–1898 · যুক্তরাজ্য · রাজনীতিবিদ","উইলিয়াম এওয়ার্ট গ্ল্যাডস্টোন লিভারপুলে জন্ম, চারবার ব্রিটেনের প্রধানমন্ত্রী (লিবারেল দল)। আইরিশ হোম রুল ও শিক্ষা-সংস্কারের সমর্থক। আইনি ক্ষেত্রে বিখ্যাত উক্তি 'Justice delayed is justice denied' তাঁর নামে প্রচলিত।","রাজনৈতিক বক্তৃতা ও সংস্কারমূলক আইন; Studies on Homer"],
["Matthew Arnold","1822–1888 · ইংল্যান্ড · কবি ও সমালোচক","রাগবি স্কুলের প্রধানশিক্ষকের ছেলে; অক্সফোর্ডে Professor of Poetry ও স্কুল-পরিদর্শক। ভিক্টোরীয় যুগের সংশয় ও সংস্কৃতিবোধের প্রতিনিধি। সাহিত্য-সমালোচনায় 'touchstone method'-এর প্রবর্তক।","Sohrab and Rustum, Dover Beach, The Scholar-Gipsy, Culture and Anarchy, Essays in Criticism, The Study of Poetry"],
["Lord Byron","1788–1824 · ইংল্যান্ড · রোমান্টিক কবি","লন্ডনে জন্ম; জন্মগতভাবে খোঁড়া ছিলেন। 'Childe Harold' প্রকাশ করে রাতারাতি বিখ্যাত হন। 'Byronic hero' তাঁর সৃষ্টি। গ্রিক স্বাধীনতা সংগ্রামে যোগ দিয়ে মিসোলঙ্গিতে জ্বরে মারা যান।","Childe Harold's Pilgrimage, Don Juan, The Prisoner of Chillon, She Walks in Beauty, Manfred"],
["Dr. Samuel Johnson","1709–1784 · ইংল্যান্ড · সমালোচক, অভিধান-রচয়িতা","লিচফিল্ডে জন্ম। ১৭৫৫ সালে 'A Dictionary of the English Language' প্রকাশ করেন। অষ্টাদশ শতকের সাহিত্যিক স্বৈরশাসক বলা হয়। জীবনীকার জেমস বসওয়েল তাঁর বিখ্যাত জীবনী লেখেন।","A Dictionary of the English Language, Lives of the Poets, Rasselas, The Rambler, Preface to Shakespeare","Samuel Johnson"],
["George Eliot","1819–1880 · ইংল্যান্ড · ঔপন্যাসিক","আসল নাম মেরি অ্যান ইভান্স; পুরুষ ছদ্মনামে লিখতেন যাতে গুরুত্ব সহকারে নেওয়া হয়। বিখ্যাত বাস্তববাদী ঔপন্যাসিক; মানুষের নৈতিক সংগ্রাম ও গ্রাম্য জীবনের গভীর চিত্র তাঁর লেখায় পাওয়া যায়।","Adam Bede, The Mill on the Floss, Silas Marner, Middlemarch, Daniel Deronda"],
["Robert Browning","1812–1889 · ইংল্যান্ড · কবি","লন্ডনে জন্ম; কবি এলিজাবেথ ব্যারেট ব্রাউনিংকে বিয়ে করেন এবং ইতালিতে বসবাস করেন। 'dramatic monologue'-এর শ্রেষ্ঠ শিল্পী; মানুষের মনের জটিলতা তাঁর কবিতায় ধরা পড়েছে।","My Last Duchess, The Ring and the Book, Men and Women, Pippa Passes, Fra Lippo Lippi"],
["Edmund Burke","1729–1797 · আয়ারল্যান্ড/ব্রিটেন · রাজনীতিবিদ ও দার্শনিক","ডাবলিনে জন্ম; ব্রিটিশ পার্লামেন্টে হুইগ দলের সদস্য। রক্ষণশীলতার তাত্ত্বিক জনক হিসেবে পরিচিত। ফরাসি বিপ্লবের তীব্র সমালোচনা করে বিখ্যাত বই লেখেন।","Reflections on the Revolution in France, A Philosophical Enquiry into the Sublime and Beautiful, A Vindication of Natural Society"],
["William Blake","1757–1827 · ইংল্যান্ড · কবি, চিত্রকর, খোদাইশিল্পী","লন্ডনে জন্ম; জীবনকালে অবহেলিত ছিলেন। নিজের কবিতার সঙ্গে নিজেই ছবি এঁকে ছাপতেন। তাঁর কবিতায় নিষ্পাপতা ও অভিজ্ঞতার দ্বন্দ্ব, প্রতীক ও রহস্যবাদ প্রধান।","Songs of Innocence, Songs of Experience, The Marriage of Heaven and Hell, The Proverbs of Hell, The Divine Image, Jerusalem"],
["W. M. Thackeray","1811–1863 · ইংল্যান্ড · ঔপন্যাসিক","কলকাতায় জন্ম; ইংল্যান্ডে শিক্ষা। ভিক্টোরীয় সমাজের ভণ্ডামি, লোভ ও আভিজাত্যের ব্যঙ্গচিত্র আঁকাতে পটু। ডিকেন্সের প্রতিদ্বন্দ্বী।","Vanity Fair, Pendennis, Barry Lyndon, The Book of Snobs, The Newcomes"],
["Aristotle","384–322 BC · গ্রিস · দার্শনিক","স্তাগিরায় জন্ম; প্লেটোর শিষ্য ও আলেকজান্ডারের শিক্ষক। এথেন্সে 'Lyceum' প্রতিষ্ঠা করেন। যুক্তিবিদ্যা, নীতিশাস্ত্র, রাজনীতি ও সাহিত্যতত্ত্বের জনক। 'Poetics'-এ ট্র্যাজেডির সংজ্ঞা ও catharsis-এর ধারণা দেন।","Poetics, Politics, Nicomachean Ethics, Rhetoric, Metaphysics"],
["Plato","c. 428–348 BC · গ্রিস · দার্শনিক","এথেন্সের অভিজাত পরিবারে জন্ম; সক্রেটিসের শিষ্য। পাশ্চাত্যের প্রথম উচ্চশিক্ষা প্রতিষ্ঠান 'Academy' প্রতিষ্ঠা করেন। 'Theory of Forms' ও আদর্শ রাষ্ট্রের ধারণা তাঁর। কবিদের নিন্দা করলেও নিজে সংলাপধর্মী সাহিত্য-শিল্পী।","The Republic, Symposium, Apology, Phaedo, Laws"],
["Socrates","c. 470–399 BC · গ্রিস · দার্শনিক","এথেন্সে জন্ম; নিজে কিছু লেখেননি, তাঁর ধারণা প্লেটো ও জেনোফনের লেখায় পাওয়া যায়। প্রশ্নোত্তরের মাধ্যমে সত্য অনুসন্ধানের 'Socratic Method' তাঁর। যুবকদের বিপথগামী করার অভিযোগে বিচারে হেমলক বিষ পান করে মৃত্যুবরণ করেন।","(রচনা নেই) প্লেটোর Apology, Crito, Phaedo-তে তাঁর চিন্তা"],
["Benjamin Franklin","1706–1790 · যুক্তরাষ্ট্র · বিজ্ঞানী, লেখক, রাজনীতিবিদ","বোস্টনে জন্ম; মার্কিন যুক্তরাষ্ট্রের প্রতিষ্ঠাতা জনকদের একজন। বজ্রপাত-নিরোধক দণ্ড আবিষ্কার করেন। 'Poor Richard's Almanack'-এর প্রবাদ বিখ্যাত।","Poor Richard's Almanack, The Autobiography of Benjamin Franklin"],
["Charles Robert Darwin","1809–1882 · ইংল্যান্ড · প্রকৃতিবিদ","শ্রুসবেরিতে জন্ম। HMS Beagle জাহাজে বিশ্বভ্রমণের অভিজ্ঞতা থেকে ক্রমবিবর্তন তত্ত্ব দেন। 'Survival of the fittest' শব্দটি হার্বার্ট স্পেন্সারের, যা পরে ডারউইন গ্রহণ করেন।","On the Origin of Species (1859), The Descent of Man, The Voyage of the Beagle"],
["O. Henry","1862–1910 · যুক্তরাষ্ট্র · ছোটগল্পকার","আসল নাম উইলিয়াম সিডনি পোর্টার; নর্থ ক্যারোলাইনায় জন্ম। ব্যাংকের অর্থ আত্মসাতের দায়ে কারাভোগ করেন; জেলে থেকেই লেখা শুরু। গল্পের শেষে অপ্রত্যাশিত মোড় (twist ending) তাঁর বৈশিষ্ট্য।","The Gift of the Magi, The Last Leaf, The Cop and the Anthem, Hearts and Hands"],
["Charlotte Bronte","1816–1855 · ইংল্যান্ড · ঔপন্যাসিক","ইয়র্কশায়ারে যাজকের কন্যা; বোন এমিলি ও অ্যান-ও লেখক। 'Currer Bell' ছদ্মনামে লিখতেন। 'Jane Eyre' নারীর আত্মমর্যাদা ও স্বাধীনতার ঘোষণা হিসেবে বিখ্যাত। ৩৮ বছর বয়সে মারা যান।","Jane Eyre, Shirley, Villette, The Professor"],
["Karl Marx","1818–1883 · জার্মানি/ইংল্যান্ড · দার্শনিক ও অর্থনীতিবিদ","ট্রিয়ারে জন্ম; নির্বাসনে লন্ডনে বসবাস করেন। ফ্রেডরিক এঙ্গেলসের সঙ্গে 'The Communist Manifesto' লেখেন। ইতিহাসের বস্তুবাদী ব্যাখ্যা ও পুঁজিবাদ-সমালোচনার জনক।","The Communist Manifesto (1848), Das Kapital, The Eighteenth Brumaire of Louis Bonaparte"],
["John Dryden","1631–1700 · ইংল্যান্ড · কবি, নাট্যকার, সমালোচক","১৬৬৮ সালে ইংল্যান্ডের প্রথম Poet Laureate। 'Father of English Criticism'—ইংরেজি গদ্যকে স্পষ্ট ও সহজ রূপ দেন। ব্যঙ্গাত্মক কবিতা ও heroic couplet-এ দক্ষ।","Absalom and Achitophel, Mac Flecknoe, All for Love, An Essay of Dramatic Poesy"],
["John Bunyan","1628–1688 · ইংল্যান্ড · ধর্মপ্রচারক ও লেখক","বেডফোর্ডে জন্ম; পেশায় টিনকারিগর। বিনা অনুমতিতে ধর্ম প্রচারের দায়ে বারো বছর কারাবাসে থাকেন। কারাগারেই 'The Pilgrim's Progress' রচনা করেন—বাইবেলের পর সর্বাধিক পঠিত ধর্মীয় রূপক।","The Pilgrim's Progress, Grace Abounding, The Holy War"],
["George Herbert","1593–1633 · ইংল্যান্ড/ওয়েলস · মেটাফিজিক্যাল কবি","ওয়েলসে জন্ম; অভিজাত পরিবারের সন্তান হয়েও যাজকের জীবন বেছে নেন। তাঁর ধর্মীয় কবিতা সরল ভাষা ও গভীর বিনয়ের জন্য বিখ্যাত।","The Temple, A Priest to the Temple, Jacula Prudentum"],
["Samuel Butler","1613–1680 · ইংল্যান্ড · ব্যঙ্গ-কবি","(PDF-এ নির্দিষ্ট করা নেই; সম্ভবত সপ্তদশ শতকের কবি।) 'Hudibras' নামের মহাকাব্যিক ব্যঙ্গরচনা পিউরিটানদের ব্যঙ্গ করে লেখেন। (একই নামে ১৯শ শতকের উপন্যাসিক Samuel Butler 'Erewhon'-এর লেখক ছিলেন।)","Hudibras"],
["Rousseau","1712–1778 · সুইজারল্যান্ড/ফ্রান্স · দার্শনিক","জেনেভায় জন্ম। ফরাসি বিপ্লবের চিন্তাগত ভিত্তি রচনা করেন। 'Man is born free, and everywhere he is in chains'—'The Social Contract'-এর প্রথম বাক্য।","The Social Contract, Emile, Confessions, Discourse on Inequality"],
["Gautama Buddha","c. 563–483 BC (মতান্তর আছে) · নেপাল/ভারত · ধর্মগুরু","লুম্বিনীতে রাজকুমার সিদ্ধার্থ হিসেবে জন্ম। সংসার ত্যাগ করে বোধগয়ায় বোধিজ্ঞান লাভ করেন। চার আর্যসত্য ও অষ্টাঙ্গিক মার্গের শিক্ষা দেন।","(লিখিত রচনা নেই) ধম্মপদ ও ত্রিপিটকে তাঁর উপদেশ সংকলিত"],
["Martin Luther King Jr.","1929–1968 · যুক্তরাষ্ট্র · নাগরিক অধিকার নেতা","আটলান্টায় জন্ম। অহিংস আন্দোলনের নেতা; ১৯৬৪ সালে নোবেল শান্তি পুরস্কার। ১৯৬৩ সালে 'I Have a Dream' ভাষণ দেন। 'Letter from Birmingham Jail'-এ 'Injustice anywhere...' লেখেন। মেমফিসে গুলিতে নিহত হন।","I Have a Dream (ভাষণ), Letter from Birmingham Jail, Stride Toward Freedom"],
["Voltaire","1694–1778 · ফ্রান্স · দার্শনিক, ব্যঙ্গলেখক","আসল নাম ফ্রাঁসোয়া-মারি আরুয়ে। আলোকায়নের (Enlightenment) প্রধান কণ্ঠ; চার্চ ও স্বৈরতন্ত্রের সমালোচক। বাকস্বাধীনতার প্রতীক। (উল্লেখ্য: 'I disapprove of what you say...' উক্তিটি আসলে ইভলিন বিয়াট্রিস হলের লেখা, যা Voltaire-এর চিন্তার সারাংশ হিসেবে প্রচলিত।)","Candide, Zadig, Letters on England, Treatise on Tolerance"],
["Thomas Jefferson","1743–1826 · যুক্তরাষ্ট্র · তৃতীয় রাষ্ট্রপতি","ভার্জিনিয়ায় জন্ম। ১৭৭৬ সালের স্বাধীনতার ঘোষণাপত্রের (Declaration of Independence) প্রধান রচয়িতা। ১৮০৩ সালে ফ্রান্সের কাছ থেকে লুইজিয়ানা কিনে নেন।","Declaration of Independence, Notes on the State of Virginia"],
["Henry Ward Beecher","1813–1887 · যুক্তরাষ্ট্র · যাজক ও বক্তা","আমেরিকান ধর্মযাজক ও দাসপ্রথা-বিরোধী বক্তা। 'Uncle Tom's Cabin'-এর লেখিকা হ্যারিয়েট বিচার স্টো-র ভাই। ব্রুকলিনের প্লাইমাউথ চার্চের জনপ্রিয় যাজক।","Lectures to Young Men, Life Thoughts, Norwood"],
["Abraham Lincoln","1809–1865 · যুক্তরাষ্ট্র · ষোড়শ রাষ্ট্রপতি","কেন্টাকির দরিদ্র পরিবারে জন্ম। গৃহযুদ্ধের সময় রাষ্ট্রপতি; ১৮৬৩ সালে Emancipation Proclamation দিয়ে দাসপ্রথার অবসান ঘটান। গেটিসবার্গ ভাষণে গণতন্ত্রের সংজ্ঞা দেন। জন উইল্কস বুথের গুলিতে নিহত হন।","Gettysburg Address, Emancipation Proclamation, Second Inaugural Address"],
["Henrik Ibsen","1828–1906 · নরওয়ে · নাট্যকার","আধুনিক নাটকের জনক। সমাজের ভণ্ডামি, নারীর স্বাধীনতা ও ব্যক্তির আত্ম-পরিচয় তাঁর নাটকের বিষয়। 'A Doll's House'-এর সমাপ্তি দর্শকদের স্তম্ভিত করে।","A Doll's House, Ghosts, Hedda Gabler, An Enemy of the People, The Wild Duck, Peer Gynt"],
["Thomas à Kempis","c. 1380–1471 · জার্মানি/নেদারল্যান্ডস · ধর্মীয় লেখক","জার্মানিতে জন্ম; নেদারল্যান্ডসে অগাস্টিনীয় মঠে আজীবন সন্ন্যাসী। 'The Imitation of Christ' বইটি খ্রিস্টান ধর্মের অন্যতম জনপ্রিয় ভক্তিগ্রন্থ।","The Imitation of Christ"],
["Thomas Carlyle","1795–1881 · স্কটল্যান্ড/ইংল্যান্ড · ঐতিহাসিক ও প্রাবন্ধিক","স্কটল্যান্ডে জন্ম; লন্ডনে বসবাস। ভিক্টোরীয় যুগের 'Sage of Chelsea'। বীরপূজা ও নৈতিক দায়িত্বের ওপর জোর দেন। তাঁর গদ্য আবেগময় ও অলংকারপূর্ণ।","Sartor Resartus, The French Revolution, On Heroes and Hero-Worship, Past and Present"],
["A. P. J. Abdul Kalam","1931–2015 · ভারত · বিজ্ঞানী ও রাষ্ট্রপতি","তামিলনাড়ুর রামেশ্বরমে জন্ম। ভারতের 'Missile Man'; ২০০২–২০০৭ সালে একাদশ রাষ্ট্রপতি। ১৯৯৭ সালে ভারতরত্ন পান। তরুণদের স্বপ্ন দেখার অনুপ্রেরণা দিতেন।","Wings of Fire, India 2020, Ignited Minds, My Journey"],
["Nelson Mandela","1918–2013 · দক্ষিণ আফ্রিকা · রাষ্ট্রনায়ক","বর্ণবাদ-বিরোধী আন্দোলনের কারণে ২৭ বছর কারাবাসে ছিলেন। ১৯৯৩ সালে নোবেল শান্তি পুরস্কার; ১৯৯৪–৯৯ দক্ষিণ আফ্রিকার প্রথম কৃষ্ণাঙ্গ রাষ্ট্রপতি।","Long Walk to Freedom"],
["Albert Einstein","1879–1955 · জার্মানি/যুক্তরাষ্ট্র · পদার্থবিজ্ঞানী","উল্মে জন্ম। আপেক্ষিকতার তত্ত্ব ও E=mc² সূত্রের আবিষ্কারক। ১৯২১ সালে আলোক-তড়িৎ প্রভাবের জন্য নোবেল পুরস্কার পান।","Special and General Theory of Relativity, The World as I See It"],
["George Farquhar","1677–1707 · আয়ারল্যান্ড · নাট্যকার","(PDF-এ বানান 'Faequser' লেখা আছে; এটি সম্ভবত জর্জ ফারকুহার।) রেস্টোরেশন যুগের কমেডি-নাট্যকার; মাত্র ২৯ বছর বয়সে মারা যান। 'Necessity is the mother of invention' উক্তিটি তাঁর 'Love and a Bottle' নাটকে পাওয়া যায়।","The Recruiting Officer, The Beaux' Stratagem, Love and a Bottle",["Faequser"]],
["Virginia Woolf","1882–1941 · ইংল্যান্ড · ঔপন্যাসিক","লন্ডনে জন্ম; Bloomsbury Group-এর সদস্য। 'stream of consciousness' উপন্যাসের শ্রেষ্ঠ শিল্পী; নারীবাদী প্রবন্ধেও অগ্রগামী।","Mrs Dalloway, To the Lighthouse, Orlando, A Room of One's Own"],
["Napoleon Bonaparte","1769–1821 · ফ্রান্স · সম্রাট ও সেনাপতি","কর্সিকায় জন্ম। ১৮০৪ সালে ফরাসিদের সম্রাট হন। ওয়াটারলুতে (১৮১৫) পরাজিত হয়ে সেন্ট হেলেনায় নির্বাসিত হন। নেপোলিয়নিক কোড ফরাসি আইনের ভিত্তি।","Napoleonic Code (প্রণয়নে নেতৃত্ব), চিঠিপত্র ও স্মৃতিকথা"],
["Thomas Hardy","1840–1928 · ইংল্যান্ড · ঔপন্যাসিক ও কবি","ডরসেটে জন্ম। 'Wessex' অঞ্চলের কল্পিত গ্রামীণ পটভূমিতে লিখতেন। নিয়তি ও সমাজের নিষ্ঠুরতা তাঁর উপন্যাসের বিষয়। 'Jude the Obscure'-এর সমালোচনায় বিরক্ত হয়ে উপন্যাস ছেড়ে কবিতায় ফিরে যান।","Tess of the d'Urbervilles, Jude the Obscure, The Mayor of Casterbridge, Far from the Madding Crowd, The Return of the Native"],
["Nicolas Chamfort","1741–1794 · ফ্রান্স · নীতিকার","ফরাসি প্রবাদধর্মী গদ্যলেখক (moralist)। ফরাসি বিপ্লবে সমর্থক হলেও পরে বিপ্লবীদের দ্বারা কারারুদ্ধ হন। তাঁর সংক্ষিপ্ত প্রবাদ ও পর্যবেক্ষণ বিখ্যাত।","Maximes et Pensées, Caractères et Anecdotes"],
["Oliver Goldsmith","1728–1774 · আয়ারল্যান্ড · লেখক","আয়ারল্যান্ডে জন্ম; লন্ডনে লেখক হিসেবে সংগ্রাম করেন। উপন্যাস, নাটক ও কবিতায় সমান দক্ষ।","The Vicar of Wakefield, She Stoops to Conquer, The Deserted Village, The Traveller"],
["Ben Jonson","1572–1637 · ইংল্যান্ড · নাট্যকার ও কবি","লন্ডনে জন্ম; শেক্সপিয়ারের সমসাময়িক। 'comedy of humours'-এর প্রবর্তক। শাস্ত্রীয় নিয়ম মেনে নাটক লেখেন।","Volpone, The Alchemist, Every Man in His Humour, Bartholomew Fair"],
["Abraham Cowley","1618–1667 · ইংল্যান্ড · মেটাফিজিক্যাল কবি","লন্ডনে জন্ম; কেমব্রিজে পড়েন। কবিতা ও প্রবন্ধ উভয়ে দক্ষ; Pindaric ode-কে ইংরেজিতে জনপ্রিয় করেন।","The Mistress, Davideis, Pindarique Odes, Essays"],
["Dylan Thomas","1914–1953 · ওয়েলস · কবি","সোয়ানসিতে জন্ম। শব্দের সংগীতময় ব্যবহার ও আবেগের তীব্রতা তাঁর কবিতার বৈশিষ্ট্য। 'Fern Hill' কবিতায় 'Time let me hail and climb golden in the heydays of his eyes' আছে।","Fern Hill, Do Not Go Gentle into That Good Night, Under Milk Wood, 18 Poems"],
["Nathaniel Hawthorne","1804–1864 · যুক্তরাষ্ট্র · ঔপন্যাসিক","ম্যাসাচুসেটসের সালেমে জন্ম। পিউরিটান নৈতিকতা, পাপ ও অপরাধবোধ তাঁর লেখার বিষয়। 'The Scarlet Letter' মার্কিন সাহিত্যের ক্লাসিক।","The Scarlet Letter, The House of the Seven Gables, Young Goodman Brown"],
["Saul Bellow","1915–2005 · কানাডা/যুক্তরাষ্ট্র · ঔপন্যাসিক","১৯৭৬ সালে সাহিত্যে নোবেল পুরস্কার পান। আধুনিক মানুষের আত্মিক সংকট ও বুদ্ধিবৃত্তিক দ্বন্দ্ব তাঁর বিষয়।","The Adventures of Augie March, Herzog, Humboldt's Gift, Seize the Day"],

["Roosevelt","1858–1919 · যুক্তরাষ্ট্র · রাষ্ট্রপতি","(সম্ভবত থিওডোর রুজভেল্ট) ২৬তম মার্কিন রাষ্ট্রপতি; ১৯০৬ সালে নোবেল শান্তি পুরস্কার পান। 'Square Deal' নীতির প্রবক্তা এবং 'Rough Riders'-এর নেতা।","The Rough Riders, The Strenuous Life, Autobiography"],

let PRE_AUTH="";
let BIO_SEL="";
function bioKeys(b){return [b[0]].concat(b[4]||[])}
function viewBios(){
  const list=BIOS.filter(b=>!BIO_SEL||b[0]===BIO_SEL);
  $("#app").innerHTML=`<div class="tools bn"><select id="bsel" style="min-width:0;width:100%;max-width:300px">
    <option value="">সব লেখক (${BIOS.length}জন)</option>
    ${BIOS.map(b=>`<option value="${esc(b[0])}" ${b[0]===BIO_SEL?"selected":""}>${esc(b[0])}</option>`).join("")}
  </select></div>
  <p class="small bn">লেখক নির্বাচন করে তাঁর জীবনী দেখুন। 'উক্তি দেখুন' চাপলে সেই লেখকের সব উক্তি খুলবে।</p>`+
  list.map(b=>{
    const keys=bioKeys(b);
    const cnt=Q.filter(q=>keys.includes(q.a)).length;
    const first=keys.find(k=>Q.some(q=>q.a===k))||b[0];
    return `<div class="card bn"><h3 style="margin:0 0 2px;color:#274a7c">${esc(b[0])}</h3>
    <div class="small" style="margin-bottom:8px">${esc(b[1])}</div>

    <p style="margin:6px 0"><span style="font-weight:700;color:#8a6410">প্রধান রচনা:</span> ${esc(b[3])}</p>
    ${cnt?`<button class="btn alt" data-qa="${esc(first)}">এই লেখকের উক্তি দেখুন (${cnt}টি)</button>`:""}</div>`}).join("");
  $("#bsel").onchange=e=>{BIO_SEL=e.target.value;viewBios()};
  document.querySelectorAll("[data-qa]").forEach(b=>b.onclick=()=>{PRE_AUTH=b.dataset.qa;go("browse")});
}
let STORY_AUTH="",STORY_OPEN="";
const storyAuthor=s=>s.w.split(" (")[0];
function viewStories(){
  const auths=[...new Set(STORIES.map(storyAuthor))];
  const shown=STORIES.filter(s=>!STORY_AUTH||storyAuthor(s)===STORY_AUTH);
  $("#app").innerHTML=`<div class="tools bn"><select id="sauth" style="min-width:0;width:100%;max-width:300px">

    ${auths.map(a=>`<option value="${esc(a)}" ${a===STORY_AUTH?"selected":""}>${esc(a)} (${STORIES.filter(s=>storyAuthor(s)===a).length})</option>`).join("")}
  </select></div>
  <p class="small bn">লেখক নির্বাচন করলে তাঁর সাহিত্যকর্মের সারাংশ দেখাবে। বিস্তারিত দেখতে শিরোনামে ক্লিক করুন।</p>`+
  shown.map((s,i)=>{
    const qs=Q.filter(q=>q.s===s.t||(s.t==="Twelfth Night"&&q.s==="Twelfth Night"));
    return `<details class="card story bn" ${(STORY_OPEN?s.t===STORY_OPEN:i===0)?"open":""} data-t="${esc(s.t)}"><summary><h3>${esc(s.t)}</h3><div class="by">${esc(s.w)}</div></summary>

    ${qs.length?`<p><span class="lbl">এই কাজের উক্তি (${qs.length}টি):</span></p>${qs.map(q=>`<p style="font-family:Georgia,serif;margin:4px 0">&ldquo;${esc(q.q)}&rdquo; <span class="small">— ${esc(q.c||q.a)}</span></p>`).join("")}`:""}

}

    const t=$("#lts").value.trim().toLowerCase(),g=$("#ltg").value;
    const res=LT.filter(x=>(!g||x.g===g)&&(!t||(x.t+" "+x.b+" "+x.d+" "+x.ex.join(" ")).toLowerCase().includes(t)));
    $("#ltc").textContent=res.length+"টি টার্ম";
    $("#ltl").innerHTML=res.length?res.map(x=>`<div class="card"><div style="display:flex;flex-wrap:wrap;gap:8px;align-items:baseline"><span style="font-size:1.15rem;font-weight:700;color:#274a7c;font-family:Georgia,serif">${esc(x.t)}</span>${x.b?`<span class="who bn">${esc(x.b)}</span>`:""}${x.g==="fig"?`<span class="src">Figure of speech</span>`:""}</div>
      <p class="bn" style="margin:6px 0">${esc(x.d)}</p>
      ${x.ex.length?`<ul style="margin:4px 0 0;padding-left:20px;font-style:italic;font-family:Georgia,serif">${x.ex.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`:""}</div>`).join(""):`<div class="empty">কোনো টার্ম পাওয়া যায়নি।</div>`;
  };
  $("#lts").oninput=draw;$("#ltg").onchange=draw;draw();
}
function ltQuiz(){
  if(!LT_Q){
    $("#app").innerHTML=ltTabs()+`<div class="card"><h2 style="margin-top:0">Literary Terms কুইজ</h2>
    <div class="row"><label>ধরন</label><select id="lqm"><option value="d">সংজ্ঞা দেখে টার্ম চেনা</option><option value="b">টার্ম দেখে বাংলা অর্থ চেনা</option><option value="m">মিশ্র</option></select></div>
    <div class="row"><label>প্রশ্ন সংখ্যা</label><select id="lqn"><option>10</option><option>20</option><option>30</option><option value="0">সব</option></select></div>
    <button class="btn" id="lqgo">শুরু করুন</button></div>`;
    ltBind();
    $("#lqgo").onclick=()=>{
      const mode=$("#lqm").value;let n=+$("#lqn").value;
      let pool=shuffle(LT.filter(x=>x.d));
      if(n)pool=pool.slice(0,n);
      const qs=pool.map(x=>{
        let ty=mode==="m"?(x.b&&Math.random()<.5?"b":"d"):mode;
        if(ty==="b"&&!x.b)ty="d";
        let correct,opts;
        if(ty==="d"){correct=x.t;opts=shuffle([correct,...shuffle(LT.filter(y=>y.t!==x.t)).slice(0,3).map(y=>y.t)])}
        else{correct=x.b;const others=[...new Set(LT.filter(y=>y.b&&y.b!==x.b).map(y=>y.b))];opts=shuffle([correct,...shuffle(others).slice(0,3)])}
        return {x,ty,correct,opts,sel:null};
      });
      LT_Q={qs,i:0,score:0};ltQuiz();
    };
    return;
  }
  const S=LT_Q;
  if(S.i>=S.qs.length){
    $("#app").innerHTML=ltTabs()+`<div class="card" style="text-align:center"><h2>কুইজ শেষ</h2><div class="score">${S.score} / ${S.qs.length}</div><p>${Math.round(S.score/S.qs.length*100)}% সঠিক</p><button class="btn" id="lqre">আবার</button></div>`;
    ltBind();$("#lqre").onclick=()=>{LT_Q=null;ltQuiz()};return;
  }
  const it=S.qs[S.i],ans=it.sel!==null;
  $("#app").innerHTML=ltTabs()+`<div class="small">প্রশ্ন ${S.i+1} / ${S.qs.length} · স্কোর ${S.score}</div><div class="progress"><div style="width:${Math.round(S.i/S.qs.length*100)}%"></div></div>
  <div class="card"><div class="qtype">${it.ty==="d"?"কোন টার্মের সংজ্ঞা এটি?":"এই টার্মের বাংলা অর্থ কী?"}</div>
  <p class="q-text bn">${esc(it.ty==="d"?it.x.d:it.x.t)}</p>
  ${it.opts.map((o,k)=>{let c="";if(ans){if(o===it.correct)c="right";else if(k===it.sel)c="wrong"}return `<button class="opt bn ${c}" data-k="${k}" ${ans?"disabled":""}>${esc(o)}</button>`}).join("")}
  ${ans?`<div class="feedback ${it.opts[it.sel]===it.correct?"ok":"no"} bn">${it.opts[it.sel]===it.correct?"✔ সঠিক!":"✘ ভুল। সঠিক উত্তর: <b>"+esc(it.correct)+"</b>"}<div style="margin-top:6px"><b>${esc(it.x.t)}</b>${it.x.b?" — "+esc(it.x.b):""}<br>${esc(it.x.d)}</div></div><div class="row"><button class="btn" id="lqnx" style="margin-left:auto">${S.i+1<S.qs.length?"পরবর্তী →":"শেষ"}</button></div>`:""}</div>`;
  ltBind();
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{it.sel=+b.dataset.k;if(it.opts[it.sel]===it.correct)S.score++;ltQuiz()});
  if($("#lqnx"))$("#lqnx").onclick=()=>{S.i++;ltQuiz()};
}
function ltPrev(){
  $("#app").innerHTML=ltTabs()+`<p class="small bn">PDF-এ থাকা BCS প্রশ্নগুলো। অপশনে ক্লিক করলে উত্তর দেখাবে।</p>`+LT_PREV.map((q,i)=>`<div class="card" data-pq="${i}"><div class="qtype">${i+1}. ${esc(q[0])} <span class="note">${esc(q[1])}</span></div>${q[2].map((o,k)=>`<button class="opt" data-k="${k}">${"ABCD"[k]}. ${esc(o)}</button>`).join("")}</div>`).join("");
  ltBind();
  document.querySelectorAll("[data-pq]").forEach(c=>{
    const q=LT_PREV[+c.dataset.pq];
    c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k;
      c.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(j===q[3])x.classList.add("right");else if(j===k)x.classList.add("wrong")});
    });
  });
}

/* ---------------- TARGET (daily reading) ---------------- */
function dkey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function getReadAll(){return load("bcsq_read",{})}
function getTarget(){return +load("bcsq_target",0)||0}
function todayIds(){return (getReadAll()[dkey()]||[])}
function isRead(id){return todayIds().includes(id)}
function toggleRead(id){
  const all=getReadAll(),k=dkey();let a=all[k]||[];
  a=a.includes(id)?a.filter(x=>x!==id):a.concat(id);
  if(a.length)all[k]=a;else delete all[k];
  save("bcsq_read",all);
}
function updateStrip(){
  const el=$("#tstrip");if(!el)return;
  const t=getTarget(),n=todayIds().length;
  el.innerHTML=t?`<span>🎯 আজকের টার্গেট: <b>${n}/${t}</b></span><div class="progress"><div style="width:${Math.min(100,Math.round(n/t*100))}%"></div></div>${n>=t?"<span>✅</span>":""}`
               :`<span>🎯 আজকের পড়ার টার্গেট সেট করুন (আজ পড়া: <b>${n}</b>)</span>`;
  el.onclick=()=>go("target");
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-rd]");if(!b)return;
  const id=+b.dataset.rd;toggleRead(id);
  const on=isRead(id);
  document.querySelectorAll(`[data-rd="${id}"]`).forEach(x=>{x.classList.toggle("on",on);x.textContent=on?"✓ পড়া হয়েছে":"○ পড়া হয়েছে মার্ক করুন"});
  updateStrip();
  if(view==="target")viewTarget();
});
function reviseStart(ids,mode){
  const pool=shuffle(ids.map(i=>Q[i]));
  if(!pool.length)return;
  go("practice");
  P={mode:mode,list:mode==="flash"?pool:pool.map(q=>makeQuestion(q,null)),i:0,score:0,show:false};
  drawPractice();
}
function bnDate(k){
  const [y,m,d]=k.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString("bn-BD",{day:"numeric",month:"long",year:"numeric",weekday:"long"});
}
function viewTarget(){
  const t=getTarget(),ids=todayIds(),all=getReadAll(),tk=dkey();
  const pct=t?Math.min(100,Math.round(ids.length/t*100)):0;
  const past=Object.keys(all).filter(k=>k!==tk).sort().reverse();
  $("#app").innerHTML=`<div class="card bn"><h2 style="margin-top:0">🎯 আজকের টার্গেট</h2>
  <p class="small">${esc(bnDate(tk))} · প্রতিদিন নতুন করে শুরু হয়। কোনো উক্তির নিচে "পড়া হয়েছে মার্ক করুন" চাপলে সেটি আজকের গণনায় যোগ হবে।</p>
  <div class="row"><label>দৈনিক টার্গেট</label><input type="text" id="tin" class="tnum" inputmode="numeric" value="${t||""}" placeholder="যেমন 20"><span class="small">টি উক্তি</span><button class="btn" id="tsv">সেট করুন</button></div>
  ${t?`<div style="font-size:1.6rem;font-weight:700;color:var(--accent)">${ids.length} / ${t}</div><div class="progress"><div style="width:${pct}%;background:var(--good)"></div></div>
  <p>${ids.length>=t?"🎉 অভিনন্দন! আজকের টার্গেট পূর্ণ হয়েছে।":`আর ${t-ids.length}টি উক্তি পড়লে আজকের টার্গেট পূর্ণ হবে।`}</p>`
  :`<p class="small">আজ পড়া হয়েছে: <b>${ids.length}</b>টি। টার্গেট সেট করলে অগ্রগতি দেখা যাবে।</p>`}
  <div class="row"><button class="btn" id="tbr">All Quotes থেকে পড়া শুরু করুন</button></div></div>
  <div class="card bn"><h3 style="margin-top:0">আজ পড়া উক্তি (${ids.length})</h3>
  ${ids.length?`<div class="row"><button class="btn alt" id="tfl">Flashcard দিয়ে রিভিশন</button><button class="btn alt" id="tqz">Quiz দিয়ে রিভিশন</button></div>`:`<p class="small">আজ এখনো কোনো উক্তি মার্ক করা হয়নি।</p>`}</div>
  ${ids.map(i=>quoteCard(Q[i])).join("")}
  <h3 class="bn">আগের দিনের পড়া (রিভিশন)</h3>
  ${past.length?past.map(k=>`<details class="card bn"><summary style="cursor:pointer"><b>${esc(bnDate(k))}</b> — ${all[k].length}টি উক্তি</summary>
    <div class="row"><button class="btn alt" data-rv="${k}" data-m="flash">Flashcard রিভিশন</button><button class="btn alt" data-rv="${k}" data-m="mix">Quiz রিভিশন</button></div>
    ${all[k].map(i=>`<p style="font-family:Georgia,serif;margin:6px 0">&ldquo;${esc(Q[i].q)}&rdquo; <span class="small">— ${esc(Q[i].c||Q[i].a)}</span></p>`).join("")}</details>`).join(""):`<p class="small bn">আগের কোনো দিনের তথ্য নেই।</p>`}`;
  $("#tsv").onclick=()=>{const v=parseInt($("#tin").value,10);save("bcsq_target",isNaN(v)||v<0?0:v);updateStrip();viewTarget()};
  $("#tin").onkeydown=e=>{if(e.key==="Enter")$("#tsv").onclick()};
  $("#tbr").onclick=()=>go("browse");
  if($("#tfl"))$("#tfl").onclick=()=>reviseStart(ids,"flash");
  if($("#tqz"))$("#tqz").onclick=()=>reviseStart(ids,"mix");
  document.querySelectorAll("[data-rv]").forEach(b=>b.onclick=()=>reviseStart(all[b.dataset.rv],b.dataset.m));
}
window.addEventListener("focus",updateStrip);

/* ---------------- quote -> biography / summary links ---------------- */
function hasStory(t){return STORIES.some(s=>s.t===t)}
function openBox(inner){
  closeTermBox();
  const m=document.createElement("div");m.className="mbg";m.id="tmodal";
  m.innerHTML=`<div class="mbox bn"><button class="x" aria-label="close">×</button>${inner}</div>`;
  document.body.appendChild(m);
  m.addEventListener("click",e=>{if(e.target===m||e.target.closest(".x"))closeTermBox()});
  return m;
}
function showAuthor(name){
  const b=BIOS.find(x=>bioKeys(x).includes(name));if(!b)return;
  const keys=bioKeys(b),cnt=Q.filter(q=>keys.includes(q.a)).length;
  const m=openBox(`<div style="font-size:1.3rem;font-weight:700;color:#274a7c">${esc(b[0])}</div>
  <div class="small" style="margin:2px 0 8px">${esc(b[1])}</div>
  <p style="margin:6px 0">${esc(b[2])}</p>
  <p style="margin:6px 0"><span style="font-weight:700;color:#8a6410">প্রধান রচনা:</span> ${esc(b[3])}</p>
  <div class="row" style="margin-top:12px"><button class="btn alt" id="mfull">পূর্ণ পেজে দেখুন</button>${cnt?`<button class="btn alt" id="mq">এই লেখকের উক্তি (${cnt}টি)</button>`:""}</div>`);
  $("#mfull").onclick=()=>{closeTermBox();BIO_SEL=b[0];go("bios")};
  if($("#mq"))$("#mq").onclick=()=>{closeTermBox();PRE_AUTH=keys.find(k=>Q.some(q=>q.a===k))||b[0];go("browse")};
}
function showStory(title){
  const st=STORIES.find(x=>x.t===title);if(!st)return;
  openBox(`<div style="font-size:1.3rem;font-weight:700;color:#274a7c">${esc(st.t)}</div>
  <div class="small" style="margin:2px 0 8px">${esc(st.w)}</div>
  <p style="margin:6px 0"><span style="font-weight:700;color:#8a6410">চরিত্র:</span> ${esc(st.ch)}</p>
  <p style="margin:6px 0"><span style="font-weight:700;color:#8a6410">কাহিনি সংক্ষেপ:</span> ${esc(st.s)}</p>
  <p style="margin:6px 0"><span style="font-weight:700;color:#8a6410">মূল বিষয়/থিম:</span> ${esc(st.th)}</p>
  <div class="row" style="margin-top:12px"><button class="btn alt" id="mfull">গল্প সারাংশ পেজে দেখুন</button></div>`);
  $("#mfull").onclick=()=>{closeTermBox();STORY_AUTH=storyAuthor(st);STORY_OPEN=st.t;go("stories")};
}
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-au]");
  if(a){showAuthor(a.dataset.au);return}
  const st=e.target.closest("[data-st]");
  if(st)showStory(st.dataset.st);
});

/* ---------------- literary term popup ---------------- */
const EXTRA_TERMS={climax:{t:"Climax",b:"ক্রমোৎকর্ষ অলংকার",d:"A figure of speech in which ideas or words are arranged in ascending order of importance or intensity. (এটি আপনার PDF-এ নেই; সাধারণ সংজ্ঞা।)",ex:["Veni, Vidi, Vici (I came, I saw, I conquered)."],extra:true}};
function findTerm(n){
  const k=String(n).toLowerCase();
  return LT.find(t=>t.t.toLowerCase()===k)||EXTRA_TERMS[k]||null;
}
function closeTermBox(){const m=$("#tmodal");if(m)m.remove()}
function showTerm(n){
  const x=findTerm(n);if(!x)return;
  closeTermBox();
  const m=document.createElement("div");m.className="mbg";m.id="tmodal";
  m.innerHTML=`<div class="mbox bn"><button class="x" aria-label="close">×</button>
  <div style="font-size:1.3rem;font-weight:700;color:#274a7c;font-family:Georgia,serif">${esc(x.t)}</div>
  ${x.b?`<div style="margin:6px 0"><span class="who">${esc(x.b)}</span></div>`:""}
  <p style="margin:8px 0">${esc(x.d)}</p>
  ${x.ex&&x.ex.length?`<div class="small">উদাহরণ:</div><ul style="margin:4px 0 0;padding-left:20px;font-style:italic;font-family:Georgia,serif">${x.ex.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`:""}
  <div class="row" style="margin-top:14px"><button class="btn alt" id="tmall">সব Literature Terms দেখুন</button></div></div>`;
  document.body.appendChild(m);
  m.addEventListener("click",e=>{if(e.target===m||e.target.closest(".x"))closeTermBox()});
  $("#tmall").onclick=()=>{closeTermBox();LT_TAB="list";go("terms")};
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-term]");if(t)showTerm(t.dataset.term)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeTermBox()});

saveBM();
go("browse");
