const STORIES=[
{t:"King Lear",w:"William Shakespeare (ট্র্যাজেডি)",ch:"King Lear, Cordelia, Goneril, Regan, Gloucester, Edgar, Edmund, Fool, Kent",
s:"বৃদ্ধ রাজা লিয়ার তাঁর রাজ্য তিন কন্যার মধ্যে ভাগ করে দিতে চান। তিনি জানতে চান কে তাঁকে কতটা ভালোবাসে। গোনেরিল ও রিগান মিষ্টি কথায় বাবাকে তুষ্ট করে, কিন্তু কনিষ্ঠা কর্ডেলিয়া সরল সত্য বলে—'কর্তব্য অনুযায়ী ভালোবাসি, কমও নয়, বেশিও নয়'। ক্রুদ্ধ লিয়ার তাকে ত্যাজ্য করেন; ফ্রান্সের রাজা তাকে বিয়ে করেন। ক্ষমতা পেয়ে গোনেরিল ও রিগান বাবাকে অপমান ও অবহেলা করে। পাগলপ্রায় লিয়ার ঝড়ের রাতে প্রান্তরে ঘুরে বেড়ান। এদিকে গ্লুসেস্টারের জারজ পুত্র এডমন্ড ষড়যন্ত্র করে বৈধ পুত্র এডগারকে তাড়ায় এবং পিতাকে অন্ধ করায়। কর্ডেলিয়া সৈন্য নিয়ে ফিরে এলেও পরাজিত ও বন্দি হয় এবং তাকে ফাঁসি দেওয়া হয়। কর্ডেলিয়ার মৃতদেহ কোলে নিয়ে শোকে লিয়ারও মৃত্যু হয়।",
th:"অকৃতজ্ঞতা, তোষামোদ বনাম সত্য, অন্ধত্ব (শারীরিক ও মানসিক), পারিবারিক বিশ্বাসঘাতকতা, ক্ষমতা ও ভাগ্য।"},
{t:"Hamlet",w:"William Shakespeare (ট্র্যাজেডি)",ch:"Hamlet, Claudius, Gertrude, Ophelia, Polonius, Laertes, Horatio, Ghost",
s:"ডেনমার্কের রাজকুমার হ্যামলেটের পিতা রাজাকে তাঁর ভাই ক্লদিয়াস বিষ খাইয়ে হত্যা করে সিংহাসন ও রানি গারট্রুডকে দখল করে। পিতার প্রেতাত্মা হ্যামলেটকে প্রতিশোধ নিতে বলে। হ্যামলেট পাগলামির ভান করে সত্য যাচাইয়ে নাটকের মঞ্চায়ন করান, যাতে ক্লদিয়াসের অপরাধ ধরা পড়ে। ভুলবশত সে পোলোনিয়াসকে হত্যা করে; ফলে ওফেলিয়া উন্মাদ হয়ে নদীতে ডুবে মরে। ওফেলিয়ার ভাই লায়ার্টিস প্রতিশোধের জন্য ক্লদিয়াসের সঙ্গে চক্রান্ত করে তলোয়ার-যুদ্ধের আয়োজন করে—তলোয়ারে বিষ, পানীয়তেও বিষ। যুদ্ধে হ্যামলেট, লায়ার্টিস, গারট্রুড ও ক্লদিয়াস সবাই মারা যায়; হ্যামলেট মৃত্যুর আগে ক্লদিয়াসকে হত্যা করে।",
th:"প্রতিশোধ, সিদ্ধান্তহীনতা, মৃত্যু ও জীবনের অর্থ, কপটতা, উন্মাদনা।"},
{t:"Macbeth",w:"William Shakespeare (ট্র্যাজেডি)",ch:"Macbeth, Lady Macbeth, Duncan, Banquo, Macduff, Malcolm, Three Witches",
s:"স্কটল্যান্ডের সেনাপতি ম্যাকবেথ যুদ্ধজয় শেষে তিন ডাইনির ভবিষ্যদ্বাণী শোনে—সে রাজা হবে। স্ত্রী লেডি ম্যাকবেথের প্ররোচনায় সে অতিথি রাজা ডানকানকে হত্যা করে সিংহাসন দখল করে। ক্ষমতা ধরে রাখতে সে বাংকোকে হত্যা করায় এবং ম্যাকডাফের পরিবারকে নিশ্চিহ্ন করে। অপরাধবোধে লেডি ম্যাকবেথ ঘুমের মধ্যে হাঁটে ও হাত ধুতে চায়, শেষে আত্মহত্যা করে। ইংল্যান্ডের সাহায্যে ম্যালকম ও ম্যাকডাফ আক্রমণ করে; ডাইনির ভবিষ্যদ্বাণীর ফাঁক ('নারীজাত কেউ তোমাকে মারতে পারবে না') ধরে সিজারিয়ান-জাত ম্যাকডাফ ম্যাকবেথকে হত্যা করে।",
th:"উচ্চাকাঙ্ক্ষা, অপরাধবোধ, নিয়তি বনাম স্বাধীন ইচ্ছা, প্রকৃতিবিরুদ্ধ কাজের পরিণতি।"},
{t:"Romeo and Juliet",w:"William Shakespeare (ট্র্যাজেডি)",ch:"Romeo, Juliet, Friar Lawrence, Tybalt, Mercutio, Capulet, Montague, Nurse",
s:"ভেরোনার দুই শত্রু পরিবার—মন্টেগু ও ক্যাপুলেট। এক নাচের আসরে মন্টেগু-পুত্র রোমিও ও ক্যাপুলেট-কন্যা জুলিয়েট প্রেমে পড়ে এবং ফ্রায়ার লরেন্সের সাহায্যে গোপনে বিয়ে করে। টাইবল্টের হাতে মার্কুশিও নিহত হলে রোমিও টাইবল্টকে মেরে ফেলে ও নির্বাসিত হয়। জুলিয়েটের জোর করে বিয়ের ব্যবস্থা হলে ফ্রায়ার তাকে ঘুমের ওষুধ দেন যাতে সে মৃত মনে হয়। কিন্তু রোমিও সংবাদ পায়নি; জুলিয়েটকে মৃত ভেবে সে বিষ পান করে মরে। জেগে উঠে জুলিয়েট রোমিওকে মৃত দেখে ছুরিকাঘাতে আত্মহত্যা করে। দুই পরিবার সন্তানদের মৃত্যুতে শত্রুতা ভুলে মিলিত হয়।",
th:"প্রেম বনাম ঘৃণা, ভাগ্য, তরুণ বনাম প্রবীণ, আবেগের ধ্বংসাত্মক পরিণতি।"},
{t:"A Midsummer Night's Dream",w:"William Shakespeare (কমেডি)",ch:"Theseus, Hippolyta, Hermia, Helena, Lysander, Demetrius, Oberon, Titania, Puck, Bottom",
s:"এথেন্সে হার্মিয়া লিসান্ডারকে ভালোবাসে, কিন্তু তার পিতা তাকে ডেমেট্রিয়াসের সঙ্গে বিয়ে দিতে চান। প্রেমিক-প্রেমিকা বনে পালিয়ে যায়, তাদের পিছু নেয় ডেমেট্রিয়াস ও তাকে ভালোবাসা হেলেনা। বনে পরীরাজ ওবেরন ও রানি টিটানিয়ার ঝগড়া চলছে। ওবেরনের নির্দেশে পাক জাদুর ফুলের রস ভুল লোকের চোখে ঢেলে দেয়, ফলে প্রেমের জট পাকায়; টিটানিয়া গাধার মাথাওয়ালা কারিগর বটমের প্রেমে পড়ে। শেষে সব ঠিক হয়ে যায়, জুটিগুলো সঠিকভাবে মিলিত হয় এবং তিনটি বিয়ে একসঙ্গে অনুষ্ঠিত হয়।",
th:"প্রেমের অযৌক্তিকতা, স্বপ্ন ও বাস্তবতা, জাদু ও রূপান্তর।"},
{t:"Julius Caesar",w:"William Shakespeare (ট্র্যাজেডি)",ch:"Julius Caesar, Brutus, Cassius, Mark Antony, Calpurnia, Octavius",
s:"রোমে জুলিয়াস সিজারের ক্ষমতা বাড়ায় ক্যাসিয়াস ও অন্যান্যরা শঙ্কিত হয়। তারা সম্মানিত ব্রুটাসকে বোঝায় যে সিজার স্বৈরাচারী হবে; ব্রুটাস প্রজাতন্ত্র রক্ষার জন্য ষড়যন্ত্রে যোগ দেয়। 'আইডস অব মার্চ'-এ সিজারকে সিনেটে ছুরিকাঘাতে হত্যা করা হয়। মার্ক অ্যান্টনি অন্ত্যেষ্টিক্রিয়ার ভাষণে জনতাকে ক্ষেপিয়ে তোলে। গৃহযুদ্ধে ফিলিপ্পির যুদ্ধে ব্রুটাস ও ক্যাসিয়াস পরাজিত হয়ে আত্মহত্যা করে; অ্যান্টনি ও অক্টেভিয়াস জয়ী হয়।",
th:"ক্ষমতা ও উচ্চাকাঙ্ক্ষা, নিয়তি, বন্ধুত্ব বনাম দেশপ্রেম, জনমত।"},
{t:"Twelfth Night",w:"William Shakespeare (কমেডি)",ch:"Viola (Cesario), Sebastian, Orsino, Olivia, Malvolio, Feste, Sir Toby, Maria",
s:"জাহাজডুবির পর ভায়োলা ইলিরিয়ায় পৌঁছে পুরুষবেশে 'সিজারিও' নাম নিয়ে ডিউক অর্সিনোর অনুচর হয়। অর্সিনো কাউন্টেস অলিভিয়াকে ভালোবাসে এবং সিজারিওকে প্রেমদূত পাঠায়; অলিভিয়া সিজারিওর প্রেমে পড়ে, আর ভায়োলা গোপনে অর্সিনোকে ভালোবাসে। ম্যালভোলিওকে বোকা বানাতে ভুয়া চিঠি লেখা হয়, সে উদ্ভট আচরণ করে বন্দি হয়। ভায়োলার যমজ ভাই সেবাস্টিয়ানের আগমনে ভুল-বোঝাবুঝি ঘোচে—অলিভিয়া সেবাস্টিয়ানকে ও অর্সিনো ভায়োলাকে বিয়ে করে।",
th:"ছদ্মবেশ ও পরিচয়, প্রেমের বিভ্রান্তি, আত্মপ্রবঞ্চনা।"},
{t:"As You Like It",w:"William Shakespeare (কমেডি)",ch:"Rosalind, Orlando, Celia, Duke Senior, Duke Frederick, Jaques, Touchstone",
s:"দুষ্ট ডিউক ফ্রেডেরিক বড় ভাই ডিউক সিনিয়রকে নির্বাসনে পাঠিয়েছে। কুস্তিতে জয়ী অর্ল্যান্ডো ও রোজালিন্ড প্রেমে পড়ে। রোজালিন্ডকেও নির্বাসিত করা হলে সে ছেলে 'গ্যানিমিড' সেজে বোন সিলিয়াকে নিয়ে আর্ডেনের বনে যায়। অর্ল্যান্ডোও ভাইয়ের অত্যাচারে সেখানে আশ্রয় নেয়। ছদ্মবেশী রোজালিন্ড অর্ল্যান্ডোকে প্রেমের শিক্ষা দেয়। শেষে পরিচয় প্রকাশ পায়, একসঙ্গে একাধিক বিয়ে হয় এবং ফ্রেডেরিক মন বদলে রাজ্য ফিরিয়ে দেয়।",
th:"নগর বনাম বন (প্রকৃতি), ছদ্মবেশ, প্রেম ও পরিবার। 'All the world's a stage' (Jaques) এখানকার বিখ্যাত উক্তি।"},
{t:"Othello",w:"William Shakespeare (ট্র্যাজেডি)",ch:"Othello, Desdemona, Iago, Cassio, Emilia, Brabantio, Roderigo",
s:"ভেনিসের মুর সেনাপতি ওথেলো গোপনে সেনেটর ব্রাবান্টিওর কন্যা ডেসডিমোনাকে বিয়ে করে। ওথেলো কাসিওকে পদোন্নতি দিলে ঈর্ষান্বিত ইয়াগো প্রতিশোধের ছক কষে। সে ডেসডিমোনার রুমাল ব্যবহার করে ওথেলোর মনে সন্দেহ ঢোকায় যে ডেসডিমোনা কাসিওর সঙ্গে অসতী। ঈর্ষায় অন্ধ ওথেলো ডেসডিমোনাকে শ্বাসরোধে হত্যা করে। পরে ইয়াগোর স্ত্রী এমিলিয়া সত্য ফাঁস করে; ওথেলো আত্মহত্যা করে এবং ইয়াগো ধরা পড়ে।",
th:"ঈর্ষা, বর্ণবাদ, প্রতারণা, বিশ্বাস ও সন্দেহ।"},
{t:"The Tempest",w:"William Shakespeare (রোমান্স/কমেডি)",ch:"Prospero, Miranda, Ferdinand, Ariel, Caliban, Antonio, Alonso, Trinculo",
s:"মিলানের বৈধ ডিউক প্রস্পেরোকে ভাই অ্যান্তোনিও ক্ষমতাচ্যুত করে কন্যা মিরান্ডাসহ নৌকায় ভাসিয়ে দেয়। তাঁরা এক দ্বীপে পৌঁছান, যেখানে প্রস্পেরো জাদুবিদ্যা আয়ত্ত করে বায়বীয় আত্মা এরিয়েল ও কদাকার ক্যালিবানকে বশ করেন। বহু বছর পর শত্রুদের জাহাজ দ্বীপের কাছে এলে তিনি ঝড় তুলে জাহাজ ডোবান। রাজপুত্র ফার্দিনান্দ ও মিরান্ডা প্রেমে পড়ে। ক্যালিবান ও মাতালদের চক্রান্ত ব্যর্থ হয়। শেষে প্রস্পেরো শত্রুদের ক্ষমা করেন, জাদুর দণ্ড ভেঙে ফেলেন এবং মিলানে ফিরে যান।",
th:"ক্ষমা বনাম প্রতিশোধ, ক্ষমতা ও উপনিবেশ, স্বাধীনতা, জাদু ও শিল্প।"},
{t:"The Merchant of Venice",w:"William Shakespeare (কমেডি)",ch:"Antonio, Bassanio, Portia, Shylock, Jessica, Lorenzo, Launcelot",
s:"বাসানিও ধনী পোর্শিয়াকে বিয়ে করতে বন্ধু বণিক অ্যান্তোনিওর কাছে টাকা চায়। অ্যান্তোনিও ইহুদি সুদখোর শাইলকের কাছ থেকে তিন হাজার ডুকাট ধার নেয়, শর্ত—শোধ না করলে তার দেহ থেকে এক পাউন্ড মাংস কাটা হবে। জাহাজ ডুবে গেলে অ্যান্তোনিও ঋণ শোধ করতে পারে না। পোর্শিয়া উকিল সেজে আদালতে বলে—মাংস কাটা যাবে, কিন্তু এক ফোঁটা রক্তও ঝরানো যাবে না। শাইলক পরাজিত হয়, সম্পদ হারায় ও ধর্মান্তরিত হতে বাধ্য হয়। প্রেমিকদের আংটির কৌতুকের পর সবাই সুখে মিলিত হয়।",
th:"দয়া বনাম ন্যায়বিচার, বন্ধুত্ব, প্রেম ও অর্থ, ধর্মীয় বিদ্বেষ। ('All that glitters is not gold')"},
{t:"Measure for Measure",w:"William Shakespeare (সমস্যা-নাটক)",ch:"Duke Vincentio, Angelo, Isabella, Claudio, Lucio, Escalus, Mariana",
s:"ভিয়েনার ডিউক ছদ্মবেশে সন্ন্যাসী সেজে শহর দেখার জন্য ক্ষমতা কঠোর অ্যাঞ্জেলোর হাতে দেন। অ্যাঞ্জেলো বিবাহ-পূর্ব সম্পর্কের অপরাধে ক্লদিওর মৃত্যুদণ্ড দেয়। ক্লদিওর বোন ইসাবেলা ক্ষমা চাইতে এলে অ্যাঞ্জেলো প্রস্তাব দেয়—ইসাবেলা তার সঙ্গে রাত কাটালে ক্লদিও বাঁচবে। ইসাবেলা রাজি হয় না। ডিউক ছদ্মবেশে কৌশল করে অ্যাঞ্জেলোর পূর্ব বাগদত্তা মারিয়ানাকে ইসাবেলার জায়গায় পাঠায়। শেষে ডিউক নিজ পরিচয়ে ফিরে অ্যাঞ্জেলোর অপরাধ ফাঁস করেন, তাকে মারিয়ানার সঙ্গে বিয়ে দেন এবং ক্লদিও মুক্তি পায়।",
th:"ন্যায়বিচার ও দয়া, ক্ষমতার অপব্যবহার, নৈতিকতা ও কপটতা।"},
{t:"Dr. Faustus",w:"Christopher Marlowe (ট্র্যাজেডি)",ch:"Faustus, Mephistophilis, Good Angel, Bad Angel, Wagner, Lucifer",
s:"জার্মানির পণ্ডিত ডক্টর ফাউস্টাস সব বিদ্যায় তৃপ্ত না হয়ে জাদুবিদ্যার প্রতি আকৃষ্ট হয়। সে শয়তানের দূত মেফিস্টোফিলিসের সঙ্গে চুক্তি করে—চব্বিশ বছর অসীম ক্ষমতা ও ভোগ পাবে, বিনিময়ে তার আত্মা শয়তানের হবে। সে অলৌকিক ক্ষমতায় নানা ভেলকি দেখায়, হেলেনের সঙ্গে মিলিত হয়। ভালো ও মন্দ দেবদূত তাকে বারবার পরামর্শ দেয়, কিন্তু সে অনুতাপ করতে পারে না। চুক্তির শেষ রাতে ভয়ংকর আতঙ্কে সে প্রার্থনা করে, কিন্তু দেরি হয়ে যায়; শয়তানরা তাকে নরকে টেনে নিয়ে যায়।",
th:"জ্ঞানতৃষ্ণা ও অহংকার, পাপ ও অনুতাপ, ভালো বনাম মন্দ।"},
{t:"Antony and Cleopatra",w:"William Shakespeare (ট্র্যাজেডি)",ch:"Antony, Cleopatra, Octavius Caesar, Enobarbus, Octavia",
s:"রোমান ত্রিস্তম্ভের একজন মার্ক অ্যান্টনি মিশরের রানি ক্লিওপেট্রার প্রেমে মগ্ন থাকে। রাজনৈতিক প্রয়োজনে সে অক্টেভিয়াস সিজারের বোন অক্টেভিয়াকে বিয়ে করে, কিন্তু পরে ক্লিওপেট্রার কাছে ফিরে যায়। অ্যাকটিয়ামের নৌযুদ্ধে ক্লিওপেট্রা পালালে অ্যান্টনিও তার পিছু নেয় এবং পরাজিত হয়। ক্লিওপেট্রার মৃত্যুর ভুল সংবাদে অ্যান্টনি নিজেকে ছুরিকাঘাত করে ও তার কোলে মারা যায়। অক্টেভিয়াসের হাতে বন্দি হওয়ার অপমান এড়াতে ক্লিওপেট্রা বিষধর সাপের কামড়ে আত্মহত্যা করে।",
th:"প্রেম বনাম কর্তব্য, রোম বনাম মিশর, ক্ষমতা ও আত্মমর্যাদা।"},
{t:"The Jew of Malta",w:"Christopher Marlowe (ট্র্যাজেডি)",ch:"Barabas, Abigail, Ferneze, Ithamore, Don Lodowick, Don Mathias",
s:"ধনী ইহুদি বণিক বারাবাসের সব সম্পত্তি মাল্টার গভর্নর ফার্নিজ তুর্কিদের কর আদায়ের অজুহাতে কেড়ে নেয়। ক্ষুব্ধ বারাবাস প্রতিশোধ নিতে কন্যা অ্যাবিগেলকে ব্যবহার করে ফার্নিজের পুত্র ডন ম্যাথিয়াস ও তার বন্ধু লোডোউইককে ষড়যন্ত্রে হত্যা করায়। অ্যাবিগেল দুঃখে খ্রিস্টান সন্ন্যাসিনী হলে বারাবাস তাকেও বিষ খাইয়ে মারে। একের পর এক খুন-ষড়যন্ত্রের পর সে তুর্কিদের সঙ্গে হাত মেলায়, কিন্তু শেষে ফার্নিজের জন্য পাতা ফুটন্ত তেলের কড়াইয়ে নিজেই পড়ে মারা যায়।",
th:"প্রতিশোধ, লোভ, ধর্মীয় বিদ্বেষ, ম্যাকিয়াভেলীয় কূটনীতি।"},
{t:"Arms and the Man",w:"G. B. Shaw (কমেডি)",ch:"Raina Petkoff, Captain Bluntschli, Sergius, Catherine, Major Petkoff, Louka, Nicola",
s:"বুলগেরিয়া-সার্বিয়া যুদ্ধের সময় তরুণী রাইনা তার বাগদত্তা সেনা-নায়ক সার্জিয়াসের বীরত্বে মুগ্ধ। এক রাতে পলাতক সুইস ভাড়াটে সৈনিক ক্যাপ্টেন ব্লান্টশলি তার ঘরে ঢুকে আশ্রয় চায়; সে গুলির বদলে চকলেট বহন করে। রাইনা আদর্শ ভেঙে গিয়েও তাকে লুকিয়ে বাঁচায়। যুদ্ধ শেষে ব্লান্টশলি ফিরে এলে সার্জিয়াসের ভণ্ড বীরত্ব ধরা পড়ে। সার্জিয়াস দাসী লুকাকে বিয়ে করে, আর বাস্তববাদী ব্লান্টশলি রাইনার ভালোবাসা জেতে।",
th:"যুদ্ধের মিথ্যা রোম্যান্টিকতার সমালোচনা, আদর্শবাদ বনাম বাস্তববাদ, শ্রেণিবৈষম্য।"},
{t:"Saint Joan",w:"G. B. Shaw (ঐতিহাসিক নাটক)",ch:"Joan, Charles (Dauphin), Bishop Cauchon, Earl of Warwick, Dunois, Inquisitor",
s:"ফ্রান্সের কৃষককন্যা জোয়ান ঐশী কণ্ঠ শুনে শতবর্ষ-যুদ্ধে ফরাসি বাহিনীর নেতৃত্ব নেয়। সে অর্লিয়াঁ জয় করে এবং দোদুল্যমান ডফিন চার্লসকে রাজা হিসেবে অভিষিক্ত করায়। কিন্তু ইংরেজ অভিজাতরা ও চার্চের নেতারা তার স্বাধীন চিন্তা ও জনপ্রিয়তায় ভীত হয়। বিচারে তাকে ধর্মদ্রোহী ঘোষণা করে পুড়িয়ে মারা হয়। কয়েক শতাব্দী পরে তাকে সন্ত ঘোষণা করা হয়। নাটকে শেষে এক স্বপ্নদৃশ্যে (epilogue) তার প্রেতাত্মা আসে।",
th:"ব্যক্তিস্বাধীনতা বনাম প্রতিষ্ঠান, ধর্মীয় গোঁড়ামি, জাতীয়তাবাদ, প্রতিভার ট্র্যাজেডি।"},
{t:"Great Expectations",w:"Charles Dickens (উপন্যাস)",ch:"Pip, Joe Gargery, Miss Havisham, Estella, Magwitch, Jaggers, Herbert Pocket",
s:"এতিম পিপ কামার জো গার্গারির কাছে বড় হয়। শৈশবে সে পলাতক কয়েদি ম্যাগউইচকে সাহায্য করে। ধনী মিস হ্যাভিশামের বাড়িতে সে অহংকারী এস্টেলার প্রেমে পড়ে। এক অজ্ঞাত হিতৈষীর অর্থে পিপ লন্ডনে 'ভদ্রলোক' হয়ে ওঠে এবং জো-কে অবজ্ঞা করে। পরে জানা যায়, হিতৈষী আসলে ম্যাগউইচ। ম্যাগউইচ ধরা পড়ে মারা যায়, পিপ সম্পদ হারায়, অসুস্থ হলে জো তাকে সেবা করে। অনুতপ্ত পিপ জো-র কাছে ফিরে সৎভাবে জীবন শুরু করে; বহু বছর পর এস্টেলার সঙ্গে তার দেখা হয়।",
th:"সামাজিক শ্রেণি ও আভিজাত্যের মোহ, কৃতজ্ঞতা, আত্ম-উপলব্ধি, প্রেম ও অপরাধবোধ।"},
{t:"A Tale of Two Cities",w:"Charles Dickens (ঐতিহাসিক উপন্যাস)",ch:"Dr. Manette, Lucie, Charles Darnay, Sydney Carton, Madame Defarge",
s:"ডা. ম্যানেট অন্যায়ভাবে আঠারো বছর বাস্তিলে বন্দি ছিলেন; মুক্তি পেয়ে তিনি কন্যা লুসির কাছে লন্ডনে থাকেন। ফরাসি অভিজাত চার্লস ডার্নে লুসিকে বিয়ে করে। ফরাসি বিপ্লবের সময় ডার্নে প্যারিসে গ্রেপ্তার হয়ে মৃত্যুদণ্ড পায়। ডার্নের মতো দেখতে মদ্যপ আইনজীবী সিডনি কার্টন, যে লুসিকে নীরবে ভালোবাসত, কারাগারে ডার্নের জায়গা নিয়ে নিজে গিলোটিনে প্রাণ দেয় এবং ডার্নেকে মুক্ত করে।",
th:"আত্মত্যাগ, পুনরুজ্জীবন, বিপ্লব ও প্রতিশোধ, লন্ডন ও প্যারিসের তুলনা।"},
{t:"Hard Times",w:"Charles Dickens (উপন্যাস)",ch:"Thomas Gradgrind, Louisa, Tom, Josiah Bounderby, Stephen Blackpool, Sissy Jupe",
s:"কোকটাউনের স্কুলশিক্ষক ও ব্যবসায়ী গ্র্যাডগ্রাইন কেবল 'তথ্য' ও যুক্তিতে বিশ্বাস করেন এবং সন্তান লুইসা ও টমকে তেমনভাবেই বড় করেন। লুইসাকে বয়স্ক শিল্পপতি বাউন্ডারবির সঙ্গে বিয়ে দেওয়া হয়, যে সুখী হয় না। টম ব্যাংক চুরি করে দোষ চাপায় শ্রমিক স্টিফেন ব্ল্যাকপুলের ওপর। সার্কাসকন্যা সিসি জুপ তার ভালোবাসা ও কল্পনার মাধ্যমে পরিবারটিকে মানবিকতার পথ দেখায়। শেষে গ্র্যাডগ্রাইন নিজের শিক্ষার ভুল বুঝতে পারেন।",
th:"উপযোগবাদের সমালোচনা, শিল্পবিপ্লবের অমানবিকতা, কল্পনা বনাম তথ্য।"},
{t:"Jane Eyre",w:"Charlotte Bronte (উপন্যাস)",ch:"Jane Eyre, Mr. Rochester, Bertha Mason, St. John Rivers, Mrs. Reed, Helen Burns",
s:"এতিম জেন মামি মিসেস রিডের বাড়িতে নির্যাতিত হয়ে লোউড স্কুলে পড়াশোনা করে। পরে সে থর্নফিল্ড হলে গভর্নেস হয় এবং মালিক রচেস্টারের প্রেমে পড়ে। বিয়ের দিন জানা যায় রচেস্টারের উন্মাদ স্ত্রী বার্থা মেসন বাড়ির চিলেকোঠায় বন্দি আছে। জেন চলে যায়, সেন্ট জন রিভার্স ও তার বোনদের আশ্রয়ে থাকে। পরে আগুনে থর্নফিল্ড পুড়ে যায়, বার্থা মারা যায়, রচেস্টার অন্ধ ও পঙ্গু হন। জেন ফিরে এসে তাকে বিয়ে করে।",
th:"নারীর স্বাধীনতা ও আত্মমর্যাদা, শ্রেণিবৈষম্য, প্রেম ও নৈতিকতা।"},
{t:"Silas Marner",w:"George Eliot (উপন্যাস)",ch:"Silas Marner, Eppie, Godfrey Cass, Dunstan Cass, Nancy Lammeter",
s:"তাঁতি সাইলাস মার্নার বন্ধুর মিথ্যা অভিযোগে সমাজ থেকে বহিষ্কৃত হয়ে র‍্যাভেলোতে নির্জনে বাস করে এবং সোনা জমিয়ে সুখ খোঁজে। ডানস্টান ক্যাস তার সোনা চুরি করে। এক শীতের রাতে এক মৃত নারীর অনাথ শিশু এপি তার ঘরে চলে আসে; সাইলাস তাকে নিজের সন্তানের মতো লালন করে, ফলে তার জীবনে ভালোবাসা ও মানবিকতা ফিরে আসে। শিশুটির আসল পিতা গডফ্রে ক্যাস পরে তাকে নিতে চাইলে এপি সাইলাসের কাছেই থাকতে চায়।",
th:"সোনার চেয়ে ভালোবাসার মূল্য, সমাজ থেকে বিচ্ছিন্নতা ও পুনর্মিলন, নৈতিক দায়িত্ব।"},
{t:"Vanity Fair",w:"W. M. Thackeray (উপন্যাস)",ch:"Becky Sharp, Amelia Sedley, Rawdon Crawley, George Osborne, Dobbin",
s:"দরিদ্র ও উচ্চাকাঙ্ক্ষী বেকি শার্প এবং সরল ধনীকন্যা অ্যামেলিয়া সেডলি বান্ধবী। বেকি চালাকি করে অভিজাত সমাজে ঢোকে ও রডন ক্রলিকে বিয়ে করে। অ্যামেলিয়া তার স্বামী জর্জ ওসবর্নের জন্য আত্মনিবেদিত, কিন্তু জর্জ ওয়াটারলু যুদ্ধে নিহত হয়। বিশ্বস্ত ডবিন বছরের পর বছর নীরবে অ্যামেলিয়াকে ভালোবাসে। বেকি শেষে কলঙ্কে পতিত হয়, আর বহু বছর পর অ্যামেলিয়া ও ডবিনের বিয়ে হয়।",
th:"সমাজের ভণ্ডামি, অর্থ ও মর্যাদার মোহ, সামাজিক উচ্চাকাঙ্ক্ষার ব্যঙ্গ।"},
{t:"Paradise Lost",w:"John Milton (মহাকাব্য)",ch:"Satan, God, Adam, Eve, Son (Christ), Raphael, Michael",
s:"দেবদূত শয়তান ঈশ্বরের বিরুদ্ধে বিদ্রোহ করে পরাজিত হয় এবং নরকে নিক্ষিপ্ত হয়। সে বলে—'স্বর্গে দাসত্ব করার চেয়ে নরকে রাজত্ব করা শ্রেয়'। সে মানবজাতিকে ধ্বংস করতে সাপের রূপে এডেন উদ্যানে ঢুকে হাওয়াকে নিষিদ্ধ ফল খেতে প্ররোচিত করে। হাওয়া ও পরে আদম ফল খায়। ফলে তারা স্বর্গোদ্যান থেকে বহিষ্কৃত হয়, কিন্তু ঈশ্বরের প্রতিশ্রুত মুক্তির আশা নিয়ে পৃথিবীতে পথচলা শুরু করে।",
th:"মানুষের পতন, স্বাধীন ইচ্ছা ও আনুগত্য, বিদ্রোহ, ঈশ্বরের ন্যায়বিচার।"},
{t:"I Wandered Lonely as a Cloud (Daffodils)",w:"William Wordsworth (কবিতা)",ch:"কবি, ড্যাফোডিল ফুল",
s:"কবি মেঘের মতো একা ঘুরতে ঘুরতে হ্রদের ধারে হঠাৎ হাজার হাজার সোনালি ড্যাফোডিল দেখেন, যারা বাতাসে নাচছে। ফুলের আনন্দ হ্রদের ঢেউয়ের চেয়েও উচ্ছল। তিনি সেই দৃশ্যের মূল্য তখন বোঝেননি। পরে একাকী বা বিষণ্ণ মুহূর্তে সেই স্মৃতি মনে ফিরে এলে তাঁর হৃদয় আনন্দে ভরে ওঠে এবং ফুলের সঙ্গে নাচতে থাকে।",
th:"প্রকৃতির সৌন্দর্য ও স্মৃতির আনন্দ, 'emotion recollected in tranquillity'।"},
{t:"The Solitary Reaper",w:"William Wordsworth (কবিতা)",ch:"কবি, পার্বত্য তরুণী (Highland Lass)",
s:"কবি পাহাড়ি উপত্যকার মাঠে একাকী ফসল কাটতে কাটতে গান গাওয়া এক তরুণীকে দেখেন। গানের সুর এতই করুণ ও মধুর যে তা নাইটিঙ্গেল বা কোকিলের গানকেও ছাড়িয়ে যায়। কবি গানের ভাষা বুঝতে পারেন না; ভাবেন গানটি হয়তো অতীতের কোনো দুঃখের কাহিনি বা চিরন্তন বেদনার। তরুণী গান থামালেও সেই সুর কবির হৃদয়ে দীর্ঘদিন বেঁচে থাকে।",
th:"সংগীতের শক্তি, স্মৃতি, নির্জনতা ও প্রকৃতির সঙ্গে মানুষের সংযোগ।"},
{t:"Ode on a Grecian Urn",w:"John Keats (কবিতা)",ch:"কবি, গ্রিক কলস (Urn)",
s:"কবি এক প্রাচীন গ্রিক কলসের গায়ে আঁকা ছবি দেখে সম্বোধন করেন—এক তরুণ বাঁশি বাজাচ্ছে, প্রেমিক-প্রেমিকা চুম্বনের কাছাকাছি, উৎসবে যাওয়া মানুষ ও বলির বাছুর। চিত্রের এই মুহূর্তগুলো চিরকাল স্থির—প্রেমিক কখনো চুম্বন পাবে না, কিন্তু প্রেমও কখনো ম্লান হবে না। শেষে কলসটি মানুষকে বলে—'Beauty is truth, truth beauty'।",
th:"শিল্পের অমরত্ব বনাম জীবনের নশ্বরতা, সৌন্দর্য ও সত্য।"},
{t:"Ode to a Nightingale",w:"John Keats (কবিতা)",ch:"কবি, নাইটিঙ্গেল পাখি",
s:"বিষণ্ণ ও অবসন্ন কবি নাইটিঙ্গেলের গান শুনে আনন্দে আত্মহারা হন এবং মদ বা কল্পনার ডানায় ভর করে পাখির জগতে পালিয়ে যেতে চান, যেখানে জগতের জ্বালা-যন্ত্রণা নেই। তিনি মৃত্যুকেও সুন্দর মনে করেন। কিন্তু পাখির অমর সংগীত ও মানুষের নশ্বরতার পার্থক্য ভেবে 'forlorn' শব্দে তিনি বাস্তবে ফিরে আসেন। শেষে তিনি জানেন না—এ কি স্বপ্ন, নাকি জাগরণ।",
th:"বাস্তবতা থেকে পলায়ন, মৃত্যুচেতনা, শিল্প ও প্রকৃতির অমরত্ব।"},
{t:"The Rime of the Ancient Mariner",w:"S. T. Coleridge (কাহিনি-কবিতা)",ch:"Ancient Mariner, Wedding Guest, Albatross, Hermit, Polar Spirit",
s:"এক বৃদ্ধ নাবিক বিয়েবাড়ির এক অতিথিকে থামিয়ে তার কাহিনি শোনায়। যাত্রাপথে জাহাজ দক্ষিণ মেরুর বরফে আটকে গেলে এক অ্যালবাট্রস পাখি আসে এবং বাতাস ফেরে। নাবিক হঠাৎ পাখিটিকে তির দিয়ে মারে। অভিশাপে জাহাজ সমুদ্রে স্থির হয়ে যায়, 'Water, water, everywhere'। সঙ্গীরা পিপাসায় মরে, নাবিক একা বেঁচে থাকে। জলসাপের সৌন্দর্য দেখে ভালোবাসায় সে প্রার্থনা করলে অভিশাপ মুক্ত হয়। সে প্রায়শ্চিত্তস্বরূপ আজীবন কাহিনি শোনায়।",
th:"অপরাধ, শাস্তি ও প্রায়শ্চিত্ত, প্রকৃতিকে ভালোবাসা, 'He prayeth best who loveth best'।"},
{t:"Ozymandias",w:"P. B. Shelley (সনেট)",ch:"পর্যটক, ওজিমান্ডিয়াস (মিশরের ফারাও)",
s:"এক পর্যটক কবিকে জানান, মরুভূমিতে ধ্বংসপ্রাপ্ত এক বিশাল মূর্তির দুটি পাথুরে পা দাঁড়িয়ে আছে, পাশে মুখমণ্ডল ভাঙা অবস্থায় বালুতে পড়ে। মুখের ভঙ্গিতে অহংকার ও নিষ্ঠুরতা। বেদিতে লেখা—'My name is Ozymandias, King of Kings; look on my works, ye Mighty, and despair!' অথচ চারপাশে কিছুই নেই, কেবল অসীম বালুকাবেলা।",
th:"ক্ষমতার ক্ষণস্থায়িত্ব, সময়ের শক্তি, শিল্প বনাম শাসক।"},
{t:"Ode to the West Wind",w:"P. B. Shelley (কবিতা)",ch:"কবি, পশ্চিমা বাতাস",
s:"কবি শরতের পশ্চিমা বাতাসকে সম্বোধন করেন, যে মৃত পাতাদের উড়িয়ে নেয় এবং বসন্তের বীজকে মাটিতে রক্ষা করে—অর্থাৎ ধ্বংসকারী ও রক্ষাকারী দুই-ই। বাতাস মেঘ, সমুদ্র ও বন সবকিছু আলোড়িত করে। কবি প্রার্থনা করেন বাতাস যেন তাঁকে ঢেউ, পাতা বা মেঘের মতো তুলে নেয় এবং তাঁর চিন্তাগুলো বিশ্বজুড়ে ছড়িয়ে দেয়। শেষে আশা—'If Winter comes, can Spring be far behind?'",
th:"পরিবর্তন ও পুনর্জন্ম, কবির বিপ্লবী ভূমিকা, হতাশার পর আশা।"},
{t:"Ulysses",w:"Lord Alfred Tennyson (নাটকীয় স্বগতোক্তি)",ch:"Ulysses, Telemachus, মাঝি-সঙ্গীরা",
s:"ট্রয়-যুদ্ধের নায়ক বৃদ্ধ ইউলিসিস ইথাকায় শান্ত রাজকীয় জীবনে অতৃপ্ত। তিনি জ্ঞান ও অভিজ্ঞতার সন্ধানে আবার সমুদ্রযাত্রায় যেতে চান। রাজ্যের দায়িত্ব দেন ধৈর্যশীল পুত্র টেলিমাকাসকে এবং পুরোনো সঙ্গীদের ডাক দেন—বয়সে দুর্বল হলেও তাদের ইচ্ছাশক্তি অটুট: 'to strive, to seek, to find, and not to yield'।",
th:"অদম্য কৌতূহল ও সংগ্রাম, অভিজ্ঞতার তৃষ্ণা, বার্ধক্য ও মৃত্যুর সামনে সাহস।"},
{t:"Elegy Written in a Country Churchyard",w:"Thomas Gray (এলিজি)",ch:"কবি, গ্রামবাসী, একজন তরুণ কবি (Epitaph)",
s:"সন্ধ্যায় কবি গ্রামের গির্জাপ্রাঙ্গণে দাঁড়িয়ে সাধারণ কৃষকদের কবর দেখে ভাবেন—এই মানুষদের মধ্যেও হয়তো মিল্টন বা ক্রমওয়েলের মতো প্রতিভা ছিল, কিন্তু দারিদ্র্য ও সুযোগের অভাবে তা বিকশিত হয়নি। ধনী-গরিব মৃত্যুতে সমান: 'The paths of glory lead but to the grave'। শেষে কবি নিজের সম্ভাব্য মৃত্যু ও এপিটাফ কল্পনা করেন।",
th:"মৃত্যুর সমতা, সাধারণ মানুষের প্রতি শ্রদ্ধা, অজানা প্রতিভার করুণ পরিণতি।"},
{t:"Don Juan",w:"Lord Byron (ব্যঙ্গাত্মক মহাকাব্য)",ch:"Don Juan, Donna Julia, Haidee, Gulbeyaz, Catherine the Great",
s:"স্পেনের যুবক ডন জুয়ান মায়ের কঠোর শাসনে বড় হয়। বিবাহিত ডোনা জুলিয়ার সঙ্গে সম্পর্কের কেলেঙ্কারির পর তাকে বিদেশে পাঠানো হয়। জাহাজডুবির পর সে এক গ্রিক দ্বীপে হাইদির সেবায় বাঁচে ও প্রেমে পড়ে; হাইদির পিতা এসে তাদের আলাদা করেন। এরপর সে তুর্কি সুলতানের হারেম, রুশ সম্রাজ্ঞী ক্যাথরিনের দরবার ও ইংল্যান্ডে যায়। ব্যঙ্গ ও কৌতুকের মধ্য দিয়ে কবি সমাজের ভণ্ডামি তুলে ধরেন।",
th:"সমাজের ভণ্ডামি, প্রেম ও কামনার ব্যঙ্গ, যুদ্ধ ও রাজনীতির সমালোচনা।"},
{t:"The Second Coming",w:"W. B. Yeats (কবিতা)",ch:"Falcon, Falconer, Sphinx-like beast",
s:"প্রথম বিশ্বযুদ্ধ ও রুশ বিপ্লবের পর বিশৃঙ্খল পৃথিবীর চিত্র—বাজপাখি ঘুরতে ঘুরতে বাজপাখি-পালকের ডাক শুনতে পায় না, 'Things fall apart; the centre cannot hold'। ভালো মানুষ বিশ্বাস হারায়, মন্দ মানুষ তীব্র উন্মত্ততায় ভরা। কবি দেখেন মরুভূমি থেকে সিংহ-দেহ ও মানুষ-মাথার এক ভয়ংকর জন্তু বেথলেহেমের দিকে এগিয়ে আসছে—নতুন, অশুভ যুগের প্রতীক।",
th:"সভ্যতার পতন, নৈরাজ্য, ইতিহাসের চক্র।"},
{t:"Sohrab and Rustum",w:"Matthew Arnold (আখ্যানকাব্য)",ch:"Sohrab, Rustum, Peran-Wisa, Tahmineh",
s:"পারস্যের বীর রুস্তমের ছেলে সোহরাব তুরানি সেনার সঙ্গে থেকে পিতাকে খুঁজছে। সে চায় বিখ্যাত পিতার পরিচয় পেতে। পিতা-পুত্র একে অপরকে চেনে না। দুই বাহিনীর বদলে দুই বীর একক যুদ্ধে নামে। রুস্তম নিজের নাম গোপন করে এবং শেষে সোহরাবকে আঘাত করে। মৃত্যুপথে সোহরাব পিতার নাম বললে রুস্তম সত্য জানতে পারে। অনুতপ্ত রুস্তম পুত্রের পাশে শোকে ভেঙে পড়ে।",
th:"পিতা-পুত্র সম্পর্ক, ভাগ্যের নিষ্ঠুরতা, অজ্ঞতা ও অনুশোচনা।"},
{t:"Hearts and Hands",w:"O. Henry (ছোটগল্প)",ch:"Miss Fairchild, Mr. Easton, Marshal, দুই যাত্রী",
s:"ট্রেনে হঠাৎ দুই পুরোনো পরিচিত—মিস ফেয়ারচাইল্ড ও মিস্টার ইস্টন—দেখা হয়। ইস্টনের ডান হাত বাঁ পাশে বসা এক লোকের সঙ্গে হাতকড়ায় বাঁধা, যা সে কোট দিয়ে ঢেকে রেখেছে। ইস্টন বলে সে ওয়াশিংটনে ভালো চাকরি করছে, মিস ফেয়ারচাইল্ড খুশি হয়। অন্য দুই যাত্রী ব্যাপারটা দেখে ফেললে একজন বলে—ডান পাশের লোকটি অপরাধী; কিন্তু অন্যজন বলে, 'না, বাঁ পাশের লোকটি মার্শাল; সে অপরাধীর প্রতি সম্মান দেখিয়ে হাতকড়া ঢাকতে সাহায্য করছে।' শেষ পর্যন্ত প্রকৃত পরিচয় ধরা পড়ে।",
th:"চমকপ্রদ সমাপ্তি (twist ending), আত্মমর্যাদা ও ভদ্রতা, বাহ্যিক ও প্রকৃত পরিচয়।"},
{t:"A Doll's House",w:"Henrik Ibsen (নাটক)",ch:"Nora, Torvald Helmer, Krogstad, Dr. Rank, Mrs. Linde",
s:"নোরা ও থরভাল্ড হেলমারের সুখী সংসার বাইরে থেকে দেখা যায়। অতীতে স্বামীর অসুস্থতার সময় নোরা গোপনে বাবার জাল স্বাক্ষর করে ক্রগস্টাডের কাছ থেকে ঋণ নেয়। এখন ক্রগস্টাড চাকরি হারানোর ভয়ে তাকে ব্ল্যাকমেইল করে। স্বামী সব জেনে ক্ষুব্ধ হয়ে নোরাকে তিরস্কার করে, কিন্তু ঋণের দলিল ফেরত এলে ক্ষমা করে ও আবার আগের মতো আচরণ করতে চায়। নোরা বুঝে যায় সে এতদিন 'পুতুল' ছিল; নিজেকে খুঁজতে সে স্বামী-সন্তান ছেড়ে বেরিয়ে যায়।",
th:"নারীর স্বাধীনতা ও আত্ম-পরিচয়, দাম্পত্যে কপটতা, নারীবাদ।"},
{t:"Of Studies",w:"Francis Bacon (প্রবন্ধ)",ch:"—",
s:"এই প্রবন্ধে বেকন অধ্যয়নের তিনটি উদ্দেশ্য বলেছেন—আনন্দ (delight), অলংকার/সম্মান (ornament) ও কর্মদক্ষতা (ability)। তিনি বলেন, অতিরিক্ত পড়া আলস্য, কেবল সাজসজ্জার জন্য পড়া ভান। বই তিন ধরনের—কিছু চেখে দেখার, কিছু গেলার, আর অল্প কিছু চিবিয়ে হজম করার। ইতিহাস মানুষকে জ্ঞানী করে, কবিতা বুদ্ধিমান, গণিত সূক্ষ্মদর্শী, নীতিশাস্ত্র গম্ভীর, ন্যায়শাস্ত্র তর্কনিপুণ করে। 'Reading maketh a full man, conference a ready man, and writing an exact man।'",
th:"শিক্ষার উপযোগিতা, ভারসাম্যপূর্ণ অধ্যয়ন, জ্ঞান ও চরিত্র গঠন।"},
{t:"Ode to a Skylark",w:"P. B. Shelley (কবিতা)",ch:"কবি, স্কাইলার্ক পাখি",
s:"কবি আকাশে উড়তে থাকা স্কাইলার্ককে 'blithe Spirit' বলে সম্বোধন করেন—সে আসলে পাখি নয়, স্বর্গীয় আত্মা, যার গান বিনা চেষ্টায় আকাশ ভরে দেয়। পাখিটিকে তিনি নানা কিছুর সঙ্গে তুলনা করেন: চিন্তার আড়ালে লুকিয়ে থাকা কবি, দুর্গ-চূড়ার নির্জন রাজকন্যা, ঘাসের মধ্যে জোনাকি ও গোলাপ—যারা অদৃশ্য থেকেও আনন্দ ছড়ায়। কবি জানতে চান পাখির এই আনন্দের উৎস কী; সে কি প্রেম, নাকি দুঃখের অভিজ্ঞতা-হীনতা? মানুষ অতীত-ভবিষ্যতের দিকে তাকায় ও যা নেই তার জন্য আকুল হয়, তাই 'our sweetest songs are those that tell of saddest thought'। শেষে কবি প্রার্থনা করেন—পাখির আনন্দের অর্ধেকও যদি শেখাতে পারো, আমার কবিতায়ও পৃথিবী মুগ্ধ হয়ে শুনবে।",
th:"আনন্দ ও বিষাদের সম্পর্ক, কবিতার প্রেরণা, মানুষের অপূর্ণতা বনাম প্রকৃতির অনাবিল আনন্দ।"},
{t:"Adonais",w:"P. B. Shelley (এলিজি)",ch:"কবি, Adonais (Keats), Urania, শোকার্ত কবিগণ",
s:"১৮২১ সালে কিটসের মৃত্যুতে শেলি এই শোককাব্য রচনা করেন। প্রাচীন গ্রিক মিথের অ্যাডোনিসের সঙ্গে তুলনা করে কিটসকে 'Adonais' নামে ডাকা হয়েছে। কাব্য-দেবী ইউরেনিয়া তার মৃত্যুশয্যার পাশে শোক করেন, প্রকৃতি ও অন্য কবিরা (এতে বায়রনকেও ইঙ্গিত করা হয়েছে) শোকযাত্রায় যোগ দেন। কিটসের তরুণ বয়সে মৃত্যুর জন্য শেলি কঠোর সমালোচকদের দায়ী মনে করেন। কিন্তু কাব্যের শেষ ভাগে কবি বলেন—'Peace, peace! he is not dead, he doth not sleep'; মৃত্যু শেষ নয়, কিটসের আত্মা অনন্ত সৌন্দর্যের সঙ্গে মিশে গেছে। শেষে শেলি নিজের আত্মাকেও সেই দূর নক্ষত্রের দিকে ধাবমান দেখেন।",
th:"মৃত্যু ও অমরত্ব, কবির নিয়তি, সমালোচকদের নিষ্ঠুরতা, আত্মার অনন্ত সৌন্দর্যে বিলীন হওয়া।"},
{t:"Prometheus Unbound",w:"P. B. Shelley (গীতিনাট্য)",ch:"Prometheus, Asia, Panthea, Ione, Jupiter, Demogorgon, Hercules, Earth",
s:"গ্রিক মিথের টাইটান প্রমিথিউস মানুষকে আগুন দেওয়ার অপরাধে দেবরাজ জুপিটারের শাস্তিতে ককেশাস পর্বতে শৃঙ্খলিত। শেলির নাটকে প্রমিথিউস ঘৃণা ত্যাগ করে জুপিটারের প্রতি দেওয়া নিজের অভিশাপ ফিরিয়ে নেন—প্রতিশোধ নয়, ক্ষমা ও প্রেমই মুক্তির পথ। প্রমিথিউসের প্রেয়সী আসিয়া ও তার বোনেরা আদিম শক্তি ডেমোগরগনের কাছে যায়। ডেমোগরগন উঠে এসে জুপিটারকে সিংহাসনচ্যুত করে। হারকিউলিস প্রমিথিউসকে মুক্ত করেন; প্রমিথিউস ও আসিয়ার মিলন হয় এবং পৃথিবী ও মানবজাতি স্বৈরশাসনের শৃঙ্খল থেকে মুক্ত হয়ে নতুন সময়ের সূচনা করে।",
th:"স্বৈরাচারের বিরুদ্ধে বিদ্রোহ, ক্ষমা ও প্রেমের শক্তি, মানবমুক্তির আদর্শবাদ।"},
{t:"The Cloud",w:"P. B. Shelley (কবিতা)",ch:"Cloud (মেঘ), Sun, Moon, Earth",
s:"মেঘ নিজেই এখানে কথক। সে প্রকৃতির নানা কাজ করে—ফুলের জন্য বৃষ্টির ঝিরঝির জল, পাতাদের জন্য ছায়া, ফসলের জন্য শিশির আনে এবং কখনো শিলা ও বজ্রপাত ঘটায়। সে 'daughter of Earth and Water' ও আকাশের আদরের সন্তান। সূর্য ও চাঁদের আলোয় সে নানা রঙে রাঙে। মেঘ ক্ষণে ক্ষণে রূপ বদলায়, কখনো গলে যায়, কখনো আবার জমে ওঠে—কিন্তু শেষে সে ঘোষণা করে 'I change, but I cannot die'; কারণ সে আবার সমুদ্র-পৃথিবীর জল থেকে নতুন করে জন্মায়।",
th:"প্রকৃতির চক্রাকার পরিবর্তন ও অবিনশ্বরতা, জলচক্র, আনন্দ ও সৃজনশীলতা।"},
{t:"A Defence of Poetry",w:"P. B. Shelley (প্রবন্ধ)",ch:"—",
s:"টমাস লাভ পিকক 'The Four Ages of Poetry' প্রবন্ধে বলেছিলেন যুক্তিবাদী ও বিজ্ঞানের যুগে কবিতা অপ্রয়োজনীয়। এর জবাবে শেলি লেখেন এই প্রবন্ধ। তিনি বলেন, কবিতা কল্পনা ও আবেগের প্রকাশ, যা মানুষের নৈতিক ও সামাজিক চেতনাকে গড়ে তোলে। কবিরা আগে থেকেই ভবিষ্যৎ দেখেন বলে তাঁরা সমাজের নিয়ম ও মূল্যবোধ গড়ার কাজ করেন, যদিও কেউ তা স্বীকার করে না—'Poets are the unacknowledged legislators of the world'। কবিতা ক্ষণস্থায়ী বিষয়কেও চিরকালীন সৌন্দর্য দেয় এবং 'মানুষের নৈতিক বিকাশ বিজ্ঞানের চেয়ে কবিতার ওপর বেশি নির্ভর করে'।",
th:"কবির সামাজিক ভূমিকা, কল্পনার শক্তি, কবিতা বনাম যুক্তি ও বিজ্ঞান।"},
{t:"Endymion, Book I",w:"John Keats (দীর্ঘ কবিতা)",ch:"Endymion, Cynthia (চন্দ্রদেবী), Indian Maid, Peona",
s:"এনডিমিয়ন লাটমাস পাহাড়ের এক তরুণ রাখাল-রাজপুত্র। কবিতার শুরুতেই বিখ্যাত পঙ্ক্তি—'A thing of beauty is a joy for ever'। এনডিমিয়ন স্বপ্নে চন্দ্রদেবী সিনথিয়ার (ডায়ানা) প্রেমে পড়ে এবং তাকে খুঁজতে পৃথিবী, পাতাল ও সমুদ্র ঘুরে বেড়ায়। পথে সে এক ভারতীয় কন্যাকে ভালোবেসে ফেলে ও নিজের বিশ্বস্ততা নিয়ে দ্বিধায় পড়ে। শেষে প্রকাশ পায় যে সেই কন্যাই সিনথিয়া। বোন পিওনা তাকে শান্ত করে। কবিতাটি মানুষের চিরন্তন সৌন্দর্য-অন্বেষণের রূপক।",
th:"আদর্শ সৌন্দর্যের সন্ধান, মানবিক ও স্বর্গীয় প্রেমের সম্পর্ক, কল্পনার ভূমিকা।"},
{t:"La Belle Dame sans Merci",w:"John Keats (গাথা-কবিতা)",ch:"Knight-at-arms, La Belle Dame (পরী-নারী)",
s:"এক পাণ্ডুর, অসুস্থ নাইটকে হ্রদের ধারে ঘুরতে দেখে একজন তাকে কারণ জিজ্ঞেস করে। নাইট জানায়, সে মাঠে এক অপূর্ব সুন্দরী 'faery's child'-এর দেখা পায়। সে তাকে ফুল-মালা পরায়, নিজের ঘোড়ায় তুলে নেয় এবং পরীর গুহায় নিয়ে যায়। সেখানে ঘুমিয়ে নাইট স্বপ্নে দেখে অনেক রাজা-রাজপুত্র ও যোদ্ধা—সবার মুখ ফ্যাকাশে, তারা বলে 'La Belle Dame sans Merci hath thee in thrall!'। জেগে নাইট নিজেকে ঠান্ডা পাহাড়ের গায়ে একা পায় এবং তখন থেকে সেখানেই অপেক্ষা করে।",
th:"মোহময়ী সৌন্দর্যের ফাঁদ, প্রেমের ধ্বংসাত্মক শক্তি, কল্পনা ও বাস্তবতার দ্বন্দ্ব।"},
{t:"The Eve of St. Agnes",w:"John Keats (আখ্যান-কবিতা)",ch:"Madeline, Porphyro, Angela, Beadsman",
s:"লোকবিশ্বাস ছিল—সেন্ট অ্যাগনেসের রাতে কুমারী মেয়েরা না খেয়ে ঘুমালে স্বপ্নে ভাবী স্বামীকে দেখে। শীতের রাতে মেডেলিন সেই আশায় অপেক্ষা করে। তার প্রেমিক পরফিরো ঘৃণাকারী প্রতিদ্বন্দ্বী পরিবারের হলেও ঝুঁকি নিয়ে দুর্গে ঢোকে; বৃদ্ধা পরিচারিকা অ্যাঞ্জেলার সাহায্যে সে মেডেলিনের ঘরের আলমারিতে লুকায়। মেডেলিন ঘুমিয়ে পড়লে পরফিরো বেরিয়ে এসে রাজকীয় খাবার সাজায় ও গান গায়। জেগে মেডেলিন স্বপ্ন-বাস্তবে মিশে ভয় পায়, কিন্তু শেষে দুজনে ঝড়ের রাতে দুর্গ ছেড়ে পালিয়ে যায়।",
th:"প্রেম বনাম পারিবারিক শত্রুতা, কল্পনা ও বাস্তবতা, ইন্দ্রিয়ঘন বর্ণনা।"},
{t:"To Autumn",w:"John Keats (ওড)",ch:"কবি, শরৎকাল",
s:"কবিতাটির তিনটি স্তবকে শরতের তিনটি রূপ। প্রথমে ফল-পাকার সময়—'Season of mists and mellow fruitfulness'—যখন সূর্যের সঙ্গে মিলে শরৎ আপেল, লাউ ও হ্যাজেল-বাদাম পরিপক্ব করে। দ্বিতীয়তে শরৎ কখনো শস্যের গাদার ওপর, কখনো অর্ধেক কাটা মাঠে, কখনো ঝরনার পাশে বসে—ফসল কাটার শ্রান্তির প্রতীক। তৃতীয়তে কবি বসন্তের গানের কথা ভুলে শরতের নিজস্ব সুর শুনতে বলেন: মশার গুঞ্জন, মেষশাবকের ডাক, ঝিঁঝিঁ, গাছের আড়ালে লালবুক পাখি ও আকাশে সোয়ালোর ঝাঁক।",
th:"ঋতুর পূর্ণতা ও পরিবর্তন, জীবনের পরিণতি ও বিদায়, প্রকৃতির ইন্দ্রিয়ঘন সৌন্দর্য।"},
{t:"Ode on Melancholy",w:"John Keats (ওড)",ch:"কবি, Melancholy (বিষণ্ণতা)",
s:"কবি পাঠককে বলেন—দুঃখ ভুলতে লিথি নদীর জল, নাইটশেড বা ইউ-ফল খেয়ো না, আর পেঁচা ও মথকে সঙ্গী কোরো না; এতে আত্মার বেদনা ঘুমিয়ে পড়ে। বরং যখন বিষণ্ণতা 'weeping cloud'-এর মতো নামে, তখন সকালের গোলাপ, সাগর-তরঙ্গের রং, পিওনির ভিড় বা প্রেমিকার রাগান্বিত হাত দেখে নিজের দুঃখকে ভরপুর অনুভব করো। কারণ বিষণ্ণতা সৌন্দর্য, আনন্দ ও প্রেমের সঙ্গেই বাস করে—কারণ এসবই ক্ষণস্থায়ী। যে আনন্দের আঙুরের মধ্যে নিজের জিভে বিষণ্ণতার স্বাদ নিতে জানে, সে-ই এর মন্দিরের সত্যিকারের পূজারি।",
th:"সৌন্দর্য ও ক্ষণস্থায়িত্ব, সুখ ও দুঃখের অবিচ্ছেদ্য সম্পর্ক, বিষণ্ণতাকে গ্রহণ করা।"},
{t:"Hyperion",w:"John Keats (অসমাপ্ত মহাকাব্য)",ch:"Saturn, Hyperion, Oceanus, Thea, Apollo, Mnemosyne",
s:"টাইটানদের শাসন ভেঙে পড়েছে, তাদের নেতা স্যাটার্ন সিংহাসন হারিয়ে বিমূঢ়। অন্য টাইটানরা সমবেত হয়ে ভাবে কী করা যায়। সমুদ্র-দেবতা ওশিয়ানাস বলেন, এই পরিবর্তন প্রকৃতির নিয়ম—নতুন, আরও সুন্দর দেবতারা (অলিম্পিয়ানরা) পুরোনোদের স্থান নেবে। শেষ টাইটান সূর্যদেব হাইপেরিয়ন এখনো আলো ধরে রেখেছে, কিন্তু আশঙ্কায় ভীত। তৃতীয় খণ্ডে নবীন দেবতা অ্যাপোলো দুঃখ ও জ্ঞানের অভিজ্ঞতায় 'দেবতা' হয়ে ওঠে। কিটস কবিতাটি অসমাপ্ত রেখে যান।",
th:"পুরাতনের পতন ও নতুনের উত্থান, কবিতা ও জ্ঞানের দেবতা অ্যাপোলো, দুঃখের মাধ্যমে আত্ম-পরিপূর্ণতা।"},
{t:"Childe Harold's Pilgrimage",w:"Lord Byron (আখ্যান-কবিতা)",ch:"Childe Harold, কবি (Byron)",
s:"হ্যারল্ড ইংল্যান্ডের এক ক্লান্ত, ভোগ-বিলাসে বিরক্ত তরুণ অভিজাত। ভোগে অতৃপ্ত হয়ে সে দেশ ছেড়ে ভ্রমণে বের হয়। প্রথম-দ্বিতীয় সর্গে সে পর্তুগাল, স্পেন, আলবেনিয়া ও গ্রিসে যায়; স্পেনের যুদ্ধ, গ্রিসের অতীত গৌরব ও বর্তমান পরাধীনতার জন্য কবি আক্ষেপ করেন। তৃতীয় সর্গে ওয়াটারলু, রাইন নদী ও সুইজারল্যান্ডের আল্পস; চতুর্থ সর্গে ইতালি—ভেনিস, রোম—যেখানে ইতিহাসের ধ্বংসাবশেষ দেখে কবি জীবন ও স্বাধীনতা নিয়ে ভাবেন। 'Roll on, thou deep and dark blue Ocean' পঙ্ক্তিতে সমুদ্রের শাশ্বত শক্তির বন্দনা আছে। প্রকাশের পর বায়রন রাতারাতি বিখ্যাত হন।",
th:"ভ্রমণ ও আত্ম-অন্বেষণ, স্বাধীনতার প্রতি অনুরাগ, Byronic hero।"},
{t:"She Walks in Beauty",w:"Lord Byron (গীতিকবিতা)",ch:"কবি, সুন্দরী নারী",
s:"কবি এক নারীর সৌন্দর্যের বর্ণনা দিয়েছেন—সে হাঁটে 'like the night of cloudless climes and starry skies'। তার মধ্যে আলো ও অন্ধকারের সেরা অংশ মিলেছে; তার চোখে ও মুখে তারা ও আঁধার একসঙ্গে মিশে নরম এক আভা তৈরি করেছে। এই আভা এমন যে আলো আরেকটু বেশি হলে বা অন্ধকার আরেকটু বেশি হলে সৌন্দর্য নষ্ট হত। তার কালো চুলে, কপোলে নরম ঔজ্জ্বল্য—ছড়ানো। শেষে কবি বলেন, এই বাহ্যিক সৌন্দর্যের সঙ্গে আছে শান্ত মন, ভালো কাজের স্মৃতি ও নিষ্পাপ প্রেমপূর্ণ হৃদয়।",
th:"অন্তর ও বাহ্য সৌন্দর্যের মিলন, আলো-অন্ধকারের ভারসাম্য, নারীর প্রতি প্রশংসা।"},
{t:"The Prisoner of Chillon",w:"Lord Byron (আখ্যান-কবিতা)",ch:"Bonnivard (বন্দি), তার ভাইয়েরা",
s:"জেনেভা হ্রদের ধারে শিলঁ দুর্গের অন্ধকার কারাগারে বন্দি কথক ও তার ভাইয়েরা সাতটি স্তম্ভে শিকলে বাঁধা। বিশ্বাসের জন্য তাদের বাবা প্রাণ দিয়েছেন এবং ভাইয়েরা একে একে মারা যায়। কনিষ্ঠ ভাইয়ের মৃত্যু বর্ণনা সবচেয়ে মর্মস্পর্শী—সে সূর্যের আলো ও প্রকৃতির জন্য আকুল ছিল। কথক শেষ পর্যন্ত একা বেঁচে থাকে, প্রায় পাগল হয়ে যায়। একদিন একটি পাখি তার জানালায় এলে সে আশা ফিরে পায়। বহু বছর পর মুক্তি পেয়েও সে বন্দিদশায় এত অভ্যস্ত যে 'even I regained my freedom with a sigh'।",
th:"স্বাধীনতার মূল্য, ধর্মীয় অত্যাচার, মানুষের সহনশক্তি, বন্দিদশার প্রভাব।"},
{t:"Manfred",w:"Lord Byron (নাট্য-কবিতা)",ch:"Manfred, Astarte, Witch of the Alps, Abbot of St. Maurice, Arimanes, Spirits",
s:"আল্পসের এক অভিজাত ম্যানফ্রেড গভীর অপরাধবোধ ও যন্ত্রণায় দগ্ধ—প্রেয়সী অ্যাসটার্টির মৃত্যুর জন্য সে নিজেকে দায়ী মনে করে। বিস্মরণ চেয়ে সে অতিপ্রাকৃত আত্মাদের ডাকে, কিন্তু তারা তাকে ভুলিয়ে দিতে পারে না। সে জুংফ্রাউ পাহাড়ের চূড়া থেকে ঝাঁপ দিতে যায়, এক শিকারি তাকে বাঁচায়। পরে সে শয়তানি শক্তি আরিমানেসের সভায় গিয়ে অ্যাসটার্টির আত্মাকে ডাকলে সে শুধু বলে—'Manfred, tomorrow ends thine earthly ills'। মৃত্যুর সময় ম্যানফ্রেড পাদ্রির প্রার্থনা ও আত্মাদের হুমকি—দুটোই প্রত্যাখ্যান করে নিজের শর্তে মরে।",
th:"অপরাধবোধ ও আত্মমুক্তি, অতিমানবের বিদ্রোহ, জ্ঞান ও যন্ত্রণা, Byronic hero।"},
{t:"Tintern Abbey",w:"William Wordsworth (কবিতা)",ch:"কবি, Dorothy (বোন), Wye নদী",
s:"পাঁচ বছর পর কবি আবার ওয়াই নদীর তীরে টিনটার্ন অ্যাবির কাছে ফিরে আসেন। এই পাঁচ বছর শহরের কোলাহলে এই দৃশ্যের স্মৃতিই তাঁকে শান্তি ও 'sensations sweet' দিয়েছে। তিনি ভাবেন, প্রকৃতির প্রতি তাঁর অনুভূতি তিন ধাপে বদলেছে: প্রথমে বালকের প্রাণোচ্ছল আনন্দ, তারপর যৌবনের তীব্র আকর্ষণ, এখন পরিণত বয়সে মানবজাতির 'still, sad music'-এর বোধ। পাশে থাকা বোন ডরোথির মধ্যে তিনি নিজের অতীত দেখেন এবং প্রার্থনা করেন, 'Nature never did betray the heart that loved her'—ভবিষ্যতে এই প্রকৃতিই ডরোথিকে শান্তি দেবে।",
th:"প্রকৃতির প্রতি ভালোবাসা ও তার নৈতিক প্রভাব, স্মৃতির ভূমিকা, বয়সের সঙ্গে অনুভূতির পরিবর্তন।"},
{t:"The Prelude",w:"William Wordsworth (আত্মজীবনীমূলক কাব্য)",ch:"কবি, Coleridge, Dorothy",
s:"কোলরিজকে উদ্দেশ্য করে লেখা এই কাব্যের পুরো নাম 'The Growth of a Poet's Mind'। এতে কবির শৈশবের লেক ডিস্ট্রিক্টে প্রকৃতির সঙ্গে ঘনিষ্ঠতা, স্কুলজীবন, কেমব্রিজ ও লন্ডনের অভিজ্ঞতা, ফ্রান্সে বিপ্লবের প্রতি উৎসাহ ও পরে হতাশার কথা আছে। বিপ্লবের আদর্শ ভেঙে গেলে তিনি আত্মিক সংকটে পড়েন। প্রকৃতি, বোন ডরোথি ও কোলরিজের সঙ্গ তাঁকে আবার জীবনীশক্তি ও কবি হিসেবে আত্মবিশ্বাস ফিরিয়ে দেয়। মৃত্যুর পর ১৮৫০ সালে এটি প্রকাশিত হয়।",
th:"কবির মানসিক বিকাশ, স্মৃতি ও কল্পনা, প্রকৃতির নিরাময় শক্তি, বিপ্লব ও হতাশা।"},
{t:"Michael",w:"William Wordsworth (পাস্টোরাল কবিতা)",ch:"Michael, Isabel, Luke",
s:"গ্রিনহেড গিল-এর বৃদ্ধ মেষপালক মাইকেল তার স্ত্রী ইসাবেল ও আদরের ছেলে লুককে নিয়ে সহজ জীবন কাটায়। ভাগ্নের ঋণের দায় এসে পড়লে পৈতৃক জমি বিক্রি করার বদলে মাইকেল লুককে শহরে কাজ করে টাকা আনতে পাঠায়। যাওয়ার আগে লুক ও মাইকেল একটি মেষ-খোঁয়াড়ের ভিত্তিপাথর বসায়—প্রতিশ্রুতির চিহ্ন। শহরে লুক খারাপ পথে চলে যায় ও দেশ ছেড়ে পালায়। মাইকেল ভগ্নহৃদয়ে খোঁয়াড়ের কাজ চালাতে চায় কিন্তু অসমাপ্ত রেখে মারা যায়; জমি বিক্রি হয়, বাড়ি ধ্বংস হয়। শুধু অসমাপ্ত খোঁয়াড়টি পড়ে থাকে।",
th:"পিতা-পুত্রের সম্পর্ক, গ্রামীণ জীবনের সরলতা বনাম শহরের প্রলোভন, দুঃখ ও সহনশীলতা।"},
{t:"She Dwelt Among the Untrodden Ways (Lucy Poems)",w:"William Wordsworth (কবিতা)",ch:"কবি, Lucy",
s:"লুসি পাহাড়ি উপত্যকার নির্জন পথে কারো নজরে না পড়ে বাস করত। কবি তাকে ঘাসের পাথরের পাশে লুকিয়ে থাকা 'violet by a mossy stone' ও আকাশের একটি তারার সঙ্গে তুলনা করেন—যে সৌন্দর্য প্রায় কেউ দেখেনি। খুব কম মানুষ লুসিকে চিনত, আর খুব কম মানুষ জানতে পেরেছিল যে সে কবে মারা গেছে। কিন্তু কবির কাছে তার মৃত্যু এক বিশাল শূন্যতা—'But she is in her grave, and, oh, the difference to me!'। কবিতাটি সংক্ষিপ্ত, সরল ভাষায় গভীর ব্যক্তিগত বেদনা প্রকাশ করে।",
th:"নির্জন সৌন্দর্য, ব্যক্তিগত শোক, প্রকৃতির সঙ্গে মানুষের মিল।"},
{t:"My Heart Leaps Up",w:"William Wordsworth (কবিতা)",ch:"কবি",
s:"আকাশে রংধনু দেখে কবির হৃদয় আনন্দে লাফিয়ে ওঠে। তিনি বলেন, শিশুবেলায় এমন হত, এখন প্রাপ্তবয়স্ক হয়েও হচ্ছে; আর বৃদ্ধ বয়সে যদি এমন না হয়, তবে বরং মরে যাওয়াই ভালো। কবি বলেন, 'The Child is father of the Man'—শিশুর প্রকৃতিপ্রেম ও বিস্ময় থেকেই পরিণত মানুষের চরিত্র গড়ে ওঠে। তিনি প্রার্থনা করেন, তাঁর জীবনের প্রতিটি দিন যেন 'natural piety' বা প্রকৃতির প্রতি ভক্তি দিয়ে বাঁধা থাকে।",
th:"শৈশব ও পরিণত বয়সের ধারাবাহিকতা, প্রকৃতির প্রতি শ্রদ্ধা, Paradox।"},
{t:"Composed Upon Westminster Bridge",w:"William Wordsworth (সনেট)",ch:"কবি, লন্ডন শহর, টেমস নদী",
s:"১৮০২ সালের এক সকালে কবি ওয়েস্টমিনস্টার ব্রিজ থেকে ঘুমন্ত লন্ডন শহর দেখে মুগ্ধ হন। তিনি বলেন—'Earth has not anything to show more fair'; যে এমন দৃশ্য দেখে মুগ্ধ হয় না, সে নিরেট হৃদয়ের। শহর যেন সকালের সৌন্দর্যকে পোশাকের মতো পরে আছে—জাহাজ, টাওয়ার, গির্জা, থিয়েটার আর চূড়াগুলো ধোঁয়াহীন, নির্মল আকাশের নিচে শান্ত। সূর্যের আলো কোনো উপত্যকা বা পাহাড়েও এত সুন্দর করে পড়েনি। শেষে কবি বিস্মিত—'Dear God! the very houses seem asleep; and all that mighty heart is lying still!'",
th:"শহর ও প্রকৃতির সৌন্দর্য, ভোরের নিস্তব্ধতা, শহরের প্রতীকী 'হৃদয়'।"},
{t:"Ode: Intimations of Immortality",w:"William Wordsworth (ওড)",ch:"কবি, শিশু",
s:"কবি অনুভব করেন, শৈশবে প্রকৃতিতে যে আলোকিত দিব্য আভা তিনি দেখতেন, এখন তা চলে গেছে—'There was a time when meadow, grove, and stream... did seem apparelled in celestial light'। তাঁর বিশ্বাস, শিশু ঈশ্বরের কাছ থেকে 'trailing clouds of glory' নিয়ে আসে; বড় হওয়ার সঙ্গে সঙ্গে সংসারের কাজে সেই দিব্য স্মৃতি ম্লান হয়। কিন্তু কবি হতাশ নন: সেই অতীত স্মৃতি, ছোট ছোট অনুভূতি ও মৃত্যুচেতনা থেকে যে 'philosophic mind' জন্মায়, তা তাঁকে নতুন শক্তি দেয়। তিনি প্রকৃতিকে আগের চেয়ে আরও গভীরভাবে ভালোবাসেন।",
th:"শৈশবের পবিত্রতা, আত্মার অমরত্ব, ক্ষয় ও ক্ষতিপূরণ, স্মৃতির শক্তি।"},
{t:"The Tables Turned",w:"William Wordsworth (কবিতা)",ch:"কবি, তাঁর বন্ধু",
s:"কবি তাঁর বন্ধুকে বইয়ের জগৎ থেকে বেরিয়ে আসতে ডাকেন—'Up! up! my Friend, and quit your books'। বাইরে সূর্য, মাঠ, বাতাস ও পাখির গান আছে; লিনেট ও থ্রাশ পাখি সবচেয়ে ভালো শিক্ষক। বনের একটি আবেগ মানুষ, নীতি ও ভালো-মন্দ সম্পর্কে সব জ্ঞানী লোকের চেয়ে বেশি শেখাতে পারে। বইয়ের জ্ঞান শীতল, কারণ 'We murder to dissect'—বিশ্লেষণ করতে গিয়ে আমরা প্রাণ হত্যা করি। তাই কবি বলেন, 'Come forth into the light of things, let Nature be your teacher'।",
th:"প্রকৃতি শিক্ষক হিসেবে, বই বনাম প্রত্যক্ষ অভিজ্ঞতা, বিশ্লেষণী জ্ঞানের সীমা।"},
{t:"Paradise Regained",w:"John Milton (সংক্ষিপ্ত মহাকাব্য)",ch:"Jesus (Son of God), Satan, Mary, Angels",
s:"'Paradise Lost'-এর সিক্যুয়েল। জর্ডান নদীতে দীক্ষার পর যিশু মরুভূমিতে চল্লিশ দিন একা উপবাস করেন। শয়তান ছদ্মবেশে এসে তাঁকে একের পর এক প্রলোভন দেখায়: ক্ষুধার্ত যিশুকে পাথর থেকে রুটি বানাতে বলে; তারপর রাজকীয় ভোজ ও ধন-সম্পদের লোভ দেখায়; রোম ও পার্থিয়ার মতো সাম্রাজ্যের ক্ষমতার প্রস্তাব দেয়; এথেন্সের দর্শন ও জ্ঞান দেখায়। যিশু প্রতিটি প্রলোভন যুক্তি ও ধৈর্য দিয়ে প্রত্যাখ্যান করেন। শেষে শয়তান তাঁকে মন্দিরের চূড়ায় তুলে লাফ দিতে বলে; যিশু শান্তভাবে দাঁড়িয়ে থাকেন—'Tempt not the Lord thy God'—আর শয়তান নিজেই পড়ে যায়। দেবদূতরা যিশুকে খাবার দেন; আদমের পতনে হারানো 'paradise' আত্মসংযমের মাধ্যমে ফিরে আসে।",
th:"প্রলোভনের বিরুদ্ধে আত্মসংযম, আনুগত্য ও বিনয়ের বিজয়, 'প্রাপ্ত স্বর্গ' (Paradise within)।"},
{t:"Samson Agonistes",w:"John Milton (নাট্যকাব্য)",ch:"Samson, Manoa, Dalila, Harapha, Chorus of Danites, Messenger",
s:"গ্রিক ট্র্যাজেডির আদলে লেখা নাট্যকাব্য, যেখানে দৃশ্য মাত্র একদিনের। অন্ধ ও বন্দি স্যামসন গাজায় ফিলিস্তিনিদের জন্য চাক্কি ঘোরায়। নিজের পতনের জন্য তিনি দায়ী—বিশ্বাসঘাতক স্ত্রী ডালিলার কাছে নিজের শক্তির রহস্য ফাঁস করেছিলেন। প্রথমে পিতা মানোয়া এসে মুক্তিপণ দিয়ে ছেড়ে আনার কথা বলেন; পরে ডালিলা এসে অনুতাপের ভান করে, স্যামসন তাকে কঠোরভাবে ফিরিয়ে দেন। দৈত্য হারাফা এসে উপহাস করলে স্যামসন তাকে যুদ্ধে আহ্বান করেন। ফিলিস্তিনিদের দেবতা ডাগনের উৎসবে স্যামসনকে ডেকে নিয়ে যাওয়া হয়; ঈশ্বরীয় প্রেরণা অনুভব করে তিনি মন্দিরের স্তম্ভ ধসিয়ে দেন, তাঁর শত্রু ও নিজের মৃত্যু ঘটে। শেষে 'calm of mind all passion spent'।",
th:"নিয়তি ও স্বাধীন ইচ্ছা, অপরাধবোধ ও আত্মশুদ্ধি, দৈবশক্তির সংগ্রাম। (মিল্টনের নিজের অন্ধত্বের প্রতিফলন)"},
{t:"Lycidas",w:"John Milton (পাস্টোরাল এলিজি)",ch:"কবি, Lycidas (Edward King), Phoebus, St. Peter, Camus",
s:"মিল্টনের কেমব্রিজের বন্ধু এডওয়ার্ড কিং ১৬৩৭ সালে আইরিশ সাগরে ডুবে মারা যান, তাঁর স্মরণে এই এলিজি। কবি রাখাল-রাখালিয়ার পরিবেশে শুরু করেন: অকালমৃত্যুর কারণে 'laurels' অপরিণত অবস্থায় ছিঁড়তে হচ্ছে। তিনি জলকন্যারা ও দেবতারা কেন তাকে বাঁচাল না প্রশ্ন করেন। আপোলো জানান, সত্যিকারের খ্যাতি পৃথিবীতে নয়, স্বর্গে ঈশ্বরের বিচারে মেলে। সেন্ট পিটার দুর্নীতিগ্রস্ত যাজকদের তীব্র নিন্দা করেন (মিল্টনের ধর্মীয় সমালোচনা)। শেষে কবি শোকের ফুলে সমাধি সাজান এবং বলেন লাইসিডাস মরেননি—সূর্যের মতো সাগরে ডুবে আবার ওঠেন। 'To-morrow to fresh woods, and pastures new'।",
th:"অকালমৃত্যু ও খ্যাতি, ধর্মীয় দুর্নীতির সমালোচনা, শোক থেকে সান্ত্বনায় রূপান্তর।"},
{t:"Comus",w:"John Milton (মাস্ক / নাট্যকাব্য)",ch:"The Lady, Comus, Two Brothers, Attendant Spirit (Thyrsis), Sabrina",
s:"১৬৩৪ সালে লাডলো দুর্গে মঞ্চস্থ মাস্ক। এক ভদ্র তরুণী (The Lady) দুই ভাইয়ের সঙ্গে বনের পথে যেতে গিয়ে অন্ধকারে একা হয়ে পড়ে। জাদুকর কোমাস (দেবী সার্সির ছেলে) রাখালের ছদ্মবেশে এসে তাকে নিজের প্রাসাদে নিয়ে যায় এবং জাদুর চেয়ারে বসিয়ে মোহময় পানীয় দেয়। লেডি পানীয় প্রত্যাখ্যান করে সংযম ও পবিত্রতার পক্ষে যুক্তি দেয়, কোমাস তার বাক্যে ভয় পায়। দুই ভাই অ্যাটেনডেন্ট স্পিরিটের সাহায্যে এসে কোমাসকে তাড়িয়ে দেয়, কিন্তু লেডি জাদুর চেয়ারে আটকে থাকে। নদী-দেবী সাবরিনা জলের ছিটায় তাকে মুক্ত করেন। সবাই নিরাপদে বাবার কাছে ফিরে যায়।",
th:"সংযম ও পবিত্রতার শক্তি, ভোগ বনাম নৈতিকতা, সৎ আচরণের চূড়ান্ত বিজয়।"},
{t:"Areopagitica",w:"John Milton (গদ্য ভাষণ)",ch:"—",
s:"১৬৪৩ সালে ইংলিশ পার্লামেন্ট 'Licensing Order' জারি করে—প্রকাশের আগে সব বইয়ের অনুমতি নিতে হবে। এর বিরুদ্ধে মিল্টন ১৬৪৪ সালে এই ভাষণ-প্রবন্ধ লেখেন, যার নাম এথেন্সের 'Areopagus' পাহাড় থেকে। তিনি যুক্তি দেন: বই 'absolutely dead things' নয়, এতে লেখকের প্রাণশক্তি থাকে; ভালো বই হত্যা করা মানে 'reason' হত্যা করা। ভালো-মন্দ দুই-ই জানা না থাকলে মানুষের ধার্মিকতা 'fugitive and cloistered virtue'। সত্য ও মিথ্যা মুক্ত যুদ্ধে নামলে সত্যই জিতবে। তাই তিনি বলেন, 'Give me the liberty to know, to utter, and to argue freely according to conscience, above all liberties'।",
th:"মুক্ত মত প্রকাশ ও ছাপাখানার স্বাধীনতা, সেন্সরশিপের বিরোধিতা, সত্যের স্বাধীন প্রতিযোগিতা।"},
{t:"On His Blindness (Sonnet 19)",w:"John Milton (সনেট)",ch:"কবি, Patience, God",
s:"মিল্টন ১৬৫২ সালের মধ্যে পুরোপুরি অন্ধ হয়ে যান। সনেটের শুরুতে তিনি ভাবেন—'When I consider how my light is spent'—জীবনের অর্ধেকেই আলো শেষ হয়ে গেছে, আর তাঁর 'one Talent' (কবিতা-প্রতিভা) অকেজো হয়ে পড়ে আছে, যদিও ঈশ্বরের সেবায় তা দেওয়ার ইচ্ছা ছিল। তিনি ক্ষুব্ধ হয়ে প্রশ্ন করেন, 'Doth God exact day-labour, light denied?'—আলো না দিয়েও কি ঈশ্বর কাজ আশা করেন? কিন্তু 'Patience' নামের কণ্ঠ উত্তর দেয়: ঈশ্বরের মানুষের কাজ বা উপহার লাগে না; যে তাঁর শাসন বিনয়ে মেনে নেয়, সেই-ই শ্রেষ্ঠ সেবা করে। 'They also serve who only stand and wait'।",
th:"অন্ধত্ব ও হতাশা, ধৈর্য ও আত্মসমর্পণ, ঈশ্বরের সেবার অর্থ।"},
{t:"In Memoriam",w:"Lord Alfred Tennyson (এলিজি)",ch:"কবি, Arthur Henry Hallam",
s:"১৮৩৩ সালে টেনিসনের প্রিয় বন্ধু আর্থার হেনরি হ্যালাম ভিয়েনায় হঠাৎ মারা যান। প্রায় সতেরো বছর ধরে রচিত ১৩১টি অংশের এই এলিজি শোকের বিভিন্ন স্তরের কাহিনি। প্রথমে তীব্র শোক ও হতাশা; তিনটি বড়দিনে (Christmas) শোকের পরিবর্তিত রূপ। ভূবিজ্ঞান ও বিবর্তনের আবিষ্কার কবির বিশ্বাস নাড়া দেয়—প্রকৃতি 'red in tooth and claw', তাহলে ঈশ্বরের প্রেম কোথায়? ধীরে ধীরে কবি বিশ্বাস ও আশায় ফেরেন, মনে করেন হ্যালাম মানবজাতির উচ্চতর বিবর্তনের প্রতীক। উপসংহারে কবির বোনের বিয়ের উৎসব, জীবনের নতুন সূচনা। বিখ্যাত পঙ্ক্তি: 'It is better to have loved and lost than never to have loved at all'।",
th:"শোক ও সান্ত্বনা, বিশ্বাস বনাম সংশয় (বিজ্ঞান ও ধর্ম), বন্ধুত্ব, অমরত্বের আশা।"},
{t:"Morte d'Arthur",w:"Lord Alfred Tennyson (আখ্যান-কবিতা)",ch:"King Arthur, Sir Bedivere, Mordred, Three Queens",
s:"শেষ যুদ্ধে (লায়োনেস) রাজা আর্থার বিশ্বাসঘাতক মর্ড্রেডের হাতে মারাত্মক আহত। মৃত্যুপথযাত্রী আর্থার বিশ্বস্ত নাইট স্যার বেডিভিয়ারকে নির্দেশ দেন তাঁর জাদুর তলোয়ার এক্সক্যালিবার হ্রদে ছুড়ে ফেলতে। তলোয়ারের সৌন্দর্যে মুগ্ধ বেডিভিয়ার দুবার মিথ্যা বলে—আর্থার ধরে ফেলেন। তৃতীয়বার সে তলোয়ার ছুড়ে ফেলে; হ্রদ থেকে এক হাত উঠে তা তিনবার ঘুরিয়ে নিয়ে ডুবে যায়। বেডিভিয়ার আর্থারকে কাঁধে করে হ্রদের তীরে নিয়ে যায়, সেখানে তিন রানি কালো নৌকায় তাঁকে নিয়ে যান আভালনে আরোগ্যের জন্য। আর্থার বলেন, 'The old order changeth, yielding place to new, and God fulfils himself in many ways'।",
th:"কর্তব্য ও আনুগত্য, পুরাতনের বিদায় ও নতুনের আগমন, বীরের মৃত্যু ও আশা, প্রার্থনার শক্তি।"},
{t:"The Lotos-Eaters",w:"Lord Alfred Tennyson (কবিতা)",ch:"Ulysses, মাঝিরা (mariners), Lotos-eaters",
s:"ট্রয় থেকে ফেরার পথে ইউলিসিসের জাহাজ এক রহস্যময় দ্বীপে নামে—যেখানে চিরন্তন বিকেল, শান্ত বাতাস। ইউলিসিস 'Courage!' বলে সঙ্গীদের উৎসাহ দেন। দ্বীপের লোটাস-ভোজীরা তাদের লোটাস ফুল-ফল দেয়; যারা তা খায় তারা ঘরবাড়ি, পরিবার, কর্তব্য ভুলে যায় এবং বিশ্রামে ডুবে যেতে চায়। নাবিকরা সমবেত গানে বলে—শ্রম মৃত্যুর চেয়েও কষ্টকর, তাই 'Let us alone'; তারা ঘরে ফিরতে অস্বীকার করে ও লোটাসের দেশে অলস স্বপ্নে বাঁচতে চায়। কবিতাটি কর্তব্য ও আরামের দ্বন্দ্বের নাটকীয় চিত্র।",
th:"কর্ম বনাম নিষ্ক্রিয়তা, ঘরে ফেরার আকুলতা বনাম বিস্মরণ, পলায়নবাদ।"},
{t:"The Lady of Shalott",w:"Lord Alfred Tennyson (গাথা)",ch:"The Lady of Shalott, Sir Lancelot, Reapers",
s:"নদীর ধারে শ্যালট দ্বীপের এক নির্জন টাওয়ারে রহস্যময় লেডি অভিশপ্ত হয়ে বসবাস করে—তাকে সরাসরি ক্যামেলটের দিকে তাকাতে নিষেধ। সে একটি আয়নায় প্রতিফলন দেখে রং-বেরঙের দুনিয়ার ছবি তাঁতে বোনে। একদিন আয়নায় সে বীর নাইট স্যার ল্যান্সেলটের উজ্জ্বল ঝলক দেখে; আর সংযম রাখতে না পেরে সরাসরি জানালা দিয়ে তাকায়। তৎক্ষণাৎ আয়না ভেঙে যায়, জাল ছিঁড়ে যায়—'The curse is come upon me'। সে একটি নৌকায় নিজের নাম লিখে ক্যামেলটের দিকে ভাসতে ভাসতে গান গায় এবং পৌঁছনোর আগেই মারা যায়। ল্যান্সেলট শুধু বলেন, 'She has a lovely face'।",
th:"শিল্পীর বিচ্ছিন্নতা বনাম বাস্তব জীবন ও প্রেম, অভিশাপ ও আত্মত্যাগ।"},
{t:"The Charge of the Light Brigade",w:"Lord Alfred Tennyson (যুদ্ধ-কবিতা)",ch:"Light Brigade (৬০০ অশ্বারোহী), Lord Cardigan",
s:"১৮৫৪ সালের ২৫ অক্টোবর ক্রিমিয়ার যুদ্ধের বালাক্লাভার যুদ্ধে ব্রিটিশ লাইট ব্রিগেডের ঘটনা। এক ভুল-বোঝা নির্দেশে ছয় শ' অশ্বারোহী সৈন্য রুশ কামানের মুখে 'valley of Death'-এ ঢুকে পড়ে—তাদের ডাইনে, বাঁয়ে ও সামনে কামান। সৈন্যরা জানত ভুল হয়েছে, তবু 'Theirs not to reason why, theirs but to do and die'। 'Half a league, half a league, half a league onward' পঙ্ক্তির ছন্দ ঘোড়ার ছুটে যাওয়ার শব্দ ফোটায়। অসংখ্য সৈন্য মরে, বাকিরা ফিরে আসে। কবি শেষে বলেন—'Honour the Light Brigade, noble six hundred!'",
th:"আদেশ-পালন ও আত্মত্যাগ, যুদ্ধের নির্মমতা, বীরত্বের গৌরব।"},
{t:"Crossing the Bar",w:"Lord Alfred Tennyson (কবিতা)",ch:"কবি, Pilot",
s:"মৃত্যুর কিছু বছর আগে (১৮৮৯) লেখা টেনিসনের শেষ জীবনের কবিতা। কবি বলেন, 'Sunset and evening star' দেখে যখন আমার ডাক আসবে, তখন 'may there be no moaning of the bar'—বন্দরের বালুর চরে (bar) যেন শোকের গর্জন না ওঠে, সমুদ্র যেন শান্ত থাকে। জীবনের সমুদ্র থেকে অনন্ত সমুদ্রের দিকে যাত্রা এক জোয়ারের মতো। কবি আশা করেন, 'sees my Pilot face to face' (ঈশ্বরকে) যখন তিনি নৌকো পার হবেন। মৃত্যু এখানে ভয়ের নয়, শান্ত ও আশাময় যাত্রা।",
th:"মৃত্যুর প্রতি শান্ত গ্রহণযোগ্যতা, ঈশ্বরে বিশ্বাস, জীবন-মৃত্যুর রূপক (সমুদ্রযাত্রা)।"},
{t:"Locksley Hall",w:"Lord Alfred Tennyson (নাটকীয় স্বগতোক্তি)",ch:"Speaker (তরুণ), Amy (cousin)",
s:"এক তরুণ নাবিক সঙ্গীদের একটু অপেক্ষা করতে বলে লকসলে হলে ফিরে আসে, যেখানে সে প্রিয় কাজিন অ্যামির সঙ্গে বড় হয়েছিল। অ্যামি তাকে ভালোবাসত, কিন্তু পরিবারের চাপে ধনী ও নির্বোধ এক ব্যক্তিকে বিয়ে করেছে। তরুণ ক্ষোভে, বিষাদে প্রেমের, ধনলিপ্সার সমাজের নিন্দা করে; কিছুক্ষণ আদিম পরিবেশে পালিয়ে যাওয়ার কথা ভাবে। কিন্তু শেষে সে বিজ্ঞান ও মানবজাতির অগ্রগতিতে বিশ্বাস রেখে বলে—'Let the great world spin for ever down the ringing grooves of change'। সে ফিরে যায় সামনের পথে।",
th:"ব্যর্থ প্রেম ও সামাজিক অর্থলিপ্সা, প্রগতির প্রতি আশা, ভিক্টোরীয় সমাজের সমালোচনা।"},
{t:"Idylls of the King",w:"Lord Alfred Tennyson (আখ্যান-কাব্য)",ch:"King Arthur, Guinevere, Lancelot, Merlin, Vivien, Galahad, Elaine",
s:"বারোটি আখ্যান-কবিতার সমষ্টি, যেখানে আর্থারের উত্থান ও পতনের কাহিনি আছে। প্রথম দিকে আর্থার রাজ্য ঐক্যবদ্ধ করে, গিনিভারকে বিয়ে করে এবং রাউন্ড টেবিলের নাইটদের নিয়ে আদর্শ রাজ্য গড়ে—সত্য, কর্তব্য ও পবিত্রতার শপথে। পরে সমস্যা শুরু হয়: ল্যান্সেলট ও গিনিভারের গোপন প্রেম, মার্লিনের ভ্রান্তিতে ভিভিয়েনের প্রতারণা, নাইটদের পবিত্র গ্রেইল-অন্বেষণে বিভ্রান্তি। এসবের মধ্য দিয়ে নৈতিকতার ক্ষয় এসে আর্থারের স্বপ্নের রাজ্য ভেঙে দেয়, আর মর্ড্রেডের বিদ্রোহে শেষ যুদ্ধে রাজা আহত হয়ে চলে যান।",
th:"আদর্শ ও পতন, নৈতিকতা ও ব্যক্তিগত আবেগের দ্বন্দ্ব, ভিক্টোরীয় যুগের নীতিবোধ।"},
{t:"Pygmalion",w:"G. B. Shaw (নাটক)",ch:"Eliza Doolittle, Henry Higgins, Colonel Pickering, Alfred Doolittle, Mrs. Higgins, Freddy",
s:"ভাষাবিজ্ঞানী অধ্যাপক হেনরি হিগিন্স কভেন্ট গার্ডেনের কিছু ফুলওয়ালি এলিজা ডুলিটলের কথা শুনে বাজি ধরেন—ছয় মাসে তাকে উচ্চারণ-ভঙ্গি শিখিয়ে ডাচেসের মতো ভদ্রসমাজে চালিয়ে দিতে পারবেন। কর্নেল পিকারিং তার বাজির সাক্ষী। এলিজা তাঁর বাড়িতে এসে কঠোর ভাষা-প্রশিক্ষণ নেয়। তার বাবা অ্যালফ্রেড ডুলিটল ময়লা-কর্মী; এক ধনী লোকের উইলে অপ্রত্যাশিত ধনী হয়ে ভদ্রসমাজের নৈতিকতায় আটকে যায়। দূতাবাসের নাচে এলিজা সবাইকে মুগ্ধ করে, কিন্তু হিগিন্স একাই কৃতিত্ব নেন; আহত এলিজা প্রতিবাদ করে চলে যায়। শেষে সে নিজের স্বাধীনতা ঘোষণা করে—সে আর কারো পুতুল নয়। (শ'-এর পরবর্তী মন্তব্য: এলিজা ফ্রেডিকে বিয়ে করে।)",
th:"শ্রেণিবৈষম্য ও ভাষা, নারীর স্বাধীনতা ও আত্মমর্যাদা, শিক্ষার রূপান্তর শক্তি।"},
{t:"Man and Superman",w:"G. B. Shaw (নাটক)",ch:"Jack Tanner, Ann Whitefield, Octavius, Ramsden, Mendoza, Straker",
s:"বিপ্লবী ভাবধারার জ্যাক ট্যানার বিয়ের বিরোধী, কিন্তু বুদ্ধিমতী ও চতুর অ্যান হোয়াইটফিল্ড তাকে স্বামী হিসেবে বেছে নেয়। অ্যানের মৃত পিতার ইচ্ছায় জ্যাক ও র‍্যামসডেন তার অভিভাবক। অ্যানের আরেক ভক্ত অক্টেভিয়াস তাকে ভালোবাসে, কিন্তু অ্যানের পছন্দ জ্যাক। ভয় পেয়ে জ্যাক চালক স্ট্রেকারকে নিয়ে স্পেনে পালায়, ডাকাত-সর্দার মেনডোজার হাতে ধরা পড়ে। অ্যান সেখানেও পিছু নেয়। বিখ্যাত 'Don Juan in Hell' অংশে জ্যাকের স্বপ্নে দর্শনিক বিতর্ক হয়। শেষে জ্যাক হার মেনে অ্যানকে বিয়ে করতে রাজি হয়; শ'র মতে নারী এখানে 'Life Force'-এর বাহক।",
th:"'Life Force' ও বিবাহ, নারী ও পুরুষের ভূমিকা, সামাজিক রীতিনীতির ব্যঙ্গ, আদর্শবাদ ও বাস্তবতা।"},
{t:"Major Barbara",w:"G. B. Shaw (নাটক)",ch:"Barbara Undershaft, Andrew Undershaft, Lady Britomart, Adolphus Cusins, Stephen",
s:"লেডি ব্রিটোমার্ট স্বামী অ্যান্ড্রু আন্ডারশাফটের কাছে কিছু টাকা চান। আন্ডারশাফট অস্ত্র-কারখানার মালিক, দীর্ঘ দিন পরিবার ছাড়া। কন্যা বারবারা সালভেশন আর্মির মেজর, তার বাগদত্তা অ্যাডলফাস কাসিনস গ্রিকের অধ্যাপক। আন্ডারশাফট সালভেশন আর্মিতে এসে বিপুল অর্থ দান করেন—অস্ত্র ও মদের ব্যবসার টাকা; বারবারা বিভ্রান্ত, বুঝতে পারে সংস্থা সেই টাকাই নিচ্ছে। সে ব্যবসায়ী পিতার আদর্শ-পরীক্ষা করে। শেষে আন্ডারশাফটের কারখানার শ্রমিকদের আধ্যাত্মিক উন্নতিতে সে কাজ করার সিদ্ধান্ত নেয়, আর কাসিনস কারখানার উত্তরাধিকারী হয়।",
th:"দারিদ্র্য ও নৈতিকতা, ধর্ম ও অর্থ, যুদ্ধের ব্যবসা, সমাজের ভণ্ডামি।"},
{t:"Candida",w:"G. B. Shaw (নাটক)",ch:"Candida, Rev. James Morell, Eugene Marchbanks, Mr. Burgess, Prossy",
s:"লন্ডনের খ্রিস্টান সমাজতন্ত্রী পাদ্রি জেমস মোরেল ও তাঁর স্ত্রী ক্যান্ডিডার সুখী সংসার। আঠারো বছরের স্পর্শকাতর তরুণ কবি ইউজিন মার্চব্যাংকস ক্যান্ডিডার প্রেমে পড়ে এবং মোরেলের আদর্শকে নিন্দা করে। মোরেলের আত্মবিশ্বাস নড়ে যায়। দুই পুরুষ ক্যান্ডিডাকে বেছে নিতে বলে। ক্যান্ডিডা বলে—'আমি দুর্বলতরকে বেছে নেব'; সবাই ভাবে সে ইউজিনকে নেবে, কিন্তু সে স্বামীকে বেছে নেয়, কারণ মোরেল নিজের সম্পর্কের ওপর নির্ভরশীল। ইউজিন বুঝে ফেলে তার দুঃখ থেকেই তার কবিতা, 'একা'ই তার শক্তি—সে ক্যান্ডিডার ছায়া থেকে চলে যায়।",
th:"দাম্পত্য ও আত্মসম্মান, নারীর নেতৃত্ব, শিল্পী ও সমাজের সম্পর্ক।"},
{t:"Mrs. Warren's Profession",w:"G. B. Shaw (নাটক)",ch:"Vivie Warren, Mrs. Kitty Warren, Sir George Crofts, Praed, Frank Gardner, Rev. Gardner",
s:"কেমব্রিজ-শিক্ষিত বুদ্ধিমতী ভিভি ওয়ারেন মা মিসেস ওয়ারেনের পেশা সম্পর্কে কিছুই জানত না। ধীরে সে আবিষ্কার করে, তার মা ইউরোপজুড়ে বেশ্যালয় চালিয়ে ধনী হয়েছেন এবং তাঁর অংশীদার সম্মানিত ধনী স্যার জর্জ ক্রফটস। মা যুক্তি দেন, দরিদ্র মেয়ের জন্য সম্মানজনক বিকল্প বলতে প্রায় কিছুই ছিল না; আর সমাজই তাকে এই পথে ঠেলেছে। ভিভি প্রথমে মাকে বোঝে, কিন্তু যখন জানতে পারে মা এখনো সেই ব্যবসা চালাচ্ছেন, সে সম্পর্ক ছিন্ন করে। শেষে সে লন্ডনে নিজের পেশায় কাজ শুরু করে, টাকা বা পরিবারের ওপর নির্ভর না করে।",
th:"নারীর অর্থনৈতিক বাস্তবতা, সমাজের ভণ্ডামি, স্বাধীনতা ও পারিবারিক বন্ধন।"},
{t:"Oliver Twist",w:"Charles Dickens (উপন্যাস)",ch:"Oliver Twist, Fagin, Bill Sikes, Nancy, Artful Dodger, Mr. Brownlow, Rose Maylie, Monks, Mr. Bumble",
s:"ওয়ার্কহাউসে জন্ম নেওয়া অনাথ অলিভার ক্ষুধার্ত অবস্থায় বাড়তি খাবার চাওয়ার সাহস করে—'Please, sir, I want some more'—ফলে তাকে শাস্তি দেওয়া হয়। তাকে শবযাত্রা-ব্যবসায়ী সাওয়ারবেরির কাছে শিক্ষানবিস করা হয়, কিন্তু নির্যাতনে সে লন্ডনে পালায়। সেখানে আর্টফুল ডজার তাকে ইহুদি ফেগিনের কাছে নিয়ে যায়—ফেগিন শিশুদের পকেটমার বানায়। চুরির দায়ে ধরা পড়লে দয়ালু মিস্টার ব্রাউনলো তাকে আশ্রয় দেন। ফেগিন ও দুর্বৃত্ত বিল সাইকস তাকে আবার অপহরণ করে এবং ডাকাতিতে বাধ্য করে; গুলিবিদ্ধ অলিভারকে রোজ মেইলি ও তার পরিবার সুস্থ করে। নান্সি সত্য ফাঁস করার চেষ্টা করলে সাইকস তাকে খুন করে; পালানোর সময় সাইকস মারা যায়, ফেগিনের ফাঁসি হয়। শেষে জানা যায়, অলিভার সম্ভ্রান্ত বংশের সন্তান; মিস্টার ব্রাউনলো তাকে দত্তক নেন।",
th:"শিশুদের প্রতি সমাজের নিষ্ঠুরতা, দারিদ্র্য ও অপরাধ, ওয়ার্কহাউস ব্যবস্থার সমালোচনা, ভালো বনাম মন্দ।"},
{t:"David Copperfield",w:"Charles Dickens (আত্মজীবনীমূলক উপন্যাস)",ch:"David Copperfield, Betsey Trotwood, Mr. Micawber, Uriah Heep, Steerforth, Dora, Agnes, Peggotty, Murdstone",
s:"পিতার মৃত্যুর পর জন্ম নেওয়া ডেভিড মা ক্লারা ও দাই পেগোটির স্নেহে বড় হয়। মা নিষ্ঠুর মিস্টার মার্ডস্টোনকে বিয়ে করলে ডেভিডের জীবন দুঃসহ হয়; তাকে বোর্ডিং স্কুল সালেম হাউসে ও পরে লন্ডনের বোতল-কারখানায় কাজে পাঠানো হয়। সেখানে সে মিকবারদের সঙ্গে থাকে। অসহ্য হয়ে সে পায়ে হেঁটে ডোভারে পিসি বেটসি ট্রটউডের কাছে পৌঁছায়। পিসি তাকে স্কুলে দেন; সে উকিল উইকফিল্ডের বাড়িতে থেকে মেয়ে অ্যাগনেসের বন্ধু হয়। ধূর্ত উরিয়া হিপ উইকফিল্ডকে ঠকাতে চায়। ডেভিড ডোরাকে বিয়ে করে, কিন্তু ডোরা মারা যায়। ডেভিডের বন্ধু স্টিয়ারফোর্থ ছোট এমিলিকে নিয়ে পালায় ও পরে জাহাজডুবিতে মারা যায়। শেষে মিকবার হিপের প্রতারণা ফাঁস করে। ডেভিড খ্যাতিমান লেখক হয়ে অ্যাগনেসকে বিয়ে করে।",
th:"শৈশবের কষ্ট ও আত্মগঠন, সততা বনাম ভণ্ডামি, প্রেম ও পরিণত ভালোবাসা, আত্মজীবনীর ছাপ।"},
{t:"A Christmas Carol",w:"Charles Dickens (নভেলা)",ch:"Ebenezer Scrooge, Bob Cratchit, Tiny Tim, Jacob Marley, Fred, Three Ghosts",
s:"বৃদ্ধ কৃপণ এবেনেজার স্ক্রুজ বড়দিনকে 'Humbug' বলে ঘৃণা করে, কর্মচারী বব ক্র্যাচিটকে সামান্য বেতন দেয় ও ভাগ্নে ফ্রেডের নিমন্ত্রণ উড়িয়ে দেয়। বড়দিনের আগের রাতে তার মৃত সহযোগী জ্যাকব মার্লির প্রেত শিকলবাঁধা অবস্থায় এসে সতর্ক করে—স্ক্রুজের জন্য তিন প্রেত আসবে। Ghost of Christmas Past তাকে শৈশব, কর্মজীবন ও হারিয়ে ফেলা প্রেম বেলকে দেখায়। Ghost of Christmas Present তাকে ক্র্যাচিটদের দরিদ্র কিন্তু আনন্দময় বড়দিন ও অসুস্থ শিশু টিনি টিম দেখায়। Ghost of Christmas Yet to Come তাকে এক নিঃসঙ্গ মানুষের মৃত্যু ও কবর দেখায়—যাকে কেউ শোক করে না; সে বুঝে নিজের কবর। জেগে স্ক্রুজ আনন্দে বদলে যায়—ক্র্যাচিটের বেতন বাড়ায়, টিনি টিমের দায়িত্ব নেয় ও ফ্রেডের সঙ্গে বড়দিন কাটায়।",
th:"পরিবর্তন ও মুক্তি, দয়া ও উদারতা, লোভ বনাম মানবিকতা, বড়দিনের আনন্দ। ('God bless us, every one')"},
{t:"The Pickwick Papers",w:"Charles Dickens (ধারাবাহিক উপন্যাস)",ch:"Samuel Pickwick, Sam Weller, Tracy Tupman, Nathaniel Winkle, Augustus Snodgrass, Mrs. Bardell, Jingle",
s:"কাহিনিটি ডিকেন্সের প্রথম উপন্যাস, ধারাবাহিকভাবে প্রকাশিত। পিকউইক ক্লাবের প্রতিষ্ঠাতা সদাশয় ও সরল মিস্টার পিকউইক তাঁর তিন সঙ্গী—টাপম্যান, উইংকল ও স্নডগ্রাস—ইংল্যান্ডের নানা অঞ্চলে ভ্রমণে বের হন। পথে ধূর্ত জিংগল তাদের ঠকায়, নানা হাস্যকর বিপদ-ঘটনা ঘটে। তাঁর বিশ্বস্ত ও রসিক চাকর স্যাম ওয়েলার সঙ্গে যোগ দেয়। বাড়িওয়ালি মিসেস বারডেল ভুল বুঝে পিকউইকের বিরুদ্ধে বিয়ের প্রতিশ্রুতি ভঙ্গের মামলা করেন। আদালতে পিকউইক হেরে যান এবং ক্ষতিপূরণ দিতে অস্বীকার করে ফ্লিট কারাগারে যান। সেখানে কারা-অবস্থার দুর্দশা দেখে বদলে যান। শেষে ঋণ মিটিয়ে সবাইকে ক্ষমা করেন।",
th:"হাস্যরস ও ব্যঙ্গ, সদাশয়তা, আইনব্যবস্থা ও কারাগারের সমালোচনা, ভ্রমণ-কাহিনি।"},
{t:"Martin Chuzzlewit",w:"Charles Dickens (উপন্যাস)",ch:"Old Martin Chuzzlewit, Young Martin, Seth Pecksniff, Tom Pinch, Jonas Chuzzlewit, Mark Tapley, Mrs. Gamp",
s:"ধনী বৃদ্ধ মার্টিন চাজলউইট আত্মীয়দের লোভী মনে করে তাদের থেকে দূরে থাকেন। তাঁর নাতি তরুণ মার্টিন প্রেমের জন্য দাদুকে অসন্তুষ্ট করে আর্কিটেক্ট পেকসনিফের অধীনে কাজ শুরু করে। পেকসনিফ ভণ্ড ধর্মপ্রাণ মানুষ, বাইরে সজ্জন কিন্তু ভেতরে লোভী। সরল টম পিঞ্চ তাঁর অন্ধ ভক্ত। তরুণ মার্টিন ভাগ্য ফেরাতে বিশ্বস্ত ভৃত্য মার্ক ট্যাপলিকে নিয়ে আমেরিকায় যায়, কিন্তু সেখানে দুর্দশায় পড়ে। দেশে ফিরে সে জানতে পারে দাদু আসলে ছদ্মবেশে পেকসনিফের ভণ্ডামি পরীক্ষা করছিলেন। জোনাস নামের নিষ্ঠুর আত্মীয় খুনের দায়ে ধরা পড়ে আত্মহত্যা করে। পেকসনিফের মুখোশ খুলে যায়; তরুণ মার্টিন মেরি গ্রাহামকে বিয়ে করে। 'Charity begins at home'-এর বাণী পেকসনিফের ভণ্ডামির প্রতীক।",
th:"স্বার্থপরতা ও ভণ্ডামি, সৎ মানুষের জয়, আমেরিকা ও ইংল্যান্ডের সমাজের ব্যঙ্গ।"},
{t:"Bleak House",w:"Charles Dickens (উপন্যাস)",ch:"Esther Summerson, John Jarndyce, Ada Clare, Richard Carstone, Lady Dedlock, Tulkinghorn, Inspector Bucket",
s:"'Jarndyce and Jarndyce' নামের এক দশকের পর দশক চলা উত্তরাধিকার-মামলা আদালতে ঝুলে আছে; এতে জড়িত মানুষরা ধীরে ধীরে ধ্বংস হয়। অনাথ এস্টার সামারসন, অভিভাবক জন জার্নডাইসের আশ্রিত, উপন্যাসের অর্ধেক অংশের কথক। অ্যাডা ও রিচার্ড মামলার সূত্রে জার্নডাইসের আশ্রয়ে আসে; রিচার্ড মামলায় জেতার আশায় ক্ষয়ে যায়। অপর দিকে লেডি ডেডলকের গোপন অতীত আছে—এস্টার আসলে তাঁর অবৈধ সন্তান। উকিল টালকিংহর্ন সেই গোপন তথ্য জেনে লেডিকে ব্ল্যাকমেইল করে এবং খুন হয়। ইন্সপেক্টর বাকেট রহস্যের জট খোলেন। লেডি ডেডলক মারা যান; মামলা শেষ পর্যন্ত খরচেই ফুরিয়ে যায়। এস্টার ডাক্তার উডকোর্টকে বিয়ে করে।",
th:"আইনব্যবস্থার ধীরগতি ও দুর্নীতি, শ্রেণিবৈষম্য, গোপন পাপ ও পরিণতি, ভিক্টোরীয় সমাজের সমালোচনা।"},
{t:"Adam Bede",w:"George Eliot (উপন্যাস)",ch:"Adam Bede, Hetty Sorrel, Arthur Donnithorne, Dinah Morris, Seth Bede, Mrs. Poyser",
s:"১৭৯৯ সালে হেলসলোর গ্রামে সৎ ও পরিশ্রমী কাঠমিস্ত্রি অ্যাডাম বিড সুন্দরী কিন্তু অগভীর স্বভাবের হেটি সোরেলকে ভালোবাসে। হেটি ধনী জমিদারপুত্র ক্যাপ্টেন আর্থার ডনিথর্নের প্রেমে পড়ে; আর্থার তাকে প্রতারণা করে সরে যায়। হেটি গর্ভবতী হয়ে ঘর ছাড়ে, সন্তান জন্ম দিয়ে ভয়ে ফেলে আসে; শিশুটি মারা যায় এবং হেটি শিশু-হত্যার দায়ে মৃত্যুদণ্ডের মুখে পড়ে। শেষ মুহূর্তে আর্থার ফিরে এসে দণ্ড লঘু করে নির্বাসনে বদলায়। মেথডিস্ট প্রচারক ডাইনা মরিস হেটিকে সান্ত্বনা দেয়। পরে অ্যাডাম সেই ডাইনার ভালোবাসা ও নৈতিক শক্তিতে মুগ্ধ হয়ে তাকে বিয়ে করে।",
th:"নৈতিক দায় ও পরিণতি, অনুশোচনা ও ক্ষমা, গ্রামীণ জীবন ও শ্রমের মর্যাদা।"},
{t:"The Mill on the Floss",w:"George Eliot (উপন্যাস)",ch:"Maggie Tulliver, Tom Tulliver, Mr. Tulliver, Philip Wakem, Stephen Guest, Lucy Deane",
s:"ফ্লস নদীর তীরে মিলের মালিক মিস্টার টালিভারের ছেলে টম ও মেয়ে ম্যাগি। ম্যাগি আবেগপ্রবণ ও বুদ্ধিমতী, টম কঠোর ও নীতিনিষ্ঠ। মামলায় মিস্টার টালিভার হেরে গিয়ে মিল ও সম্পত্তি হারান এবং শত্রু উকিল ওয়াকেমের কাছে ঋণী হয়ে অসুস্থ হন। ম্যাগি ওয়াকেমের ছেলে বিকলাঙ্গ ফিলিপের সঙ্গে গোপন বন্ধুত্ব করে; টম তা জেনে ভয়ানক ক্রুদ্ধ হয়। টম পরিশ্রম করে ঋণ শোধ ও মিল ফেরত পায়। পরে ম্যাগি তার কাজিন লুসির বাগদত্তা স্টিফেন গেস্টের আকর্ষণে জড়ালে সমাজে কলঙ্ক ছড়ায়, টম তাকে বাড়ি থেকে তাড়ায়। বন্যার রাতে ম্যাগি নৌকায় ভাইকে বাঁচাতে যায়; দুই ভাই-বোন একে অপরকে জড়িয়ে ধরে একসঙ্গে ডুবে মারা যায়।",
th:"ভাই-বোনের সম্পর্ক, আবেগ বনাম সামাজিক রীতি, নারীর স্বাধীন ইচ্ছার সংঘর্ষ, গ্রামীণ সমাজের কঠোরতা।"},
{t:"Middlemarch",w:"George Eliot (উপন্যাস)",ch:"Dorothea Brooke, Edward Casaubon, Will Ladislaw, Tertius Lydgate, Rosamond Vincy, Fred Vincy, Mary Garth, Bulstrode",
s:"মিডলমার্চ নামের মফস্সল শহরে মহৎ আদর্শবাদী তরুণী ডরোথিয়া ব্রুক শুষ্ক বৃদ্ধ পণ্ডিত ক্যাসাউবনকে বিয়ে করে, ভেবে যে সে তাঁর মহৎ গবেষণায় সহায়তা করবে; কিন্তু বিয়ে নিরানন্দ হয়। ক্যাসাউবনের তরুণ কাজিন উইল লাডিসলোর প্রতি ডরোথিয়ার আকর্ষণ জন্মায়। ক্যাসাউবন মারা গেলে উইলে শর্ত থাকে—ডরোথিয়া উইলকে বিয়ে করলে সম্পত্তি হারাবে। অন্য কাহিনিতে ডাক্তার লিডগেট সুন্দরী কিন্তু ভোগবাদী রোজামন্ডকে বিয়ে করে ঋণে ডুবে আদর্শ হারায়। ব্যাংকার বুলস্ট্রোডের গোপন অতীত ফাঁস হয়ে সমাজচ্যুত হয়। ফ্রেড ভিন্সি শেষে সৎ মেরি গার্থকে বিয়ে করে। ডরোথিয়া সম্পত্তি ছেড়ে উইলকে বিয়ে করে।",
th:"আদর্শ বনাম বাস্তবতা, বিবাহ ও নৈতিকতা, মফস্সল সমাজ ও সংস্কার, নারীর সামর্থ্যের সীমাবদ্ধতা।"},
{t:"Daniel Deronda",w:"George Eliot (উপন্যাস)",ch:"Daniel Deronda, Gwendolen Harleth, Mirah, Henleigh Grandcourt, Mordecai, Sir Hugo Mallinger",
s:"অনাথ ড্যানিয়েল ডেরোন্ডা ধনী স্যার হিউগোর আশ্রয়ে ইংরেজ ভদ্রলোক হিসেবে বড় হয়, নিজের আসল পরিচয় জানে না। অহংকারী গোয়েনডলেন হারলেথ আর্থিক সংকটে পড়ে নিষ্ঠুর ও নিয়ন্ত্রণকারী গ্র্যান্ডকোর্টকে বিয়ে করে; বিয়ে তাকে শ্বাসরুদ্ধকর করে তোলে। ড্যানিয়েল গোয়েনডলেনকে নৈতিক পথ দেখায়। অন্যদিকে সে আত্মহত্যায় উদ্যত ইহুদি তরুণী মিরাকে বাঁচিয়ে তার পরিবারকে খুঁজতে সাহায্য করে এবং মিরার ভাই মর্ডেকাইয়ের সংস্পর্শে আসে। এক সময় সে জানতে পারে সে নিজেও জন্মসূত্রে ইহুদি। গ্র্যান্ডকোর্ট জলে ডুবে মরে। ড্যানিয়েল মিরাকে বিয়ে করে ইহুদি জাতির স্বদেশ ভাবনায় পূর্ব দিকে যাত্রা করে; গোয়েনডলেন একা থেকে যায়।",
th:"পরিচয় ও আত্ম-অন্বেষণ, ইহুদি স্বদেশভাবনা ও বর্ণবৈষম্য, নৈতিক দায়িত্ব, অসুখী বিবাহ।"},
{t:"Easter 1916",w:"W. B. Yeats (কবিতা)",ch:"কবি, MacDonagh, Pearse, Connolly, Constance Markievicz, MacBride",
s:"১৯১৬ সালের ইস্টারে ডাবলিনে আইরিশ বিদ্রোহীরা ব্রিটিশ শাসনের বিরুদ্ধে বিদ্রোহ করে এবং কয়েক দিন পর পরাজিত হয়ে নেতারা মৃত্যুদণ্ড পান। কবি স্বীকার করেন, আগে তিনি এই লোকদের পথে-ঘাটে দেখে ভদ্রতার বাইরে কিছু ভাবেননি, কখনো তাদের নিয়ে ঠাট্টাও করেছেন। কিন্তু বিদ্রোহের পর সবকিছু বদলে গেছে—'All changed, changed utterly: a terrible beauty is born'। তিনি একে একে চরিত্র—শিক্ষক পিয়ার্স, কবি ম্যাকডোনাঘ, কনস্ট্যান্স মার্কিয়েভিচ ও মাক ব্রাইড—স্মরণ করেন। দীর্ঘ আত্মত্যাগে হৃদয় পাথর হয়ে যেতে পারে, তবু কবি তাঁদের নাম অমর করে রাখেন।",
th:"আত্মত্যাগ ও বীরত্ব, জাতীয়তাবাদ, রূপান্তর ও 'terrible beauty', Paradox।"},
{t:"Sailing to Byzantium",w:"W. B. Yeats (কবিতা)",ch:"কবি (বৃদ্ধ), Byzantine sages, Golden bird",
s:"কবি বলেন, 'That is no country for the old'—আয়ারল্যান্ড ও তার ইন্দ্রিয়সুখে ভরা, তরুণদের জগৎ, যেখানে বৃদ্ধদের জায়গা নেই। বৃদ্ধ মানুষ নিছক 'a tattered coat upon a stick', যদি না তার আত্মা আনন্দে গান গায়। আত্মাকে গান শেখানোর জন্য কবি বাইজেন্টিয়ামে (সুবর্ণ শিল্পের নগরী) যাত্রা করেন। তিনি স্বর্ণ-মোজাইকে আঁকা সাধুদের কাছে প্রার্থনা করেন—তাঁর হৃদয়কে, যা কামনায় ক্ষয়ে যাচ্ছে, পরিশুদ্ধ করতে এবং 'artifice of eternity'-তে মিশিয়ে নিতে। মৃত্যুর পর তিনি আর প্রকৃতির দেহ চান না, চান সোনার পাখির রূপ, যা সম্রাটদের কাছে অতীত, বর্তমান ও ভবিষ্যতের গান গাইবে।",
th:"শিল্পের অমরত্ব বনাম মানুষের নশ্বরতা, বার্ধক্য, আত্মার মুক্তি।"},
{t:"The Lake Isle of Innisfree",w:"W. B. Yeats (কবিতা)",ch:"কবি",
s:"কবি লন্ডনের ধূসর ফুটপাতে দাঁড়িয়ে বলেন—'I will arise and go now'—তিনি ফিরে যাবেন স্লাইগোর হ্রদের ছোট্ট দ্বীপ ইনিসফ্রিতে। সেখানে তিনি কাদামাটি ও লতাপাতা দিয়ে ছোট কুটির বানাবেন, নয় সারি শিম লাগাবেন, মৌচাক পালবেন এবং একা বাস করবেন। সেখানে 'peace comes dropping slow', সকালের কুয়াশা থেকে ঝিঁঝিঁর গান পর্যন্ত। মধ্যরাতে ঝলমলে আলো, দুপুরে বেগুনি আভা, সন্ধ্যায় লিনেট পাখির ডানার শব্দ। কবি শেষ পর্যন্ত জানান, তিনি রাস্তার ধূসর ফুটপাতে দাঁড়িয়েও হ্রদের ঢেউয়ের মৃদু শব্দ 'in the deep heart's core' শুনতে পান।",
th:"নগর-জীবন থেকে প্রকৃতিতে পলায়ন, শান্তি ও সরলতার আকাঙ্ক্ষা, স্মৃতি ও কল্পনা।"},
{t:"The Wild Swans at Coole",w:"W. B. Yeats (কবিতা)",ch:"কবি, বুনো রাজহাঁস",
s:"শরৎকালে কুল পার্কের হ্রদে ৫৯টি রাজহাঁস ভাসছে। কবি ১৯ বছর আগে প্রথম এসে এদের গুনতে শুরু করেছিলেন; তখন হঠাৎ তারা বিশাল শব্দ করে আকাশে উড়ে গিয়েছিল। তখন কবির হৃদয় হালকা ছিল, আজ তিনি ক্লান্ত ও দুঃখিত; সময়ের সঙ্গে সবই বদলে গেছে। কিন্তু রাজহাঁসগুলো ক্লান্তিহীন—জোড়ায় জোড়ায় ঠান্ডা হ্রদে ভেসে, ডানা মেলে, তাদের হৃদয় বুড়ো হয়নি। কবি আশঙ্কা করেন, কোনো দিন জেগে উঠে তিনি দেখবেন তারা উড়ে চলে গেছে, আর তখন কোন মানুষের চোখ তাদের সৌন্দর্য দেখবে।",
th:"সময়ের প্রবাহ ও বার্ধক্য, প্রকৃতির অমরত্ব বনাম মানুষের ক্ষণস্থায়িত্ব, বিষণ্ণতা ও সৌন্দর্য।"},
{t:"When You Are Old",w:"W. B. Yeats (কবিতা)",ch:"কবি, Beloved (Maud Gonne-কে উদ্দেশ্য করে)",
s:"কবি তাঁর প্রিয়াকে বলেন—যখন তুমি বৃদ্ধ হবে, চুল সাদা হবে এবং আগুনের পাশে ঘুমে ঢুলবে, তখন এই বইটি নামিয়ে ধীরে ধীরে পড়ো এবং কল্পনা করো তোমার চোখের একদিনের কোমলতা ও গভীর ছায়া। তোমার যৌবনে অনেকে তোমার আনন্দময় সৌন্দর্যকে ভালোবেসেছে, কেউ কেউ সত্যিকার প্রেম নিয়ে বা মিথ্যা ভালোবেসেছে; কিন্তু একজন কেবল 'the pilgrim soul in you' ও 'the sorrows of your changing face'-কে ভালোবেসেছিল। তখন তুমি আগুনের পাশে বসে দুঃখের সঙ্গে ভাবো, ভালোবাসা কীভাবে পাহাড়ের চূড়ায় উড়ে গিয়ে তারাদের ভিড়ে মুখ লুকিয়েছে।",
th:"সত্যিকারের প্রেম বনাম বাহ্যিক সৌন্দর্য, সময় ও বার্ধক্য, অপ্রাপ্ত ভালোবাসার বেদনা।"},
{t:"Leda and the Swan",w:"W. B. Yeats (সনেট)",ch:"Leda, Zeus (রাজহংসরূপে), Helen, Agamemnon",
s:"গ্রিক পুরাণ অনুযায়ী দেবরাজ জিউস রাজহাঁসের রূপ ধরে স্পার্টার রানি লেডার ওপর জোরপূর্বক সহবাস করেন—'A sudden blow: the great wings beating still above the staggering girl'। এই মিলন থেকে জন্ম নেয় হেলেন, যার জন্য পরে ট্রয় যুদ্ধ বাধে। কবিতার দ্বিতীয় অংশে ইয়েটস সেই যুদ্ধ ও পরিণতির ছবি আনেন—'the broken wall, the burning roof and tower and Agamemnon dead'। শেষ প্রশ্নে কবি জানতে চান, লেডা কি দেবতার সেই ক্ষমতার সঙ্গে জ্ঞানও অর্জন করেছিল, ঠোঁট তাকে ছেড়ে দেওয়ার আগে? ইয়েটসের মতে একটি দৈব ঘটনা ইতিহাসের নতুন যুগ শুরু করে।",
th:"ইতিহাসের চক্র, দৈব ও মানবের সম্পর্ক, ক্ষমতা ও সহিংসতা, মিথের প্রতীকী ব্যবহার।"},
{t:"The Canonization",w:"John Donne (কবিতা)",ch:"কবি, সমালোচক ও সমাজ (কল্পিত শ্রোতা), প্রেমিক-প্রেমিকা",
s:"কবি অধৈর্য হয়ে শুরু করেন—'For God's sake, hold your tongue, and let me love'। তাঁর প্রেমে কারো ক্ষতি হয় না: তাঁর দীর্ঘশ্বাসে জাহাজ ডোবে না, চোখের জলে মাঠ ভেসে যায় না, তাঁর জ্বরে শহরে মহামারি ছড়ায় না। সৈনিক যুদ্ধ খোঁজে, আইনজীবী মামলাকারী খোঁজে—তারা নিজেদের কাজ করুক, তিনি প্রেম করবেন। এরপর কবি প্রেমিক-প্রেমিকাকে মোম-মোমবাতি, ঈগল ও কপোত এবং বিশেষ করে ফিনিক্স পাখির সঙ্গে তুলনা করেন—যারা দুইয়ে মিলে এক সত্তা, মৃত্যু ও পুনর্জন্মের প্রতীক। শেষে তিনি বলেন, লোকে ভবিষ্যতে তাঁদের প্রেমকে 'canonize' করবে (সন্ত ঘোষণা করবে); পরবর্তীরা তাঁদের কাছে প্রেমের আদর্শ খুঁজবে।",
th:"প্রেমের পবিত্রতা ও ধর্মীয় রূপক, মেটাফিজিক্যাল conceit, সমাজের অবজ্ঞা বনাম প্রেমের জগৎ।"},
{t:"The Good Morrow",w:"John Donne (কবিতা)",ch:"কবি, প্রেয়সী",
s:"কবি ঘুম থেকে জেগে প্রেয়সীকে প্রশ্ন করেন—'I wonder, by my troth, what thou and I did, till we loved?' ভালোবাসার আগে তাঁরা কি শিশুর মতো ছিলেন, না কি 'seven sleepers' den'-এ ঘুমিয়ে ছিলেন? এখন তাঁদের আত্মা জেগেছে; ভালোবাসা অন্য সব বাহ্যিক ভালোবাসাকে নিয়ন্ত্রণ করে, আর 'one little room an everywhere'—একটি ছোট ঘরই সারা পৃথিবী হয়ে ওঠে। অন্যরা নতুন পৃথিবী আবিষ্কারে যাক, তাঁদের কাছে একে অপরই পৃথিবী। প্রত্যেকের চোখে অপরের মুখের ছায়া—দুটি গোলার্ধ যার কোনো উত্তর বা পশ্চিম নেই। শেষে কবি বলেন, যে ভালোবাসা সমান ও অটুট, তা কখনো মরে না।",
th:"প্রেমের পূর্ণতা ও বিশ্বজনীনতা, প্রেমে আত্মার জাগরণ, মেটাফিজিক্যাল কল্পনা (map, hemispheres)।"},
{t:"A Valediction: Forbidding Mourning",w:"John Donne (কবিতা)",ch:"কবি, স্ত্রী (Anne More)",

/* ---------------- STATE & HELPERS ---------------- */
const Q=RAW.map((r,i)=>Object.assign({id:i},r));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let BM=new Set(load("bcsq_bm",[]));
function saveBM(){save("bcsq_bm",[...BM]);$("#bmcnt").textContent=BM.size}
function toggleBM(id){BM.has(id)?BM.delete(id):BM.add(id);saveBM()}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sp=q=>q.c?q.c.replace(/ to .*$/,""):q.a;
const AUTHORS=[...new Set(Q.map(q=>q.a))];
const SOURCES=[...new Set(Q.filter(q=>q.s).map(q=>q.s))];

function quoteCard(q,opts){
  opts=opts||{};
  const on=BM.has(q.id);
  return `<div class="card" data-id="${q.id}">
  <p class="q-text">&ldquo;${esc(q.q)}&rdquo;</p>
  ${q.b?`<p class="q-bn bn">${esc(q.b)}</p>`:""}
  <div class="meta">
    <span class="who${q.c?"":" lnk"}" ${q.c?"":`data-au="${esc(q.a)}" title="লেখকের জীবনী দেখুন"`}>${esc(q.c||q.a)}</span>
    ${q.c&&q.a?`<span class="small lnk" data-au="${esc(q.a)}" title="লেখকের জীবনী দেখুন">— ${esc(q.a)}</span>`:""}
    ${q.s?(hasStory(q.s)?`<span class="src lnk" data-st="${esc(q.s)}" title="গল্প সারাংশ দেখুন">${esc(q.s)} ›</span>`:`<span class="src">${esc(q.s)}</span>`):""}
    ${q.n?(findTerm(q.n)?`<span class="note lnk" data-term="${esc(q.n)}" title="টার্মের মানে দেখুন">${esc(q.n)} ?</span>`:`<span class="note">${esc(q.n)}</span>`):""}
    <button class="rd ${isRead(q.id)?"on":""}" data-rd="${q.id}">${isRead(q.id)?"✓ পড়া হয়েছে":"○ পড়া হয়েছে মার্ক করুন"}</button>
    <button class="bm ${on?"on":""}" data-bm="${q.id}">${on?"★ Bookmarked":"☆ Bookmark"}</button>
  </div></div>`;
}

/* ---------------- NAV ---------------- */
let view="browse";
const NAVH=[];let BR_STATE=null;
function snapNav(){
  const ex={};
  if(view==="browse"&&$("#srch")){ex.br={s:$("#srch").value,fa:$("#fa").value,fs:$("#fs").value}}
  if(view==="practice"&&P)ex.P=P;
  if(view==="stories")ex.sa=STORY_AUTH;
  if(view==="bios")ex.bs=BIO_SEL;
  return ex;
}
function updateBack(){const b=$("#backbtn");if(b)b.style.display=NAVH.length?"block":"none"}
function goBack(){
  const h=NAVH.pop();if(!h){updateBack();return}
  if(h.ex.br)BR_STATE=h.ex.br;
  if(h.ex.sa!==undefined)STORY_AUTH=h.ex.sa;
  if(h.ex.bs!==undefined)BIO_SEL=h.ex.bs;
  go(h.v,true);
  if(h.ex.P){P=h.ex.P;drawPractice()}
  setTimeout(()=>window.scrollTo(0,h.y),0);
}
function go(v,isBack){
  if(!isBack&&v!==view){NAVH.push({v:view,y:window.scrollY,ex:snapNav()});if(NAVH.length>40)NAVH.shift()}
  view=v;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  stopTimer();updateStrip();
  ({browse:viewBrowse,practice:viewPractice,exam:viewExam,bookmarks:viewBookmarks,stories:viewStories,bios:viewBios,target:viewTarget,terms:viewTerms})[v]();
  window.scrollTo(0,0);
  updateBack();
}
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(b.dataset.v)});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-bm]");
  if(b){const id=+b.dataset.bm;toggleBM(id);
    const on=BM.has(id);
    document.querySelectorAll(`[data-bm="${id}"]`).forEach(x=>{x.classList.toggle("on",on);x.textContent=on?"★ Bookmarked":"☆ Bookmark"});
    if(view==="bookmarks"&&!on&&!b.closest(".practice-card")){viewBookmarks()}
  }
});

/* ---------------- BROWSE ---------------- */
function viewBrowse(){
  const authorOpts=AUTHORS.map(a=>`<option>${esc(a)}</option>`).join("");
  $("#app").innerHTML=`
  <div class="tools">
    <input type="text" id="srch" placeholder="Search quote, character, writer, work or Bangla…">
    <select id="fa"><option value="">All writers</option>${authorOpts}</select>
    <select id="fs"><option value="">All works</option></select>
  </div>
  <p class="small" id="cnt"></p><div id="list"></div>`;
  const fa=$("#fa"),fs=$("#fs"),sr=$("#srch");
  function fillSources(){
    const a=fa.value;
    const srcs=[...new Set(Q.filter(q=>q.s&&(!a||q.a===a)).map(q=>q.s))];
    fs.innerHTML=`<option value="">All works</option>`+srcs.map(s=>`<option>${esc(s)}</option>`).join("");
  }
  function draw(){
    const t=sr.value.trim().toLowerCase();
    const res=Q.filter(q=>(!fa.value||q.a===fa.value)&&(!fs.value||q.s===fs.value)&&
      (!t||(q.q+" "+q.b+" "+q.c+" "+q.a+" "+q.s).toLowerCase().includes(t)));
    $("#cnt").textContent=`${res.length} of ${Q.length} quotations`;
    $("#list").innerHTML=res.length?res.map(q=>quoteCard(q)).join(""):`<div class="empty">No quotation found.</div>`;
  }
  fa.onchange=()=>{fillSources();draw()};fs.onchange=draw;sr.oninput=draw;
  if(PRE_AUTH){fa.value=PRE_AUTH;PRE_AUTH=""}
  fillSources();
  if(BR_STATE){sr.value=BR_STATE.s;fa.value=BR_STATE.fa;fillSources();fs.value=BR_STATE.fs;BR_STATE=null}
  draw();
}

/* ---------------- QUESTION GENERATION ---------------- */
const TYPE_LABEL={w:"Who is the writer of this quotation?",s:"From which work is this quotation taken?",c:"Who speaks this line (character)?"};
function validTypes(q){
  const t=[];
  if(q.a!==SH)t.push("w");
  if(q.s)t.push("s");
  if(q.c&&q.a===SH)t.push("c");
  return t;
}
function pickDistractors(q,type,correct){
  let pool=[];
  if(type==="w")pool=AUTHORS.filter(a=>a!==SH||false);
  if(type==="s"){
    const same=[...new Set(Q.filter(x=>x.a===q.a&&x.s).map(x=>x.s))];
    pool=shuffle(same).concat(shuffle(SOURCES));
  }
  if(type==="c"){
    const same=[...new Set(Q.filter(x=>x.s===q.s&&x.c).map(sp))];
    const all=[...new Set(Q.filter(x=>x.c&&x.a===SH).map(sp))];
    pool=shuffle(same).concat(shuffle(all));
  }
  if(type==="w")pool=shuffle(pool);
  const out=[];
  for(const p of pool){if(p!==correct&&!out.includes(p))out.push(p);if(out.length===3)break}
  return out;
}
function makeQuestion(q,forceType){
  const types=validTypes(q);
  const type=forceType&&types.includes(forceType)?forceType:types[Math.floor(Math.random()*types.length)];
  const correct=type==="w"?q.a:type==="s"?q.s:sp(q);
  const opts=shuffle([correct,...pickDistractors(q,type,correct)]);
  return {id:q.id,type,correct,opts,sel:null};
}

let P=null;
function scopeSelect(id){
  return `<select id="${id}"><option value="all">All quotations</option><option value="bm">Bookmarked only</option>`+
   `<option value="SH">Shakespeare (all plays)</option>`+
   AUTHORS.filter(a=>a!==SH).map(a=>`<option value="a:${esc(a)}">${esc(a)}</option>`).join("")+`</select>`;
}
function scopePool(v){
  if(v==="all")return Q;
  if(v==="bm")return Q.filter(q=>BM.has(q.id));
  if(v==="SH")return Q.filter(q=>q.a===SH);
  return Q.filter(q=>q.a===v.slice(2));
}
